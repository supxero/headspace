<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Headspace — Day Planner</title>
<meta name="description" content="A calm daily planner: musts, shoulds and free time.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CFE3F1">
<script>
/* Theme boot: the stored choice must be on <html> before the stylesheet paints,
   or one frame of the other theme flashes. Device preference only, read from its
   own localStorage key; the planner state never carries it and sync never sees it. */
try{
  if(localStorage.getItem('agora_dayplanner_theme')==='mono'){
    document.documentElement.setAttribute('data-theme','mono');
    var __tm=document.querySelector('meta[name="theme-color"]');
    if(__tm) __tm.setAttribute('content','#070708');
  }
}catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Headspace">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* light blue palette adapted from the three references.
     A THEME IS THIS SET OF VALUES and nothing else: every colour, tint, gradient,
     shadow and label face the stylesheet uses reads a variable declared here, and
     [data-theme="mono"] below re-declares the same set. No rule may hardcode a
     colour, or the other theme silently keeps the wrong one. */
  --bg:#EDF4FA;          /* Cloud Blue: the highlighted light background */
  --canvas:#5F86A6;      /* the board's dusty-denim ground behind the columns */
  --panel:#CFE3F1;       /* Powder Sky: rails, columns, framed surfaces */
  --panel2:#C4DBEC;      /* a touch deeper for headers / active tabs */
  --card:#EDF4FA;        /* Cloud Blue again: cards that sit inside panels */
  --line:#B7D0E1; --line2:#9BBBD4;
  --txt:#14293F;         /* deep navy ink */
  --mut:#41627F; --mut2:#6A88A3;
  --navy:#243A5E; --denim:#5F86A6; --ocean:#8FB6D8; --teal:#567C8D;
  --sky:#CFE3F1; --cloud:#EDF4FA; --night:#243A5E; --pearl:#F5F4EF; --tasktile:#E3EEF7;
  --must:#2F4156; --should:#5F86A6; --extra:#7FA7CC;
  --must-t:#2F4156; --should-t:#3F6488; --extra-t:#3C6A8E; /* text-safe zone inks on buttons */
  --done:#46728B;        /* completion: the tick fill, the ring, the "done" marks */
  --today:#567C8D;       /* today's marker: column ring, badge, calendar cell, strip */
  --okdot:#46728B;       /* the sync panel's all-well dot; status, not completion */
  --on:#EDF4FA;          /* light ink used on dark accents (cloud blue, never white) */
  --onpri:#EDF4FA;       /* ink on the primary action and the completion fill */
  --oncanvas:#A9C4DB;    /* hint text sitting directly on the canvas */
  --toastact:#8FB6D8; --toastact-rgb:143,182,216; /* the Undo button inside a toast */
  --grad:linear-gradient(135deg,#2F4156,#5F86A6);          /* text-safe */
  --gradf:linear-gradient(135deg,#2F4156,#5F86A6 55%,#8FB6D8); /* decorative */
  --ring1:#2F4156; --ring2:#5F86A6; --ring3:#8FB6D8;       /* the progress ring's stops */
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(36,58,94,.09),0 8px 22px rgba(36,58,94,.08);
  /* tint anchors: every rgba() in the sheet reads one of these channel triplets,
     so the other theme retints every wash, cue and shadow by changing five lines.
     ink = fills, borders and hover washes; shd = box-shadows and depth only. */
  --ink-rgb:36,58,94; --shd-rgb:36,58,94;
  --denim-rgb:95,134,166; --teal-rgb:86,124,141; --today-rgb:86,124,141;
  --pearl-rgb:245,244,239; --cloud-rgb:237,244,250;
  --must-rgb:47,65,86; --should-rgb:95,134,166; --extra-rgb:127,167,204;
  --scrim:rgba(33,64,95,.4);
  /* decorated surfaces, held whole so a theme can flatten them */
  --bgfx:radial-gradient(760px 480px at 12% -6%, rgba(95,134,166,.20), transparent 62%),
    radial-gradient(680px 520px at 92% 4%, rgba(143,182,216,.24), transparent 60%),
    radial-gradient(720px 560px at 60% 108%, rgba(36,58,94,.08), transparent 62%);
  --railbg:linear-gradient(180deg,rgba(207,227,241,.9),rgba(196,219,236,.75));
  --traybg:linear-gradient(168deg,rgba(245,244,239,.92),rgba(245,244,239,.24) 62%),var(--cloud);
  --trayrim:rgba(245,244,239,.8);
  --trayshadow:inset 0 1px 0 rgba(245,244,239,.95),
    0 0 0 1px rgba(86,124,141,.30),
    0 0 18px rgba(143,182,216,.55),
    0 3px 8px rgba(36,58,94,.14),
    0 14px 34px rgba(36,58,94,.22);
  --sheen:linear-gradient(180deg,rgba(245,244,239,.25),rgba(245,244,239,0) 55%);
  --sheen2:linear-gradient(180deg,rgba(245,244,239,.18),rgba(245,244,239,0) 60%);
  --oscheme:light;       /* native date-control rendering follows the theme */
  --fd:'Space Grotesk','Inter',system-ui,sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* label faces: fdx where a display-face numeral or short uppercase label sits,
     fbx where a body-face one does. In this theme they ARE the base faces; the
     mono theme leads both with its dot-matrix face, body text untouched. */
  --fdx:'Space Grotesk','Inter',system-ui,sans-serif;
  --fbx:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --rail:308px;
}
/* Monochrome: near-black to near-light-grey, one red, dot-matrix numerals, flat.
   Same variable set as :root, different values, nothing else. Surfaces climb the
   grey ramp exactly as the blue theme climbs its own: canvas darkest, then rail,
   column, task tile, pearl brightest. Ink is near-white grey, NEVER #ffffff (the
   brightest value in the theme is #F6F6F7). Red appears only where something must
   stand out: today's marker (--today), completion (--done, the ring stops) and
   the primary action (--grad). Everything decorative flattens: no background
   washes, no sheens, no gradients (flat two-stop stand-ins), no shadow depth. */
:root[data-theme="mono"]{
  --bg:#070708;
  --canvas:#070708;
  --panel:#161619;
  --panel2:#1C1C20;
  --card:#212126;
  --line:#2E2E34; --line2:#40404A;
  --txt:#E9E9EC;
  --mut:#ABABB3; --mut2:#85858D;
  --navy:#ECECEF; --denim:#A9A9B3; --ocean:#616169; --teal:#8E8E99;
  --sky:#161619; --cloud:#212126; --night:#ECECEF; --pearl:#313138; --tasktile:#28282D;
  --must:#E4E4E8; --should:#A5A5AE; --extra:#6F6F79;
  --must-t:#E4E4E8; --should-t:#C0C0C8; --extra-t:#9E9EA8;
  --done:#E8443C;
  --today:#E8443C;
  --okdot:#8E8E99;
  --on:#151518;
  --onpri:#F6F6F7;
  --oncanvas:#9B9BA5;
  --toastact:#151518; --toastact-rgb:21,21,24;
  --grad:linear-gradient(135deg,#E8443C,#E8443C);
  --gradf:linear-gradient(135deg,#E9E9EC,#E9E9EC);
  --ring1:#E8443C; --ring2:#E8443C; --ring3:#E8443C;
  --shadow:0 0 rgba(0,0,0,0);
  --ink-rgb:233,233,236; --shd-rgb:0,0,0;
  --denim-rgb:169,169,179; --teal-rgb:142,142,152; --today-rgb:232,68,60;
  --pearl-rgb:49,49,56; --cloud-rgb:22,22,25;
  --must-rgb:228,228,232; --should-rgb:165,165,174; --extra-rgb:111,111,121;
  --scrim:rgba(0,0,0,.55);
  --bgfx:none;
  --railbg:linear-gradient(180deg,#161619,#161619);
  --traybg:#313138;
  --trayrim:#4A4A54;
  --trayshadow:0 0 0 1px #4A4A54;
  --sheen:none;
  --sheen2:none;
  --oscheme:dark;
  --fdx:'Silkscreen','Space Grotesk','Inter',system-ui,sans-serif;
  --fbx:'Silkscreen','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:14.5px;line-height:1.45;overflow:hidden}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--bgfx);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:radial-gradient(rgba(var(--ink-rgb),.55) .5px, transparent .5px);
  background-size:3px 3px;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{background:var(--cloud);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14px;outline:none;color:var(--txt)}
input:focus,select:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(var(--denim-rgb),.24)}
select option{background:var(--pearl);color:var(--txt)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(var(--ink-rgb),.22);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--ink-rgb),.34)}
::-webkit-scrollbar-track{background:transparent}

/* shell */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh}
#app>*{min-width:0}
#rail{border-right:1px solid var(--line);background:var(--railbg);backdrop-filter:blur(8px);padding:16px 14px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#main{min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:14px 16px 0;background:var(--canvas)}

/* brand */
.brandrow{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--gradf);flex:none;display:grid;place-items:center;box-shadow:0 6px 18px rgba(var(--shd-rgb),.28)}
.mark i{width:11px;height:11px;border-radius:50%;background:var(--cloud);display:block}
.brand{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1.1}
.brand span{display:block;font-family:var(--fbx);font-weight:600;font-size:10.5px;color:var(--txt);letter-spacing:.09em;text-transform:uppercase}
.savebadge{font-size:10.5px;color:var(--teal);background:rgba(var(--teal-rgb),.14);border:1px solid rgba(var(--teal-rgb),.34);padding:3px 9px;border-radius:99px;white-space:nowrap;align-self:center;margin-left:auto}
.savebadge.warn{color:var(--navy);border-color:rgba(var(--ink-rgb),.34);background:rgba(var(--ink-rgb),.09)}

/* rail buttons */
.navgrp{display:flex;flex-direction:column;gap:6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r2);font-size:13.5px;font-weight:500;color:var(--mut);border:1px solid transparent;transition:.16s}
.navbtn:hover{background:rgba(var(--ink-rgb),.06);color:var(--txt)}
.navbtn.on{background:var(--pearl);border-color:var(--line2);color:var(--navy);box-shadow:var(--shadow)}
.navbtn .em{width:18px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.navbtn .em svg{width:17px;height:17px}
.navbtn .cnt{margin-left:auto;font-size:11px;color:var(--mut);background:rgba(var(--ink-rgb),.08);padding:1px 7px;border-radius:99px}
.railcap{font-family:var(--fbx);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);padding:0 2px;margin-top:2px}
.railfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.railfoot button{flex:1 1 31%;padding:8px;border-radius:9px;font-size:12px;color:var(--mut);border:1px solid var(--line);background:var(--cloud);transition:.16s}
.railfoot button:hover{color:var(--navy);border-color:var(--line2)}

/* cards */
.kard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
.kh{display:flex;align-items:center;gap:8px;font-family:var(--fbx);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.kh .sp{margin-left:auto;font-family:var(--fb);text-transform:none;letter-spacing:0;font-weight:500;color:var(--mut2)}
/* the one chevron every collapsible panel header uses: right when collapsed, down when open */
.chev{width:12px;height:12px;flex:none;color:var(--mut2);transition:transform .18s ease}
.chev.open{transform:rotate(90deg)}
.kh[data-action],.hhead[data-action]{cursor:pointer;user-select:none}
.kh.solo{margin-bottom:0}
@media (hover:hover){
  .kh[data-action]:hover,.hhead[data-action]:hover{color:var(--navy)}
  .kh[data-action]:hover .chev,.hhead[data-action]:hover .chev{color:var(--navy)}
}

/* focus (True north): a statement panel, not a task list. Its presence in the
   rail comes only from levers the app already has: the pearl surface against the
   rail's powder, the deeper input line colour on the same 1px border, a touch
   more padding, and the display face for the statement itself. No new colour,
   no gradient, no stripe, no icon; row hairlines and the tick are gone because
   a statement is read, not processed. */
#fpanel{background:var(--pearl);border-color:var(--line2);padding:15px 15px 14px}
.frow{display:flex;align-items:flex-start;gap:8px;padding:8px 0}
.ftxt{flex:1;min-width:0;word-break:break-word;font-family:var(--fd);
  font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.45;color:var(--navy)}
.frow .mini{margin-top:3px}
/* a set-aside statement mutes and shrinks back to body type; never struck through */
.frow.done{padding:5px 0}
.frow.done .ftxt{font-family:var(--fb);font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--mut2)}
.frow.done .mini{margin-top:0}
.fdate{font-size:10.5px;color:var(--mut2);display:block;margin-top:1px}
.mini{font-size:11px;color:var(--mut2);padding:2px 5px;border-radius:6px;transition:.14s}
.mini:hover{color:var(--navy);background:rgba(var(--ink-rgb),.08)}
.box{width:17px;height:17px;border-radius:6px;border:1.6px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:transparent;transition:.16s}
.box:hover{border-color:var(--done)}
.box.on{background:var(--done);border-color:var(--done);color:var(--onpri)}
.box.pop{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.fadd{display:flex;gap:6px;margin-top:9px}
.fadd input{flex:1;padding:7px 9px;font-size:13px}
.fadd button{padding:7px 12px;border-radius:9px;background:var(--grad);color:var(--onpri);font-weight:600;font-size:12.5px}
.fdone{margin-top:8px;font-size:11.5px;color:var(--mut2);cursor:pointer;user-select:none}

/* metrics */
.mtabs{display:flex;gap:3px;margin-left:auto;background:rgba(var(--ink-rgb),.07);padding:2px;border-radius:8px}
.mtabs button{font-size:10.5px;padding:3px 8px;border-radius:6px;color:var(--mut);font-weight:500}
.mtabs button.on{background:var(--cloud);color:var(--navy);box-shadow:0 1px 2px rgba(var(--shd-rgb),.12)}
.ringwrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rlab{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rlab b{font-family:var(--fdx);font-size:21px;font-weight:700;letter-spacing:-.02em;display:block;color:var(--navy)}
.ring .rlab i{font-style:normal;font-family:var(--fbx);font-size:9.5px;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase}
.rp{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
/* the ring's paints come from the theme: the track tint, and the bar's gradient
   stops (a flat colour in mono, where all three stops agree) */
.ring .rt{stroke:rgba(var(--ink-rgb),.12)}
#rg stop:nth-of-type(1){stop-color:var(--ring1)}
#rg stop:nth-of-type(2){stop-color:var(--ring2)}
#rg stop:nth-of-type(3){stop-color:var(--ring3)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px;color:var(--mut)}
.legend b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.dotm{width:7px;height:7px;border-radius:50%;flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-family:var(--fdx);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.statsub{font-size:11px;color:var(--mut2);margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:2px}
.bar{flex:1;min-width:0;border-radius:5px 5px 3px 3px;background:var(--gradf);transition:height .45s cubic-bezier(.4,0,.2,1);min-height:3px;position:relative}
.bar.now{box-shadow:0 0 0 1.5px var(--today)}
.barlbl{display:flex;gap:6px;margin-top:5px;font-family:var(--fbx);font-size:9.5px;color:var(--mut2)}
.barlbl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.goalbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.goalbar .gt{display:flex;font-size:11px;color:var(--mut);margin-bottom:6px}
.goalbar .gt b{margin-left:auto;color:var(--txt);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:rgba(var(--ink-rgb),.10);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--gradf);transition:width .55s cubic-bezier(.4,0,.2,1)}

/* quick add */
#quickadd{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#qi{flex:1;min-width:180px;min-height:44px;padding:11px 13px;font-size:14.5px;line-height:1.4;background:var(--pearl);border:1px solid var(--line2);border-radius:var(--r2);resize:none;overflow:hidden;max-height:170px;outline:none;box-shadow:var(--shadow)}
#qi:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(var(--denim-rgb),.24)}
#qi::placeholder{color:var(--mut2)}
#qd{padding:11px 10px;font-size:13px;max-width:190px;background:var(--pearl)}
#qb{padding:11px 18px;border-radius:var(--r2);background:var(--grad);color:var(--onpri);font-weight:700;font-size:14px;letter-spacing:-.01em;transition:.15s;box-shadow:var(--shadow)}
#qb:active{transform:scale(.97)}

/* carry tray */
#tray:not(:empty){margin-bottom:12px}
/* The brightest surface on the board, so it reads as the one panel asking to be dealt
   with first: a pearl sheen over the same cloud blue the day columns use, a pearl rim
   catching the light, a teal ring and a soft ocean glow just outside it, and more
   elevation than a column, with a 2px lift so it sits forward of the canvas. */
.tray{border:1px solid var(--trayrim);border-radius:var(--r);padding:11px 13px;
  background:var(--traybg);
  transform:translateY(-2px);
  box-shadow:var(--trayshadow);
  animation:traydrop .34s ease}
@keyframes traydrop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(-2px)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.trayhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.trayhead b{font-family:var(--fd);font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:7px}
.trayhead b::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.trayhead .why{font-size:11.5px;color:var(--mut)}
.trayhead .acts{margin-left:auto;display:flex;gap:6px}
/* tray only: powder keeps the controls readable now the panel behind them is brighter */
.tbtn{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);color:var(--navy);background:var(--panel);transition:.15s}
.tbtn:hover{background:var(--panel2)}
.trayitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(var(--ink-rgb),.13);font-size:13px}
.trayitem .from{font-size:10.5px;color:var(--mut);background:rgba(var(--ink-rgb),.08);padding:1px 7px;border-radius:99px;white-space:nowrap}
.trayitem .t{flex:1;min-width:0;word-break:break-word}

/* recycle bin */
.binrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line)}
.binrow .bt{flex:1;min-width:0}
.binrow .bt b{display:block;font-size:13px;font-weight:600;color:var(--txt);word-break:break-word}
.binrow .bt span{font-size:11px;color:var(--mut)}
.binrow .nbtn{flex:none;font-size:11.5px;padding:6px 10px}

/* board nav */
#boardnav{display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.nbtn{padding:7px 12px;border-radius:9px;font-size:12.5px;color:var(--navy);border:1px solid var(--line);background:var(--pearl);transition:.15s;font-weight:500}
.nbtn:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
.nbtn:hover{color:var(--navy);border-color:var(--line2)}
.nbtn.solid{background:var(--navy);border-color:rgba(var(--cloud-rgb),.32);color:var(--on)}
#boardnav .jl{font-size:11.5px;color:var(--oncanvas);margin-left:6px}
#boardnav input[type=date]{padding:6px 9px;font-size:12.5px;color-scheme:var(--oscheme)}
.offnote{font-size:11.5px;color:var(--ocean);margin-left:auto;font-weight:600}

/* board */
#board{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-bottom:16px;flex:1;min-width:0;align-items:flex-start}
.col{width:268px;flex:none;display:flex;flex-direction:column;max-height:100%;background:var(--cloud);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.anim .col{animation:rise .34s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.col.today{border-color:var(--today);box-shadow:0 0 0 1px rgba(var(--today-rgb),.35),var(--shadow)}
.col.past{opacity:.66}
.colhead{padding:11px 12px 9px;border-bottom:1px solid var(--line);flex:none;background:rgba(var(--ink-rgb),.03)}
/* a Free Floating tab header is the tab's drag handle; day column headers are not */
.backlog .colhead{cursor:grab}
.backlog .colhead:active{cursor:grabbing}
/* tab drag: the grabbed column stays in place as a ghost in the dashed-denim
   drag language every drop surface already speaks; the target keeps the dashed
   cue, and an inset bar on its near or far edge names the exact landing side */
.col.backlog{position:relative}
.col.dragging{opacity:.45;border-style:dashed;border-color:var(--denim)}
.col.drop{outline:1.5px dashed var(--denim);outline-offset:3px}
.col.drop-before::after,.col.drop-after::after{content:'';position:absolute;top:12px;bottom:12px;width:3px;
  border-radius:2px;background:var(--denim);pointer-events:none;animation:fade .18s ease}
.col.drop-before::after{left:5px}
.col.drop-after::after{right:5px}
.colhead .d1{display:flex;align-items:baseline;gap:7px}
/* rename and delete sit together in a tab header, so they need to match each other */
.backlog .colhead .mini{align-self:center;display:inline-flex;align-items:center;justify-content:center;min-width:21px}
.colhead .dow{font-family:var(--fdx);font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--navy);text-transform:uppercase}
.colhead .dnum{font-family:var(--fbx);font-size:11.5px;color:var(--mut);text-transform:uppercase}
.badge{margin-left:auto;font-family:var(--fbx);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:rgba(var(--today-rgb),.2);color:var(--today);border:1px solid rgba(var(--today-rgb),.42)}
.colhead .meta{font-size:11px;color:var(--mut);margin-top:3px}
.heavy{margin-top:7px;font-size:11px;padding:5px 8px;border-radius:8px;background:rgba(var(--ink-rgb),.10);border:1px solid rgba(var(--ink-rgb),.32);color:var(--navy)}
.colbody{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:11px;min-height:60px}
.zone{border-radius:var(--r2);padding:2px}
.zone.drop{outline:1.5px dashed var(--denim);outline-offset:2px;background:rgba(var(--denim-rgb),.12)}
.zh{display:flex;align-items:center;gap:6px;font-family:var(--fbx);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:2px 3px 6px}
.zh .pip{width:6px;height:6px;border-radius:50%;flex:none}
.zh .lk{width:12px;height:12px;margin-left:2px;color:var(--denim);flex:none}
.zh .n{margin-left:auto;font-weight:500;letter-spacing:0;font-size:10.5px}
.zone.locked{opacity:.55}
.lockmsg{font-size:11px;color:var(--mut2);padding:4px 4px 6px;font-style:italic}
.freego{font-size:11px;color:var(--teal);padding:4px 4px 6px;font-weight:600}
.zadd{width:100%;text-align:left;font-size:11.5px;color:var(--mut2);padding:5px 6px;border-radius:7px;transition:.14s;margin-top:2px}
.zadd:hover{background:rgba(var(--ink-rgb),.06);color:var(--navy)}

/* task card */
.task{background:var(--tasktile);border:1px solid var(--line);border-radius:var(--r2);padding:8px 9px;margin-bottom:6px;transition:.15s;box-shadow:0 1px 1px rgba(var(--shd-rgb),.06)}
.task:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.task.sel{border-color:var(--denim);background:var(--cloud);box-shadow:0 0 0 1px rgba(var(--denim-rgb),.4),var(--shadow)}
.task.dragging{opacity:.4}
.task.flash{animation:flash .7s ease}
@keyframes flash{0%{background:rgba(var(--denim-rgb),.4)}100%{background:var(--tasktile)}}
.trow{display:flex;align-items:flex-start;gap:8px}
.ttl{flex:1;min-width:0;font-size:13.5px;line-height:1.35;word-break:break-word;cursor:pointer}
.task.done .ttl{color:var(--mut2);text-decoration:line-through}
.subn{font-family:var(--fbx);font-size:10.5px;color:var(--mut2);white-space:nowrap;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.abtn{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mut);background:var(--panel);transition:.14s;white-space:nowrap}
.abtn:hover{color:var(--navy);border-color:var(--line2);background:var(--panel2)}
.abtn.m{color:var(--must-t);border-color:rgba(var(--must-rgb),.4)}
.abtn.s{color:var(--should-t);border-color:rgba(var(--should-rgb),.45)}
.abtn.e{color:var(--extra-t);border-color:rgba(var(--extra-rgb),.5)}
/* the one destructive control in the bar, on a day card and inside a Free Floating tab
   alike, so it reads as deliberate instead of as another neutral button. Navy inversion,
   the same idiom the day strip already uses. */
.abtn.del{color:var(--navy);border-color:var(--line2)}
.abtn.del:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
.acts select{font-size:11px;padding:3px 6px;border-radius:7px}
.sbody{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;padding:2px 0}
.sub.dragging{opacity:.4}
.sub .st{flex:1;min-width:0;word-break:break-word;line-height:1.3}
.sub.done .st{color:var(--mut2);text-decoration:line-through}
.sbox{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:9px;color:transparent;transition:.15s}
.sbox.on{background:var(--done);border-color:var(--done);color:var(--onpri)}
.saddrow{display:flex;gap:5px;margin-top:3px}
.saddrow input{flex:1;padding:5px 8px;font-size:12px;border-radius:7px;min-width:0}
.zaddrow .addcancel{flex:none;padding:5px 9px;color:var(--mut)}
[contenteditable]{outline:none;border-bottom:1.5px solid var(--denim);padding-bottom:1px}

/* habits: a commitment band under the board, same surface language as a column */
#habits:not(:empty){margin-top:2px;padding-bottom:16px;flex:none}
.hpanel{background:var(--cloud);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 13px}
.hhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hhead b{font-family:var(--fd);font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:7px}
.hhead b::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.hhead .hsub{font-size:11.5px;color:var(--mut)}
.hhead .mini{margin-left:auto}
.hhead .hcnt{margin-left:auto;color:var(--mut2)}
.hgridwrap{overflow-x:auto;margin-top:9px}
.hgrid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(6,40px) auto auto;gap:3px 4px;align-items:center}
.hdow{text-align:center;font-family:var(--fbx);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.hdow.now{color:var(--today)}
.hname{font-size:13px;line-height:1.3;word-break:break-word;padding:2px 4px;border-radius:6px;cursor:pointer}
.hname:hover{background:rgba(var(--ink-rgb),.06)}
.hbox{width:19px;height:19px;justify-self:center;margin-top:0}
.hdash{text-align:center;color:var(--mut2);opacity:.55;font-size:12px;user-select:none}
.hday{font-size:10px;padding:4px 0;border-radius:7px;border:1px solid var(--line);color:var(--mut);background:var(--cloud);transition:.14s}
.hday:hover{border-color:var(--line2);color:var(--navy)}
.hday:active{transform:scale(.93)}
.hday.on{background:var(--pearl);border-color:var(--denim);color:var(--navy);font-weight:600}
.haddrow{display:flex;gap:6px;margin-top:10px}
.haddrow input{flex:1;padding:7px 9px;font-size:13px;min-width:0}
.haddrow .nbtn{flex:none}
@media (max-width:900px){
  .hgrid{grid-template-columns:minmax(88px,1fr) repeat(6,34px) auto auto}
  .hbox{width:20px;height:20px}
  .hday{min-height:30px}
  .haddrow input{font-size:16px;min-height:42px}
}
/* rail placement (desktop): 254px inside the kard cannot hold a name beside six cells
   and their controls, so each habit is two lines and the cells get the full width */
#habitsRail:empty,#weekRail:empty,#weekMobile:empty{display:none}
#weekMobile:not(:empty){padding-bottom:16px}
.hcard .kh .mini,.wcard .kh .mini{text-transform:none;letter-spacing:0;font-weight:500}
.hrdow,.hrcells{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;justify-items:center;align-items:center}
.hrdow{margin-bottom:2px}
.hrail .hdow{padding:2px 0}
.hrname{display:flex;align-items:center;gap:5px;margin-top:8px}
.hrname .hname{flex:1;min-width:0;padding:1px 4px}
.hrcells{margin-top:3px}
.hrcells .hbox{width:20px;height:20px}
.hrcells .hday{width:100%;min-height:24px}
.hcard .haddrow{margin-top:11px}
.hcard .haddrow input,.wcard .fadd input{font-size:13px}
.wcard .ftxt span{cursor:pointer}

/* calendar */
#cal{flex:1;overflow-y:auto;padding-bottom:16px;min-width:0}
.calbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.calbar h2{font-family:var(--fd);font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;color:var(--navy)}
.chip{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(var(--teal-rgb),.18);border:1px solid rgba(var(--teal-rgb),.38);color:var(--teal);display:inline-flex;align-items:center;gap:7px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.caldow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.caldow div{text-align:center;font-family:var(--fbx);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);padding:2px}
.cell{min-height:74px;border-radius:var(--r2);padding:6px 7px;border:1px solid var(--line);background:var(--card);transition:.15s;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.cell:hover{background:var(--panel)}
.cell.blank{border:none;background:none;cursor:default;min-height:0}
.cell.today{border-color:var(--today)}
.cell.sel{border-color:var(--denim);background:rgba(var(--denim-rgb),.14)}
.cell .n{font-family:var(--fbx);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.cell.today .n{color:var(--today);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots .more{font-size:9px;color:var(--mut2);line-height:6px}
.cell .allok{font-size:11px;color:var(--today)}
.dpanel{margin-top:16px}
.dphead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.dphead b{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--navy)}
.dpadd{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.dpadd input{flex:1;min-width:160px}
.dplist{max-width:640px}

/* notes: the list panel borrows the column surface; the editor page sits directly
   beside it, one continuous surface, and the READING measure is the text column
   inside the page (.notewrap), not the page's placement. Every size already exists
   in the app: the title is the calendar-h2 face (19px --fd 600), the body 15px --fb,
   the meta line the 11px muted small print. The body is a contenteditable div, so
   it grows with its text and .noteed is the scroller: no inner scrollbar box. */
#notes{flex:1;min-width:0;gap:14px;padding-bottom:16px;align-items:stretch;overflow:hidden}
.notelist{width:272px;flex:none;display:flex;flex-direction:column;gap:7px;background:var(--cloud);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px;overflow-y:auto}
#noteSearch{width:100%;font-size:13px;background:var(--pearl)}
#noteRows{display:flex;flex-direction:column;gap:7px}
.noterow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;
  padding:8px 10px;border-radius:var(--r2);border:1px solid transparent;transition:.15s}
.noterow.on{background:var(--pearl);border-color:var(--line2);box-shadow:var(--shadow)}
.noterow .nt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--txt);max-width:100%}
.noterow .nt svg{width:11px;height:11px;flex:none;color:var(--denim)}
.noterow .ntx,.noterow .nsub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noterow .nsub{font-size:11px;color:var(--mut2)}
@media (hover:hover){ .noterow:hover{background:rgba(var(--ink-rgb),.06)} .noterow.on:hover{background:var(--pearl)} }
.noterow:active{transform:scale(.99)}
.noteed{flex:1;min-width:0;overflow-y:auto;padding:2px 6px 18px 0}
/* the page sits directly beside the list, one continuous surface like board-and-rail,
   and ENDS with its content: the text column declares the reading measure as its
   preferred width and the page fits that (fit-content), so title, meta, toolbar and
   body all share the same edges and the measure is written exactly once. Past the
   page's edge the denim canvas shows, the same way it does past the board's columns. */
.notepage{width:fit-content;max-width:100%;background:var(--pearl);border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:var(--shadow);padding:22px 30px 30px;display:flex;flex-direction:column}
.notepage:focus-within{border-color:var(--denim);box-shadow:0 0 0 3px rgba(var(--denim-rgb),.14),var(--shadow)}
.notewrap{width:640px;max-width:100%;min-width:0}
#noteTitle{width:100%;min-width:0;border:none;background:transparent;box-shadow:none;border-radius:0;
  padding:0 0 6px;font-family:var(--fd);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--navy)}
#noteTitle:focus{border:none;box-shadow:none}
.notemeta{display:flex;align-items:center;gap:6px;padding:0 0 7px}
#noteMeta{font-size:11px;color:var(--mut2);margin-right:auto}
.nact{font-size:11.5px;font-weight:500;color:var(--mut);padding:4px 9px;border-radius:7px;
  border:1px solid transparent;transition:.15s}
@media (hover:hover){ .nact:hover{color:var(--navy);border-color:var(--line)} }
.nact:active{transform:scale(.95)}
.nact.on{color:var(--denim);border-color:var(--line)}
/* the toolbar: one quiet strip, always there while a note is open. Small letterform
   buttons, palette swatches, list glyphs, the page select at the end. */
.ntools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:3px 0 7px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.ntb{min-width:28px;padding:4px 7px;border-radius:7px;font-size:12.5px;font-weight:600;
  color:var(--mut);border:1px solid transparent;transition:.15s;line-height:1.25}
@media (hover:hover){ .ntb:hover{color:var(--navy);border-color:var(--line)} }
.ntb:active{transform:scale(.93)}
.ntb.on{color:var(--navy);background:rgba(var(--ink-rgb),.09);border-color:var(--line2)}
.ntb .swc{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid var(--line2);vertical-align:-2px}
.ntb .a1{font-size:10.5px}.ntb .a2{font-size:12.5px}.ntb .a3{font-size:15.5px}
.ntsep{width:1px;height:15px;background:var(--line);margin:0 5px;flex:none}
#notePage{margin-left:auto;font-size:12px;padding:4px 7px;background:var(--pearl)}
#noteBody{width:100%;border:none;background:transparent;box-shadow:none;border-radius:0;
  padding:0 0 8px;min-height:240px;font-size:15px;line-height:1.7;color:var(--txt);outline:none;
  white-space:pre-wrap;overflow-wrap:break-word}
#noteBody:empty::before{content:attr(data-ph);color:var(--mut2);pointer-events:none}
/* formatted content: every colour and size is one the app already uses */
#noteBody .hl-powder{background:var(--panel)}
#noteBody .hl-ocean{background:var(--ocean)}
#noteBody .hl-tile{background:var(--tasktile)}
#noteBody .fz-s{font-size:13px}
#noteBody .fz-l{font-size:19px;line-height:1.45}
#noteBody ul,#noteBody ol{margin:0;padding-left:1.6em}
#noteBody ul.dash{list-style-type:circle;list-style-type:'-  '}
/* page appearance, drawn UNDER the text: hairlines and dots from the palette, kept
   faint enough that navy ink always wins. em-based so the ruling tracks the type. */
#noteBody.pg-ruled{background-image:linear-gradient(to top,rgba(var(--denim-rgb),.26) 1px,transparent 1px);
  background-size:100% 1.7em;background-position:0 .12em}
#noteBody.pg-dot{background-image:radial-gradient(rgba(var(--ink-rgb),.17) 1px,transparent 1.4px);
  background-size:1.13em 1.13em;background-position:.3em .55em}
@media (max-width:900px){
  #notes{flex-direction:column;overflow:visible}
  .notelist{width:100%;max-height:38vh;flex:none}
  .noteed{overflow:visible;padding:0}
  .notepage{width:auto;padding:16px 16px 24px}
  .notewrap{width:auto;max-width:none}
  /* 16px keeps the browser from zooming the page when the field takes focus */
  #noteSearch{font-size:16px;min-height:44px}
  #noteTitle{font-size:17px;min-height:44px}
  #noteBody{min-height:40vh;font-size:16px}
}

/* custom pickers (desktop pointer): a popover layered over the native date input and the
   quick-add destination select, since neither can be styled and the OS blue highlight
   fights the palette. Touch devices keep the native controls. */
.popover{position:fixed;z-index:250;background:var(--card);border:1px solid var(--line2);
  border-radius:var(--r);padding:9px;box-shadow:0 4px 10px rgba(var(--shd-rgb),.14),0 18px 44px rgba(var(--shd-rgb),.26);
  animation:drop .2s cubic-bezier(.2,.7,.3,1);outline:none}
.plist{max-height:min(340px,62vh);overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.pgl{font-family:var(--fbx);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:8px 9px 4px}
.popt{display:block;width:100%;text-align:left;font-size:13px;padding:7px 10px;border-radius:7px;
  color:var(--txt);border:1px solid transparent;transition:.14s;white-space:nowrap}
.popt:hover,.popt.act{background:rgba(var(--ink-rgb),.07);color:var(--navy)}
.popt.on{background:rgba(var(--denim-rgb),.16);border-color:var(--denim);color:var(--navy);font-weight:600}
.phead{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.phead b{flex:1;text-align:center;font-family:var(--fd);font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:var(--navy)}
.phead .nbtn{padding:4px 10px;font-size:12px}
.pdow{display:grid;grid-template-columns:repeat(7,34px);gap:2px;margin-bottom:2px}
.pdow span{text-align:center;font-family:var(--fbx);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:2px 0}
.pgrid{display:grid;grid-template-columns:repeat(7,34px);gap:2px}
.pday{height:31px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;
  font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--txt);transition:.14s}
.pday:hover{background:var(--panel)}
.pday.today{border-color:var(--today);color:var(--today);font-weight:700}
.pday.on{border-color:var(--denim);background:rgba(var(--denim-rgb),.14)}
.pday.act{border-color:var(--denim);background:rgba(var(--denim-rgb),.22)}
.pfoot{display:flex;gap:6px;margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
.pfoot .nbtn{flex:1;padding:6px 10px;font-size:12px}
/* the custom layer replaces the built-in popup on pointer devices, so hide its icon
   there, and repaint the focused segment, which is the last place OS blue could show */
@media (hover:hover){
  input[type=date]::-webkit-calendar-picker-indicator{display:none}
  input[type=date]::-webkit-datetime-edit-month-field:focus,
  input[type=date]::-webkit-datetime-edit-day-field:focus,
  input[type=date]::-webkit-datetime-edit-year-field:focus{
    background:var(--denim);color:var(--on);border-radius:3px}
}

/* modal / toast */
.mback{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:22px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;animation:drop .24s cubic-bezier(.2,.7,.3,1);box-shadow:0 24px 60px rgba(var(--shd-rgb),.28)}
.modal h3{font-family:var(--fd);font-size:19px;font-weight:600;margin:0 0 12px;letter-spacing:-.02em;color:var(--navy)}
.modal p{font-size:13.5px;color:var(--mut);margin:0 0 11px;line-height:1.55}
.modal p b{color:var(--txt)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mrow button{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line2);color:var(--navy);background:var(--panel)}
.mrow button.pri{background:var(--grad);color:var(--onpri);border-color:transparent}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300}
.toast{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;background:var(--navy);color:var(--on);border:1px solid rgba(var(--ink-rgb),.5);font-size:13px;box-shadow:0 12px 40px rgba(var(--shd-rgb),.4)}
.toast button{font-size:12.5px;font-weight:700;color:var(--toastact);padding:3px 8px;border-radius:7px}
.toast button:hover{background:rgba(var(--toastact-rgb),.2)}
.empty{font-size:12px;color:var(--mut2);padding:10px 4px;font-style:italic}

/* sync panel */
.syncrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.syncrow input{flex:1;min-width:190px;font-size:12.5px;letter-spacing:.02em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--pearl)}
.syncstat{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.5;color:var(--mut);
  background:var(--pearl);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;margin-bottom:12px}
.syncstat .sdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--mut2)}
.syncstat.busy .sdot{background:var(--denim)}
.syncstat.synced .sdot{background:var(--okdot)}
.syncstat.offline .sdot{background:var(--ocean)}
.syncstat.error .sdot,.syncstat.conflict .sdot{background:var(--navy)}
.synchint{font-size:11.5px!important;color:var(--mut2)!important;line-height:1.5}

/* day strip (mobile) */
#strip{display:none;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:9px}
#strip button{flex:none;padding:7px 12px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);color:var(--navy);background:var(--pearl);white-space:nowrap}
#strip button:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
#strip button.on{background:var(--navy);border-color:rgba(var(--cloud-rgb),.32);color:var(--on)}
#strip button.istoday{border-color:var(--today)}
#railtoggle{display:none}

/* responsive */
@media (max-width:900px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;height:auto;min-height:100dvh}
  #rail{border-right:none;border-bottom:1px solid var(--line);overflow:visible;position:static;padding:12px 14px;gap:11px}
  #rail .railhide{display:none!important}
  #rail.open .railhide{display:flex!important}
  #rail .navgrp{flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px}
  #rail .navgrp .navbtn{width:auto;flex:none;padding:8px 12px;white-space:nowrap}
  /* phones: Help, Sync, Export and Import sit at the top of the opened menu,
     so they are not buried under every momentum card. Desktop keeps them at the foot. */
  #rail .railfoot{order:-1;margin-top:0;padding-top:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
  #rail .railfoot button{min-height:42px;font-size:12.5px}
  #railtoggle{display:inline-flex;margin-left:auto;font-size:12px;color:var(--mut);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
  #main{overflow:visible;padding:12px 14px 40px;max-width:100vw}
  #board,#cal,#quickadd,#boardnav,#strip,#tray{max-width:100%}
  #quickadd{gap:7px}
  #qi{flex:1 1 100%;min-width:0;min-height:46px}
  #qd{flex:1;min-width:0;max-width:none}
  #qb{flex:none;padding:11px 22px}
  #boardnav{gap:6px}
  #boardnav .jl{margin-left:0}
  .calgrid,.caldow{gap:4px}
  .cell{min-height:58px;padding:4px 5px}
  #board{overflow-x:visible;flex-direction:column;padding-bottom:0}
  .col{width:100%;max-height:none}
  .colbody{overflow-y:visible;max-height:none}
  #strip{display:flex}
  .duo{grid-template-columns:1fr 1fr}
  /* stacked columns: the landing-side bar turns horizontal, same as the midpoint axis */
  .col.drop-before::after,.col.drop-after::after{left:12px;right:12px;width:auto;height:3px}
  .col.drop-before::after{top:5px;bottom:auto}
  .col.drop-after::after{top:auto;bottom:5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- interaction polish (hover, press, focus) ---------- */
:where(button,input,select,textarea):focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.nbtn,.tbtn,.abtn,.navbtn,.mini,.zadd,.railfoot button,.mtabs button,#strip button,#qb,.fadd button,.mrow button,.box,.sbox,.cell,#qd,.task{
  transition:transform .16s cubic-bezier(.33,1.35,.6,1),box-shadow .22s ease,background-color .18s ease,background-position .5s ease,border-color .18s ease,color .18s ease,opacity .2s ease}
/* press glow */
.nbtn,.tbtn,.abtn,.navbtn,.railfoot button,#strip button,#qb,.fadd button,.mrow button{position:relative;overflow:hidden}
.nbtn::after,.tbtn::after,.abtn::after,.navbtn::after,.railfoot button::after,#strip button::after,#qb::after,.fadd button::after,.mrow button::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:scale(.55);
  background:radial-gradient(closest-side at 50% 50%,rgba(var(--ink-rgb),.18),transparent 92%);
  transition:opacity .5s ease,transform .5s ease}
#qb::after,.fadd button::after,.mrow button.pri::after,.nbtn.solid::after,#strip button.on::after{
  background:radial-gradient(closest-side at 50% 50%,rgba(var(--pearl-rgb),.55),transparent 92%)}
.nbtn:active::after,.tbtn:active::after,.abtn:active::after,.navbtn:active::after,.railfoot button:active::after,#strip button:active::after,#qb:active::after,.fadd button:active::after,.mrow button:active::after{
  opacity:1;transform:scale(1.9);transition:opacity 0s,transform 0s}
/* sheen + gradient drift on primary buttons (the sheen layer is a theme choice:
   the flat theme sets it to none and the layered background collapses to a plain fill) */
#qb,.fadd button,.mrow button.pri{
  background-image:var(--sheen),var(--grad);
  background-size:100% 100%,170% 170%;background-position:0 0,0% 50%}
.nbtn.solid,#strip button.on{background-image:var(--sheen2)}
/* hover: pointer devices only, so phones never get sticky hover states */
@media (hover:hover){
  .nbtn:hover,.tbtn:hover,.railfoot button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(var(--shd-rgb),.18)}
  .abtn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(var(--shd-rgb),.14)}
  .abtn.del:hover{background:var(--navy);border-color:var(--navy);color:var(--on)}
  .navbtn:hover{transform:translateX(3px)}
  .navbtn.on:hover{transform:none}
  .zadd:hover{background:rgba(var(--ink-rgb),.07)}
  .mini:hover{transform:scale(1.15)}
  .box:hover{transform:scale(1.12)}
  .sbox:hover{transform:scale(1.12);border-color:var(--done)}
  .mtabs button:hover{color:var(--navy)}
  #qb:hover,.fadd button:hover,.mrow button.pri:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(var(--shd-rgb),.3);background-position:0 0,100% 50%}
  .nbtn.solid:hover{box-shadow:0 6px 16px rgba(var(--shd-rgb),.35)}
  .cell:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(var(--shd-rgb),.12)}
  .task:hover{box-shadow:0 4px 12px rgba(var(--shd-rgb),.14)}
  #qd:hover,.acts select:hover{border-color:var(--line2)}
}
/* press feedback: every device */
.nbtn:active,.tbtn:active,.railfoot button:active,.mtabs button:active{transform:scale(.95)}
.abtn:active{transform:scale(.93)}
.navbtn:active{transform:scale(.97)}
.zadd:active{transform:scale(.98);background:rgba(var(--ink-rgb),.09)}
.mini:active{transform:scale(.9)}
.box:active,.sbox:active{transform:scale(.86)}
#qb:active,.fadd button:active,.mrow button:active,#strip button:active{transform:scale(.94)}
.task:active{transform:scale(.99)}
#toast{bottom:calc(22px + env(safe-area-inset-bottom))}
/* ---------- mobile polish: bigger targets, softer depth, cleaner strip ---------- */
@media (max-width:900px){
  .navbtn,#strip button{min-height:42px}
  .nbtn{min-height:40px}
  #qb{min-height:48px}
  .fadd button{min-height:40px}
  .mrow button{min-height:44px}
  .abtn{min-height:34px;padding:6px 11px}
  /* tab header controls get a real tap target, without touching the subtask minis */
  .backlog .colhead .mini{min-width:34px;min-height:34px;font-size:13px}
  /* the action bar wraps rather than overflowing, so nothing in it may outgrow the card */
  .acts{gap:5px}
  .acts input[type=date],.acts select{max-width:100%}
  .tbtn{min-height:36px}
  /* carry tray: the task reads on its own line so the triage buttons stay tappable */
  .trayhead .acts{margin-left:0;width:100%}
  .trayhead .acts .tbtn{flex:1}
  .trayitem{flex-wrap:wrap;gap:6px;padding:8px 0}
  .trayitem .t{flex:1 1 100%;order:-1}
  .trayitem .tbtn{flex:1}
  .trayitem .tbtn:last-child{flex:none;min-width:46px}
  /* bin rows: the item takes its own line so Restore stays tappable */
  .binrow{flex-wrap:wrap}
  .binrow .bt{flex:1 1 100%}
  .binrow .nbtn{flex:1;min-height:40px}
  .box{width:20px;height:20px;border-radius:7px}
  .sbox{width:17px;height:17px}
  .task{padding:10px 11px}
  .col{box-shadow:0 2px 6px rgba(var(--shd-rgb),.1),0 12px 26px rgba(var(--shd-rgb),.12)}
  .zadd{border:1px dashed rgba(var(--ink-rgb),.3);border-radius:9px;text-align:center;padding:9px 8px;color:var(--mut)}
  /* 16px keeps the browser from zooming the page when the field takes focus */
  .zaddrow input{font-size:16px;padding:9px 10px;min-height:44px}
  .zaddrow .abtn{min-height:44px}
  #strip{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #strip::-webkit-scrollbar{display:none}
  #strip button{scroll-snap-align:start}
  #main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .colhead{padding:12px 13px 10px}
  .badge{box-shadow:0 2px 6px rgba(var(--shd-rgb),.18)}
}

/* Touch targets. On a coarse pointer every control offers a finger at least 44px in
   its smallest dimension. Two mechanisms: controls drawn small on purpose (tick boxes,
   the mini glyphs, inline rename text) keep their drawn size and grow an invisible hit
   area through an absolutely positioned ::before; the press-glow classes clip their
   overflow so a ::before cannot escape them, and replaced elements cannot host one at
   all, so those grow for real. Fine-pointer layouts are untouched. Kept last in the
   stylesheet so it wins equal-specificity ties against the width media block above. */
@media (pointer:coarse){
  .box,.sbox,.mini,.hday,.zadd,.ttl,.st,.hname,.fdone,.mtabs button,#railtoggle,
  .ftxt span[data-action],.toast button{position:relative}
  /* Overlays are biased downward: a positioned element always beats an earlier
     sibling's overlay at its own centre, so room taken BELOW a control can never
     steal the next row's taps, while room taken above a dense row can. */
  .box::before{content:'';position:absolute;inset:-5px -14px -23px}
  .sbox::before{content:'';position:absolute;inset:-6px -15px -24px}
  .mini::before{content:'';position:absolute;inset:-4px -13px -22px}
  .hday::before{content:'';position:absolute;inset:-10px}
  .mtabs button::before{content:'';position:absolute;inset:-13px}
  #railtoggle::before{content:'';position:absolute;inset:-9px}
  .zadd::before{content:'';position:absolute;inset:-10px 0}
  .ttl::before{content:'';position:absolute;inset:-4px 0 -22px}
  .hname::before{content:'';position:absolute;inset:-4px 0 -21px}
  .st::before,.ftxt span[data-action]::before,.fdone::before{content:'';position:absolute;inset:-5px 0 -24px}
  .toast button::before{content:'';position:absolute;inset:-12px -4px}
  /* the rail habit cells sit directly under their name-and-tools line, so they must
     not reach up into it; the room below belongs to the next habit's own controls */
  .hrcells .box::before{inset:-8px -12px -16px}
  /* collapsible panel headers: a thin row of text, so grow a downward-biased overlay;
     the row below is either card padding (collapsed) or a row whose own controls are
     positioned and therefore win their centres */
  .kh[data-action],.hhead[data-action]{position:relative}
  .kh[data-action]::before{content:'';position:absolute;inset:-13px 0 -18px}
  .hhead[data-action]::before{content:'';position:absolute;inset:-10px 0 -16px}
  .noterow{min-height:44px}
  .nact,.ntb{min-height:44px;min-width:44px}
  #notePage{min-height:44px}
  .nbtn,.tbtn,.abtn,.mrow button{min-height:44px;min-width:44px}
  .navbtn,.railfoot button,#strip button,.fadd button{min-height:44px}
  #rail .railfoot button{min-height:44px}
  .binrow .nbtn{min-height:44px}
  #fi,#habitAdd,#weekAdd,#calAdd,#syncKeyIn,#jumpDate,#noteTitle,#noteSearch,.addin,.saddrow input,
  input.abtn,.acts select,#calZone{min-height:44px}
}
/* under 900px the boxes are drawn larger (20 and 17px), so the overlays can be
   tighter and still clear 44px without reaching a neighbouring row's centre */
@media (pointer:coarse) and (max-width:900px){
  .box::before{inset:-5px -12px -19px}
  .sbox::before{inset:-5px -14px -22px}
  .hgrid{row-gap:6px}
}

<body>

<div id="app">
  <aside id="rail">
    <div class="brandrow">
      <div class="mark"><i></i></div>
      <div class="brand">Headspace<span>Day planner</span></div>
      <button id="railtoggle" data-action="railtoggle">Menu</button>
      <div class="savebadge" id="save">saved</div>

      <button class="navbtn" data-action="view" data-v="notes"><span class="em"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h7.5L13 5v8.5H3z"/><path d="M10.5 2.5V5H13"/><path d="M5.4 8h5.2M5.4 10.6h3.6"/></svg></span>Notes</button>

  <main id="main">

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='agora_dayplanner_v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const t=new Date(d);t.setHours(12,0,0,0);return t.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const plus=(n,from)=>{const d=new Date((from||today())+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
/* the Monday a date's week started; the key habits and the weekly list hang history on */
const hweek=d=>{const x=new Date((d||today())+'T12:00:00');
  x.setDate(x.getDate()-((x.getDay()+6)%7)); return iso(x)};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZONES=['must','should','extra'];
const ZL={must:'Prio 0',should:'Prio 1',extra:'Extra'};
const ZSHORT={must:'0',should:'1',extra:'E'};
const ZC={must:'var(--must)',should:'var(--should)',extra:'var(--extra)'};
const LOCK=`<svg class="lk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.4" y="7.2" width="9.2" height="6.2" rx="1.5"/><path d="M5.5 7.2V5.4a2.5 2.5 0 0 1 5 0v1.8"/></svg>`;
/* the one collapse chevron, shared by every collapsible panel header */
const CHEV=open=>'<svg class="chev'+(open?' open':'')+'" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';

/* ================= state ================= */
/* ui.peek: which EMPTY panels the user has opened to add something. Not persisted:
   an empty panel starts collapsed on every load, and the flag is dropped the moment
   the panel holds an item, so emptying it later starts collapsed again. */
let state=null, ui={sel:null,adding:null,addText:'',drag:null,cancelEdit:false,renderKey:'',peek:{},noteQ:'',
                    noteHist:null};

function fresh(){
  return {
    ver:2, days:{}, carry:[], focus:[], tomb:{}, bin:{},
    floats:[{id:uid(),name:'Inbox',tasks:[]},{id:uid(),name:'Ideas',tasks:[]}],
    /* habits: a commitment band apart from the day plan. list holds the habit rows,
       marks holds every week's ticks keyed by the Monday that week started */
    habits:{list:[],marks:{}},
    /* week: the flat sometime-this-week list. list is live; at Monday 00:00 the
       ticked items graduate into hist under the week that closed, unticked stay */
    week:{list:[],hist:{}},
    /* notes: title and body. The body is ONE string on the dn axis: plain text, or
       a small sanitized HTML subset once formatting is used (see the rich engine by
       renderNotes). pinned:true rides pos; pg ('ruled'|'dot') rides up with the title */
    notes:[],
    settings:{view:'board',boardOffset:0,floatMode:false,activeFloat:null,
      calSel:null,calOffset:0,mRange:'day',stripDay:null,lastRoll:null,showDone:false,
      habitsOpen:true,lastWeek:null,noteSel:null}
  };
}

/* ================= per item change tracking =================
   Every task, subtask, float tab and focus item carries `up`, the moment it last
   changed on some device. Ids that go away are recorded in state.tomb with the moment
   they went. Sync merges those two maps id by id, so two devices that each add
   something keep both instead of one blob replacing the other. */
const LEGACY_UP=1;            /* stamp for anything saved before per item timestamps */
const TOMB_KEEP=45*864e5;     /* a deletion is remembered for 45 days, then forgotten */
const BIN_KEEP=30*864e5;      /* a binned item waits 30 days; shorter than TOMB_KEEP, so
                                 the record of the deletion always outlives the body */
const upOf=o=>{ const n=+(o&&o.up); return isFinite(n)&&n>0?n:LEGACY_UP };
/* `pos` is the second stamp: when this item last MOVED, as opposed to `up`, when its
   content last changed. Anything written before the split has no pos, so it falls back
   to up and behaves exactly as it did. */
const posOf=o=>{ const n=+(o&&o.pos); return isFinite(n)&&n>0?n:upOf(o) };
/* `dn` is the third stamp: when the item was last ticked or unticked. Ticking is the
   commonest edit and used to share a stamp with the title, so a rename on one device
   silently discarded a tick made on the other. Legacy items have no dn and fall back
   to up, exactly as they behaved before the split. */
const dnOf=o=>{ const n=+(o&&o.dn); return isFinite(n)&&n>0?n:upOf(o) };
const locKey=l=>l.kind==='day'?('day:'+l.date+':'+l.zone):l.kind==='float'?('float:'+l.fid):'carry';
const arr=x=>Array.isArray(x)?x:[];
/* Which fields belong to which stamp. The three are merged independently, so reordering a
   zone cannot outrank someone else's rename, a rename cannot drag a task out of the place

   move, and triage clears it as part of moving the task out.
   `doneAt` rides with `done`, since setting a focus statement aside is what writes it. */
/* A note has no tick, so its dn axis carries the body instead: a rename on one device
   and a body edit on another then compose instead of one discarding the other. Two
   devices editing the same BODY still resolve by later-dn-wins, whole body, loser
   silently gone; that data-loss case is real and documented, not solved.

   the list), so it rides pos, composes with a title edit (up) and a body edit (dn)
   made elsewhere, and, exactly like a move, cannot revive a deleted note.

   content axis beside the title, the way a habit's schedule rides beside its name:
   it is authored presentation, not placement, and it must never sit on dn or a page

   timestamped cell per week and day, merged by union, so a Monday tick on one device
   and a Wednesday tick on another can never compete. The item's dn stamp still moves

/* one walk over every mergeable item in a state, in a stable order */
function eachItem(s,fn){
  arr(s.floats).forEach((f,i)=>{ if(f&&f.id) fn('float',f,{ord:i}) });
  arr(s.floats).forEach(f=>{ if(f&&f.id) arr(f.tasks).forEach((t,i)=>eachTask(t,{kind:'float',fid:f.id},i,fn)) });
  Object.keys(s.days||{}).sort().forEach(d=>ZONES.forEach(z=>
    arr((s.days[d]||{})[z]).forEach((t,i)=>eachTask(t,{kind:'day',date:d,zone:z},i,fn))));
  arr(s.carry).forEach((t,i)=>eachTask(t,{kind:'carry'},i,fn));
  arr(s.focus).forEach((f,i)=>{ if(f&&f.id) fn('focus',f,{ord:i}) });

  arr(s.week&&s.week.list).forEach((x,i)=>{ if(x&&x.id) fn('wtask',x,{ord:i}) });

    const m=(marks[w]||{})[id]; if(!m||typeof m!=='object') return '';
    return w+'('+Object.keys(m).sort().map(d=>d+':'+m[d]).join(',')+')';

function eachTask(t,loc,ord,fn){

  if(!s.week||typeof s.week!=='object'||!Array.isArray(s.week.list)) s.week={list:[],hist:{}};
  if(!s.week.hist||typeof s.week.hist!=='object') s.week.hist={};

    else if(k==='sub') g.sub[o.id]={id:o.id,title:o.title||'',done:!!o.done,pid:m.pid,ord:m.ord,
      up:upOf(o),dn:dnOf(o),pos:posOf(o)};
    else if(k==='habit') g.habit[o.id]={id:o.id,name:o.name||'',
      days:arr(o.days).slice().sort((a,b)=>a-b),ord:m.ord,
      up:upOf(o),dn:dnOf(o),pos:posOf(o)};
    else if(k==='wtask') g.wtask[o.id]={id:o.id,title:o.title||'',done:!!o.done,ord:m.ord,
      up:upOf(o),dn:dnOf(o),pos:posOf(o)};
    else if(k==='note') g.note[o.id]={id:o.id,title:o.title||'',body:o.body||'',
      pg:o.pg||'',pinned:!!o.pinned,ord:m.ord,up:upOf(o),dn:dnOf(o),pos:posOf(o)};
    else g.task[o.id]={id:o.id,title:o.title||'',done:!!o.done,from:o.from||null,

  const ja=JSON.stringify(fields.map(f=>a[f])), jb=JSON.stringify(fields.map(f=>b[f]));

     must carry the tick's moment, not the content winner's stale one. For floats dn
     always mirrors up on both sides, so this changes nothing for them. */
  const d=pickSide(a,b,'dn',DONEF[kind]);                        /* whether it is ticked */

}

  /* habit ticks live outside the items, so hash them too or a tick would never push */
  const hm=(s&&s.habits&&s.habits.marks)||{};
  Object.keys(hm).sort().forEach(w=>{
    const wk=hm[w]||{};
    Object.keys(wk).sort().forEach(id=>{
      const cells=wk[id]||{};
      Object.keys(cells).sort().forEach(d=>out.push('hm '+w+' '+id+' '+d+' '+cells[d]));
    });

  const wh=(s&&s.week&&s.week.hist)||{};
  Object.keys(wh).sort().forEach(w=>out.push('wh '+w+' '+JSON.stringify(arr(wh[w]))));
  const tb=(s&&s.tomb)||{};

/* Commit whatever the debounce is still holding, now, at this moment. Every actor
   that is about to READ, RE-STAMP or REPLACE the whole tree must call this first.
   Until a keystroke is committed its item still carries the PREVIOUS commit's
   stamps, so a merge would weigh a body typed a second ago against the cloud's copy
   as though the two had happened at the same instant, and resolve that tie by
   comparing the two strings: about half the time the older cloud copy sorts first
   and the typing is silently discarded. The Notes editor makes the window wide,
   since it calls save() on every keystroke and typing that never pauses defers the
   commit for as long as it runs (Section 4). */

/* ---------- the automatic cycle: read the cloud, merge item by item, write back ----------
   Runs on load, on focus, on reconnect, on a timer, and a moment after any edit. */
async function syncCycle(opts){
  opts=opts||{};
  if(!sync.key||sync.busy) return false;
  if(sync.state==='conflict'&&!opts.force) return false;
  sync.busy=true;
  syncSet('busy');
  let row=null;
  try{ row=await cloudGet(sync.key) }
  catch(e){ sync.busy=false; sync.ready=true; netFail(e,opts.manual); return false }
  try{
    sync.checked=Date.now();
    if(!row){                                   /* first device on this key */
      sync.ready=true; sync.pending=true;
      const ok=await putState(opts.manual);
      sync.busy=false; return ok;
    }
    const theirs=readCloud(row.data);
    if(!theirs){
      sync.ready=true; syncSet('error','the copy in the cloud could not be read');
      sync.busy=false; return false;
    }
    if(!lsGet(SSTAMP_LS)&&!emptyPlanner(state)&&!emptyPlanner(theirs)){
      /* this device has never agreed with the cloud and both hold a planner, so do not guess */
      sync.ready=true; sync.busy=false; syncSet('conflict');
      refreshSyncModal();
      toast('Sync: this device and the cloud both hold a planner. Open Sync to choose.');
      return false;
    }
    /* AFTER the round trip, not before it: the read is awaited, so anything typed
       while the cloud copy was in flight would otherwise reach the merge unstamped */
    flushSave();
    const before=stateSig(state);
    const merged=mergeStates(state,theirs);
    const after=stateSig(merged);
    if(after!==before){ adopt(merged); if(opts.announce) toast('Updated from your other device') }
    sync.ready=true;
    if(after!==stateSig(theirs)){             /* the cloud is missing something this device holds */
      sync.pending=true;
      const ok=await putState(false);
      sync.busy=false; return ok;
    }
    sync.pending=false;
    lsSet(SSTAMP_LS,row.updated_at);
    syncSet('synced','up to date');
    sync.busy=false; return true;
  }catch(e){
    sync.busy=false; sync.ready=true; netFail(e,opts.manual); return false;
  }
}
function recheck(){
  if(!sync.key||!sync.ready||sync.busy||sync.state==='conflict') return;
  if(Date.now()-sync.checked<RECHECK_MS) return;
  syncCycle({announce:true});
}

/* ================= data ops ================= */
function day(d){
  if(!state.days[d]) state.days[d]={must:[],should:[],extra:[]};
  ZONES.forEach(z=>{if(!Array.isArray(state.days[d][z])) state.days[d][z]=[]});
  return state.days[d];
}
function mkTask(title){return {id:uid(),title:title.trim(),done:false,subtasks:[],up:Date.now()}}
function float(id){return state.floats.find(f=>f.id===id)}
function activeFloat(){return float(state.settings.activeFloat)||state.floats[0]}

function findTask(id){
  for(const d in state.days) for(const z of ZONES){
    const i=state.days[d][z].findIndex(t=>t.id===id);
    if(i>-1) return {task:state.days[d][z][i],from:{kind:'day',date:d,zone:z},index:i};
  }
  for(const f of state.floats){
    const i=f.tasks.findIndex(t=>t.id===id);
    if(i>-1) return {task:f.tasks[i],from:{kind:'float',fid:f.id},index:i};
  }
  const i=state.carry.findIndex(t=>t.id===id);
  if(i>-1) return {task:state.carry[i],from:{kind:'carry'},index:i};
  return null;
}
function pull(id){
  const f=findTask(id); if(!f) return null;
  const {from,index}=f;
  if(from.kind==='day') state.days[from.date][from.zone].splice(index,1);
  else if(from.kind==='float') float(from.fid).tasks.splice(index,1);
  else state.carry.splice(index,1);
  return f.task;
}
function place(task,dest,at){
  if(dest.kind==='day'){
    const arr=day(dest.date)[dest.zone];
    arr.splice(at==null?arr.length:at,0,task);
  }else if(dest.kind==='float'){
    const f=float(dest.fid)||state.floats[0];
    f.tasks.splice(at==null?f.tasks.length:at,0,task);
  }else state.carry.push(task);
}
function move(id,dest,at){
  const t=pull(id); if(!t) return;
  place(t,dest,at); ui.flash=id;
}
/* Tab order is nothing but the floats array order, exactly like task order in a zone,
   so it rides the existing pos stamp: stampChanges sees each tab's ord change and
   bumps pos, and the merge resolves order on that axis without a new field. */
function reorderTab(fid,targetFid,after){
  const i=state.floats.findIndex(f=>f.id===fid); if(i<0) return false;
  const moved=state.floats.splice(i,1)[0];
  let j=state.floats.findIndex(f=>f.id===targetFid);
  if(j<0){ state.floats.splice(i,0,moved); return false }
  if(after) j++;
  state.floats.splice(j,0,moved);
  return true;
}

/* rollover: unfinished tasks from past days go to the carry tray */
function rollover(){
  const t=today(); let moved=0;
  for(const d of Object.keys(state.days)){
    if(dayDiff(d,t)<=0) continue;
    for(const z of ZONES){
      const keep=[];
      for(const task of state.days[d][z]){
        if(task.done) keep.push(task);
        else{ task.from=ZL[z]+' · '+DOW[new Date(d+'T12:00:00').getDay()]; state.carry.push(task); moved++ }
      }
      state.days[d][z]=keep;
    }
  }
  state.settings.lastRoll=t;
  return moved;
}
/* Monday sweep for the weekly list: ticked items graduate into week.hist under the week
   that just closed, unticked ones simply stay in the list, which IS the carry. The
   archived ids leave the tree, so the normal diff tombs them and another device's stale
   ticked copy cannot bring them back, but they skip the bin: finishing a week is not a
   deletion. A device off for several weeks archives everything under the last week it
   saw, an approximation accepted over tracking a tick date per item. */
function weekSweep(){
  const closing=state.settings.lastWeek||plus(-7,hweek());
  const done=arr(state.week.list).filter(t=>t.done);
  if(done.length){
    const h=state.week.hist[closing]=state.week.hist[closing]||[];
    done.forEach(t=>{ if(!h.some(x=>x.id===t.id)) h.push({id:t.id,title:t.title,at:dnOf(t)}) });
    ui.skipBin=(ui.skipBin||[]).concat(done.map(t=>t.id));
    state.week.list=state.week.list.filter(t=>!t.done);
  }
  state.settings.lastWeek=hweek();
}

/* The day can turn while the app is still open, and a phone keeps this app running for
   days at a time, so checking only at launch meant the tray never appeared for anyone
   who does not close it. Checked at launch, whenever the app comes back to the front,
   and on a slow timer, so it fires with or without cloud sync.
   Moves are dated to midnight of the new day rather than the moment the check runs, so a
   device that opens late cannot out-stamp a triage another device already made. */
/* unfinished tasks sitting on days already past, which rollover has not swept up because
   it runs once a day and has already run. Drives the board nav affordance. */
function pastOpenCount(){
  const t=today(); let n=0;
  for(const d in state.days){
    if(dayDiff(d,t)<=0) continue;
    ZONES.forEach(z=>{ n+=arr(state.days[d][z]).filter(x=>x&&!x.done).length });
  }
  return n;
}
function rollIfNewDay(opts){
  opts=opts||{};
  if(!state) return 0;
  const dayDue=state.settings.lastRoll!==today();
  const weekDue=state.settings.lastWeek!==hweek();
  if(!dayDue&&!weekDue) return 0;
  flushSave();                        /* pending edits keep their own moment */
  const midnight=new Date(today()+'T00:00:00').getTime();
  const n=dayDue?rollover():0;
  if(weekDue) weekSweep();
  commit(midnight);
  if(n&&!opts.quiet){
    const say=()=>toast(n+' carried over from before');
    opts.delay?setTimeout(say,400):say();
  }
  if(!opts.boot){ ui.renderKey=''; render() }
  return n;
}

/* ================= undo ================= */
let undoT=null;
function toast(msg,undo){
  clearTimeout(undoT);
  $('#toast').innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+
    (undo?'<button data-action="undo">Undo</button>':'')+'</div>';
  if(undo) ui.undo=undo;
  undoT=setTimeout(()=>{$('#toast').innerHTML='';ui.undo=null},5000);
}
function doUndo(){
  if(!ui.undo) return;
  ui.undo(); ui.undo=null; $('#toast').innerHTML=''; clearTimeout(undoT);
  save(); render();
}

/* ================= recycle bin =================
   The safety net behind the 5 second Undo. stampChanges hands binCapture every id that
   vanished from the tree since the last commit, so every deletion path is covered in one
   place: day and float tasks, subtasks, tabs, focus items, tray dismissals, and whatever
   an import drops. An entry lives beside the tombstone for the same id and never longer
   than it, so the record of a deletion always outlives the body it kept. */
function binCapture(gone,alive,t){
  if(!prevSnap) return;
  const skip={}; (ui.skipBin||[]).forEach(id=>{skip[id]=1});
  const note=ui.binNote||{};
  const dead={}; gone.forEach(id=>{dead[id]=1});
  const idx={};
  eachItem(prevSnap,(k,o,meta)=>{ idx[o.id]={k:k,o:o,meta:meta} });
  gone.forEach(id=>{
    if(skip[id]) return;                       /* a conversion, not a delete */
    const hit=idx[id]; if(!hit) return;
    const k=hit.k, meta=hit.meta;
    /* children ride inside the container they died with, not as rows of their own */
    if(k==='sub'&&dead[meta.pid]) return;
    if(k==='task'&&meta.loc.kind==='float'&&dead[meta.loc.fid]) return;
    const e={k:k,at:t,body:JSON.parse(JSON.stringify(hit.o))};
    if(k==='task'){
      e.loc=meta.loc;
      e.body.subtasks=arr(e.body.subtasks).filter(x=>x&&dead[x.id]);
    }
    if(k==='sub'){
      e.pid=meta.pid;
      const p=idx[meta.pid]; e.pname=p?String(p.o.title||''):'';
    }
    if(k==='float'){
      e.body.tasks=arr(e.body.tasks).filter(x=>x&&dead[x.id]);
      if(note[id]&&Array.isArray(note[id].moved)) e.moved=note[id].moved.slice();
    }
    state.bin[id]=e;
  });
}
function binList(){
  return Object.keys(state.bin).map(id=>({id:id,e:state.bin[id]}))
    .filter(x=>!x.e.purged).sort((a,b)=>b.e.at-a.e.at);
}
function paintBin(){
  const b=$('#binBtn'); if(!b) return;
  const n=binList().length;
  b.textContent=n?'Bin · '+n:'Bin';
}
function restoreBin(id){
  const e=state.bin[id]; if(!e||e.purged) return;
  delete state.bin[id];
  const b=JSON.parse(JSON.stringify(e.body)); let dest='';
  if(e.k==='task'){
    const l=e.loc||{kind:'carry'};
    if(l.kind==='day'&&l.date){
      const z=ZONES.indexOf(l.zone)>-1?l.zone:'must';
      place(b,{kind:'day',date:l.date,zone:z});
      dest=ZL[z]+' on '+DOW[new Date(l.date+'T12:00:00').getDay()]+' '+l.date;
    }else if(l.kind==='float'){
      const f=float(l.fid);
      place(b,{kind:'float',fid:f?f.id:state.floats[0].id});
      dest=f?'the "'+f.name+'" tab':'the "'+state.floats[0].name+'" tab, since its old tab is gone';
    }else{ state.carry.push(b); dest='the carry-over tray' }
  }else if(e.k==='sub'){
    const p=findTask(e.pid);
    if(p){ p.task.subtasks.push(b); dest='its step list under "'+String(p.task.title||'').slice(0,28)+'"' }
    else{
      place({id:b.id,title:b.title||'',done:!!b.done,subtasks:[]},{kind:'float',fid:state.floats[0].id});
      dest='the "'+state.floats[0].name+'" tab as its own task, since the task it belonged to is gone';
    }
  }else if(e.k==='float'){
    const tab={id:b.id,name:b.name||'Restored tab',tasks:arr(b.tasks)};
    state.floats.push(tab);
    /* gather back the tasks it held, if they are still floating rather than scheduled */
    let back=0;
    arr(e.moved).forEach(tid=>{
      const f=findTask(tid);
      if(f&&f.from.kind==='float'&&f.from.fid!==tab.id){ move(tid,{kind:'float',fid:tab.id}); back++ }
    });
    dest='Free Floating'+(back?', with '+back+(back===1?' task':' tasks')+' moved back into it':'');
  }else if(e.k==='focus'){ state.focus.push(b); dest='True north' }
  else if(e.k==='habit'){ state.habits.list.push(b); dest='the Habits panel' }
  else if(e.k==='wtask'){ state.week.list.push(b); dest='the This week list' }
  else if(e.k==='note'){ state.notes.unshift(b); state.settings.noteSel=b.id; dest='Notes' }
  else return;
  save(); render();
  toast('Restored to '+dest);
  refreshBinModal();
}
function purgeBin(id){
  const e=state.bin[id]; if(!e||e.purged) return;
  state.bin[id]={at:e.at,purged:Date.now()};   /* keep a marker so the purge syncs, drop the body */
  save(); render(); refreshBinModal();
  toast('Gone for good');
}
function emptyBinNow(){
  Object.keys(state.bin).forEach(id=>{
    const e=state.bin[id];
    if(!e.purged) state.bin[id]={at:e.at,purged:Date.now()};
  });
  save(); render(); refreshBinModal();
  toast('Bin emptied');
}
function binWhere(e){
  if(e.k==='sub') return 'a step of "'+esc(String(e.pname||'a task').slice(0,28))+'"';
  if(e.k==='float'){
    const n=arr(e.body.tasks).length;
    return 'Free Floating'+(n?', holding '+n+(n===1?' task':' tasks'):'');
  }
  if(e.k==='focus') return 'True north';
  if(e.k==='habit') return 'the Habits panel';
  if(e.k==='wtask') return 'the This week list';
  if(e.k==='note') return 'Notes';
  const l=e.loc||{kind:'carry'};
  if(l.kind==='day'&&l.date)
    return (ZL[l.zone]||ZL.must)+' on '+DOW[new Date(l.date+'T12:00:00').getDay()]+' '+l.date;
  if(l.kind==='float'){ const f=float(l.fid); return f?'the "'+esc(f.name)+'" tab':'a tab that is gone' }
  return 'the carry-over tray';
}
function binMeta(e){
  const goneFor=Math.floor((Date.now()-e.at)/864e5);
  const left=Math.max(0,Math.ceil((BIN_KEEP-(Date.now()-e.at))/864e5));
  return binWhere(e)+' · deleted '+(goneFor?goneFor+'d ago':'today')+' · '+left+'d left';
}
function binBody(){
  const list=binList();
  let h='<h3>Bin</h3>'+
    '<p class="synchint">Anything deleted waits here for 30 days, then goes for good. '+
    'Restore puts it back where it came from, or the nearest place still standing.</p>';
  if(!list.length) h+='<div class="empty">Nothing in the bin.</div>';
  list.forEach(x=>{
    const e=x.e, name=e.k==='float'?(e.body.name||'a tab')
      :e.k==='habit'?(e.body.name||'a habit')
      :e.k==='note'?(e.body.title||'a note'):(e.body.title||'');
    h+='<div class="binrow"><div class="bt"><b>'+esc(String(name).slice(0,64))+'</b>'+
      '<span>'+binMeta(e)+'</span></div>'+
      '<button class="nbtn" data-action="bin-restore" data-id="'+x.id+'">Restore</button>'+
      '<button class="nbtn" data-action="bin-purge" data-id="'+x.id+'" title="Delete for good" aria-label="Delete for good">✕</button></div>';
  });
  h+='<div class="mrow">'+
    (list.length?'<button data-action="bin-empty">Empty bin</button>':'')+
    '<button class="pri" data-action="mclose" data-close="1">Done</button></div>';
  return h;
}
function binModal(){
  $('#modalRoot').innerHTML='<div class="mback" data-action="mclose"><div class="modal" id="binModal">'+
    binBody()+'</div></div>';
}
function refreshBinModal(){ const m=$('#binModal'); if(m) m.innerHTML=binBody() }
function confirmEmptyBin(){
  const m=$('#binModal'); if(!m) return;
  const n=binList().length;
  m.innerHTML='<h3>Empty the bin?</h3>'+
    '<p>It holds <b>'+n+'</b> '+(n===1?'item':'items')+'. Emptying cannot be undone, here or on any synced device.</p>'+
    '<div class="mrow"><button data-action="bin-back">Keep everything</button>'+
