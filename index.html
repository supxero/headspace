/* ================= render: calendar ================= */
function renderCal(){
  const base=new Date(); base.setDate(1);
  base.setMonth(base.getMonth()+state.settings.calOffset);
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1).getDay(), len=new Date(y,m+1,0).getDate();
  let h='<div class="calbar"><button class="nbtn" data-action="cal-nav" data-d="-1">‹</button>'+
    '<h2>'+MON[m]+' '+y+'</h2>'+
    '<button class="nbtn" data-action="cal-nav" data-d="1">›</button>'+
    '<button class="nbtn" data-action="cal-nav" data-d="0">This month</button>'+
    (state.settings.calSel?'<span class="chip">Showing '+state.settings.calSel+
      '<button class="mini" data-action="cal-clear">✕</button></span>':'')+'</div>'+
    '<div class="caldow">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div><div class="calgrid">';
  for(let i=0;i<first;i++) h+='<div class="cell blank"></div>';
  for(let n=1;n<=len;n++){
    const d=iso(new Date(y,m,n)), list=tasksOn(d), open=list.filter(t=>!t.done);
    const x=state.days[d];
    let dots='';
    if(list.length&&!open.length) dots='<span class="allok">✓ done</span>';
    else if(open.length){
      let shown=0, bits='';
      ZONES.forEach(z=>{ (x?x[z]:[]).filter(t=>!t.done).forEach(()=>{
        if(shown<4){bits+='<i style="background:'+ZC[z]+'"></i>';shown++}
      })});
      if(open.length>4) bits+='<span class="more">+'+(open.length-4)+'</span>';
      dots='<div class="dots">'+bits+'</div>';
    }
    h+='<div class="cell'+(d===today()?' today':'')+(d===state.settings.calSel?' sel':'')+
      '" data-action="cal-day" data-day="'+d+'"><span class="n">'+n+'</span>'+dots+'</div>';
  }
  h+='</div>';

  if(state.settings.calSel){
    /* READ, NEVER CREATE. day() makes the day if it is missing, so rendering the panel
       for a selected empty date wrote a `{must:[],should:[],extra:[]}` into state.days
       and left it there: every click on a bare square grew the planner by a permanent
       empty day, and they merge, sync and count for offBoard's key sweep like real ones.
       A render must not mutate what it is drawing. The day is created where a task is
       actually added to it, which is place(), through day() as before. */
    const d=state.settings.calSel, x=dayRead(d);
    h+='<div class="dpanel"><div class="dphead"><b>Tasks on '+
      DOW[new Date(d+'T12:00:00').getDay()]+', '+d+'</b>'+
      '<button class="nbtn" data-action="goto-day" data-day="'+d+'">Open on board →</button></div>'+
      '<div class="dpadd"><input id="calAdd" data-enter="caladd" data-day="'+d+'" placeholder="Add to this day…" autocomplete="off">'+
      '<select id="calZone">'+ZONES.map(z=>'<option value="'+z+'">'+ZL[z]+'</option>').join('')+'</select>'+
      '<button class="nbtn solid" data-action="cal-add" data-day="'+d+'">Add</button></div><div class="dplist">';
    let any=false;
    ZONES.forEach(z=>{
      if(!x[z].length) return; any=true;
      h+='<div class="zh" style="padding-top:8px"><i class="pip" style="background:'+ZC[z]+'"></i>'+ZL[z]+'</div>'+
        x[z].map(t=>card(t,{kind:'day',date:d,zone:z})).join('');
    });
    if(!any) h+='<div class="empty">Nothing on this day yet.</div>';
    h+='</div></div>';
  }
  $('#cal').innerHTML=h;
}

/* ================= render: the sticky note =================
   Patch, never rebuild: the pad is static markup, so a render can only show it,
   place it and, while nobody is typing in it, refresh its text. While the pad IS
   focused the value is left alone, so a sync landing mid-sentence cannot yank
   the caret; the focused device's own text wins the merge on its newer stamp. */
function renderSticky(){
  const st=$('#sticky'); if(!st) return;
  const v=state.settings.view;
  const show=v==='board'||v==='notes';   /* board covers Free Floating: same view */
  st.style.display=show?'':'none';
  /* the name is the placement: in Notes the strip is the first block of the content
     column, so it stands at the top right and the pane follows it. Board and Free
     Floating keep the bottom right corner. */
  st.dataset.pos=v==='notes'?'top':'corner';
  $('#main').classList.toggle('stickycorner',show&&v!=='notes');
  /* the Notes placement names itself on #main too, so the grid that lets the note
     list fill the band beside the strip has something to hang off (1200px and up) */
  $('#main').classList.toggle('stickytop',show&&v==='notes');
  const pad=$('#stickyPad');
  if(pad&&document.activeElement!==pad){
    const txt=(state.sticky&&state.sticky.text)||'';
    if(pad.value!==txt) pad.value=txt;
  }
}

/* ================= master render ================= */
function render(){
  const v=state.settings.view;
  /* the active view carries the accent (the .on class draws it) and names itself
     to assistive tech; in float mode the Free Floating entry is the active one */
  /* EXACTLY ONE nav item carries the mark, in every view including float mode.
     Float mode is a mode OF the board view, so `v` is still 'board' while it is
     on: the old code lit Board from the data-v loop and the toggle from its own
     line, leaving two items with .on and, worse, two with aria-current="page",
     which says two things are the current page. Section 11.3 recorded that as
     deliberate; it was not defensible once the mark became a surface as well as
     a bar. While float mode is on the toggle is what describes where you are
     ("Back to dates"), so Board yields the mark to it. */
  const fon=state.settings.floatMode&&v==='board';
  $$('#rail .navbtn[data-v]').forEach(b=>{
    const on=b.dataset.v===v&&!(fon&&b.dataset.v==='board');
    b.classList.toggle('on',on);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const fb=$('#rail .navbtn[data-action="floattoggle"]');
  fb.classList.toggle('on',fon);
  if(fon) fb.setAttribute('aria-current','page'); else fb.removeAttribute('aria-current');
  $('#ftlabel').textContent=state.settings.floatMode?'Back to dates':'Free Floating';
  $('#board').style.display=v==='board'?'flex':'none';
  $('#cal').style.display=v==='calendar'?'block':'none';
  $('#notes').style.display=v==='notes'?'flex':'none';
  $('#quickadd').style.display=v==='board'?'flex':'none';

  renderQuick(); renderTray(); renderNav(); renderFocus(); renderMetrics(); paintBin(); grow();
  renderHabits(); renderWeekly(); renderSticky();
  if(v==='board') renderBoard(); else if(v==='calendar') renderCal(); else renderNotes();

  if(ui.adding){
    const el=$('.addin[data-k="'+ui.adding+'"]');
    if(el&&document.activeElement!==el){
      el.focus();
      const n=el.value.length; try{ el.setSelectionRange(n,n) }catch(err){}
    }
  }
  if(ui.flash) setTimeout(()=>{ui.flash=null},700);
}

/* ================= actions ================= */
function addFromText(text,destStr){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return 0;
  const p=destStr.split(':');
  const dest=p[0]==='float'?{kind:'float',fid:p[1]}:{kind:'day',date:p[1],zone:p[2]};
  lines.forEach(l=>place(mkTask(l),dest));
  return lines.length;
}

/* close the open inline add field, keeping whatever was typed */
function closeAdd(commit){
  const inp=ui.adding?$('.addin[data-k="'+ui.adding+'"]'):null;
  const txt=inp?inp.value:ui.addText;
  if(commit&&txt&&txt.trim()) addFromText(txt,ui.adding);
  if(inp) inp.blur();          /* lets the phone keyboard drop away */
  ui.adding=null; ui.addText='';
}

/* Enter commits and leaves a fresh empty field open in the SAME zone or tab, so a
   list can be typed straight down without reaching for the mouse. An empty commit is
   the way out: Enter on nothing closes the field instead of opening another, and
   Escape still closes without committing.

   Deliberately NOT closeAdd() on the chaining path. closeAdd blurs the input, and a
   blur is what drops the on-screen keyboard; blurring and then focusing the next
   field would make the keyboard fall and rise between every task. Here the old input
   is simply replaced by the render and render() moves focus to its successor inside
   the same turn, so the phone sees focus travel between two fields and never leaves
   the text-entry state. Nothing here touches the click handler's deferred
   save-and-render, which is where the original mobile trap lived: this path is
   keyboard-only, calls save() and render() directly, and the half-typed text still
   lives in ui.addText, so a keyboard-driven resize cannot eat it either. */
function addChain(k){
  const inp=$('.addin[data-k="'+k+'"]');
  const txt=(inp?inp.value:ui.addText)||'';
  if(!txt.trim()){ closeAdd(false); save(); render(); return }
  addFromText(txt,k);
  ui.adding=k; ui.addText='';   /* same destination, empty, still open and focused */
  save(); render();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');

  /* tapping anywhere outside the open add row closes it. Without this there was no
     way off a phone: no Escape key, and the delegated handler ignored plain taps. */
  if(ui.adding&&!e.target.closest('.zaddrow')){
    closeAdd(true);
    if(!el){ save(); render(); return }
    /* an action was tapped: let it run against the live DOM, then tidy up after */
    setTimeout(()=>{
      save();
      const ae=document.activeElement;
      if(ae&&ae.dataset&&ae.dataset.kind) return;   /* an inline rename just started */
      render();
    },0);
  }

  /* THE PRESS THAT CLOSES True north: any press that lands outside the panel puts it
     back to just the statement. Done on the press rather than on the input's blur so
     it also closes for a tap on bare canvas, where nothing takes focus at all.
     renderFocus() only, never render(), so nothing else on the screen moves and no
     other caret is disturbed. */
  if(ui.northOn&&!e.target.closest('#fpanel')){
    ui.northOn=false;
    renderFocus();
    if(!el) return;
  }

  if(!el) return;
  const a=el.dataset.action, id=el.dataset.id, s=state.settings;

  switch(a){
    case 'railtoggle': $('#rail').classList.toggle('open'); return;
    case 'undo': doUndo(); return;
    /* device chrome, not data: a CSS attribute and a localStorage write, no render,
       no save(), nothing that could reach state or the cloud */
    case 'railcollapse': railSet(false); return;
    case 'railshow': railSet(true); return;
    /* THE LOGO IS A VIEW RESET, not a reload and not a data change. It puts the view
       back to its normal state and touches nothing else: no task, note, tab, habit,
       weekly item, bin entry or tombstone is read or written, the sync connection and
       any push already in flight are left alone (flushSave is what syncCycle itself
       calls before a merge, so it can only help one land), and the theme, the rail and
       the panel collapse states are all deliberately left as the user set them.
       Anything half-typed is COMMITTED rather than dropped: an open inline add row is
       committed the way tapping outside it does, and flushSave() forces the 400ms
       debounce so a note body or title still inside it is written before the view
       changes under it. */
    case 'home':{
      if(ui.adding) closeAdd(true);
      flushSave();
      s.view='board'; s.floatMode=false;      /* board, not calendar, not notes, not tabs */
      s.boardOffset=0; s.stripDay=null;       /* today in view, at both widths */
      s.calSel=null; s.calOffset=0;           /* no calendar selection carried back */
      s.noteSel=null;                         /* no note open */
      ui.sel=null; ui.noteQ=''; ui.peek={}; ui.northOn=false;   /* no card open, no stale search, panels at rest */
      break;
    }
    case 'view': s.view=el.dataset.v; if(s.view!=='board') s.floatMode=false; break;
    case 'floattoggle': s.floatMode=!s.floatMode; s.view='board'; break;
    case 'mrange': s.mRange=el.dataset.r; save(); renderMetrics(); return;

    case 'quickadd':{
      const i=$('#qi'), n=addFromText(i.value,$('#qd').value);
      if(!n) return; i.value=''; i.style.height='auto';
      toast(n===1?'Added':'Added '+n+' tasks'); break;
    }
    case 'add-open': ui.adding=el.dataset.k; ui.addText=''; break;
    case 'add-commit': closeAdd(true); break;
    case 'add-cancel': closeAdd(false); break;

    case 'tick':{
      const f=findTask(id); if(!f) return;
      f.task.done=!f.task.done;
      el.classList.add('pop');
      break;
    }
    case 'sel': ui.sel=ui.sel===id?null:id; break;
    case 'zone': move(id,{kind:'day',date:el.dataset.day,zone:el.dataset.zone}); break;
    case 'bump':{
      const f=findTask(id); if(!f||f.from.kind!=='day') return;
      const step=+el.dataset.d||1;                 /* -1 back a day, 1 forward */
      move(id,{kind:'day',date:plus(step,f.from.date),zone:f.from.zone}); break;
    }
    /* the tap equivalent of the tab drag, and deliberately the SAME function it calls:
       reorderTab does the array move, so the pos axis is stamped by stampChanges from
       the changed ordinal exactly as a drop stamps it, the merge sees an ordinary
       reorder, and no new field is written anywhere. flipTabs is the drag's own
       finish, so a tap animates identically. */
    case 'float-move':{
      const fid=el.dataset.fid, d=+el.dataset.d;
      const i=state.floats.findIndex(f=>f.id===fid); if(i<0) return;
      const j=i+d; if(j<0||j>=state.floats.length) return;
      if(!reorderTab(fid,state.floats[j].id,d>0)) return;
      save(); flipTabs(); return;
    }
    case 'reorder':{
      const f=findTask(id); if(!f) return;
      const d=+el.dataset.d;
      let arr = f.from.kind==='day'?state.days[f.from.date][f.from.zone]:float(f.from.fid).tasks;
      const i=f.index, j=i+d;
      if(j<0||j>=arr.length) return;
      arr.splice(j,0,arr.splice(i,1)[0]); break;
    }
    case 'del':{
      const f=findTask(id); if(!f) return;
      const {from,index,task}=f; pull(id);
      toast('Deleted "'+task.title.slice(0,28)+'"',()=>place(task,
        from.kind==='day'?{kind:'day',date:from.date,zone:from.zone}:
        from.kind==='float'?{kind:'float',fid:from.fid}:{kind:'carry'},index));
      ui.sel=null; break;
    }
    case 'rename':{
      const node=el.closest('.task').querySelector('.ttl');
      node.contentEditable=true; node.dataset.kind='rename'; node.dataset.id=id;
      node.focus(); document.execCommand&&document.execCommand('selectAll',false,null); return;
    }

    case 'sadd':{
      const inp=$('#sadd-'+id); if(!inp||!inp.value.trim()) return;
      findTask(id).task.subtasks.push({id:uid(),title:inp.value.trim(),done:false}); break;
    }
    case 'stick':{
      const t=findTask(id).task, sub=t.subtasks.find(x=>x.id===el.dataset.sid);
      sub.done=!sub.done; break;
    }
    case 'sdel':{
      const t=findTask(id).task, i=t.subtasks.findIndex(x=>x.id===el.dataset.sid);
      const sub=t.subtasks.splice(i,1)[0];
      toast('Step removed',()=>t.subtasks.splice(i,0,sub)); break;
    }
    case 'spop':{
      const f=findTask(id), t=f.task, i=t.subtasks.findIndex(x=>x.id===el.dataset.sid);
      const sub=t.subtasks.splice(i,1)[0];
      ui.skipBin=(ui.skipBin||[]).concat(sub.id);   /* a conversion, not a delete */
      const nt=mkTask(sub.title); nt.done=sub.done;
      place(nt, f.from.kind==='day'?{kind:'day',date:f.from.date,zone:f.from.zone}:{kind:'float',fid:f.from.fid});
      ui.flash=nt.id; toast('Popped out as its own task'); break;
    }
    case 'srename':{
      el.contentEditable=true; el.dataset.kind='subrename'; el.focus(); return;
    }

    /* change-driven controls: their real work happens in the change handler. Their raw
       click reaches this switch because they carry a data-action, and falling through
       to the shared save()+render() tail rebuilds the board and destroys the control
       mid-interaction, so the native picker never opens. tofloat was immunised long
       ago, which is why "file to" always worked while the date field did not. */
    case 'tofloat': return;
    case 'pickdate': return;

    /* an empty panel's header opens it to add something (ui only, never persisted) */
    case 'panel-toggle': ui.peek[el.dataset.panel]=!ui.peek[el.dataset.panel]; render(); return;
    case 'habit-toggle':{
      /* with habits defined this is the persisted manual collapse it always was;
         empty, it is the same peek-open the other two panels get. Opening an empty
         panel also clears a remembered manual collapse, so the first habit added
         does not vanish under it. */
      if(state.habits.list.length){ s.habitsOpen=s.habitsOpen===false; break }
      ui.peek.habits=!ui.peek.habits;
      if(ui.peek.habits) s.habitsOpen=true;
      break;
    }
    /* This week collapses whether or not it holds anything. With items that is the
       persisted per-device flag Habits already uses; empty, it is the memory-only
       peek. Opening an empty panel also clears a remembered collapse, so the first
       item added does not land under it. */
    case 'week-toggle':{
      if(arr(state.week.list).length){ s.weekOpen=s.weekOpen===false; break }
      ui.peek.week=!ui.peek.week;
      if(ui.peek.week) s.weekOpen=true;
      break;
    }
    /* a press anywhere on the True north panel makes it the panel being used, which is
       what draws its add field and its archive. Idempotent: pressing it again while
       already active changes nothing, so a press aimed at a row's own button is never
       a toggle-off. The press that CLOSES it is one outside the panel (see below). */
    case 'north-open':{
      if(ui.northOn) return;
      ui.northOn=true; renderFocus(); return;
    }
    case 'habit-add':{
      const i=$('#habitAdd'); if(!i||!i.value.trim()) return;
      state.habits.list.push({id:uid(),name:i.value.trim(),days:[1,2,3,4,5,6],up:Date.now()});
      save(); render();
      const n=$('#habitAdd'); if(n) n.focus();   /* type the next one straight away */
      return;
    }
    case 'habit-tick':{
      const wk=hweek(), dow=el.dataset.dow, hm=state.habits.marks;
      if(!hm[wk]) hm[wk]={};
      if(!hm[wk][id]) hm[wk][id]={};
      const cur=+hm[wk][id][dow]||0;
      /* positive: ticked at that moment. Negative: unticked at that moment. The sign
         carries the intent and the magnitude carries the clock, so two devices always
         agree on the later action. */
      hm[wk][id][dow]=cur>0?-Date.now():Date.now();
      el.classList.add('pop');
      break;
    }
    case 'habit-days': ui.habitDays=id; break;
    case 'habit-days-done': ui.habitDays=null; break;
    case 'habit-day':{
      const hb=state.habits.list.find(x=>x.id===id); if(!hb) return;
      const d=+el.dataset.dow;
      hb.days=arr(hb.days).includes(d)?arr(hb.days).filter(x=>x!==d)
        :arr(hb.days).concat(d).sort((a,b)=>a-b);
      break;
    }
    case 'habit-rename':{
      el.contentEditable=true; el.dataset.kind='habitrename'; el.focus(); return;
    }
    case 'habit-del':{
      const idx=state.habits.list.findIndex(x=>x.id===id); if(idx<0) return;
      const hb=state.habits.list.splice(idx,1)[0];
      toast('Deleted "'+hb.name.slice(0,28)+'"',
        ()=>state.habits.list.splice(Math.min(idx,state.habits.list.length),0,hb));
      break;
    }

    case 'week-add':{
      const i=$('#weekAdd'); if(!i||!i.value.trim()) return;
      state.week.list.push({id:uid(),title:i.value.trim(),done:false,up:Date.now()});
      save(); render();
      const n=$('#weekAdd'); if(n) n.focus();
      return;
    }
    case 'week-tick':{
      const t=state.week.list.find(x=>x.id===id); if(!t) return;
      t.done=!t.done;
      el.classList.add('pop');
      break;
    }
    case 'week-rename':{
      el.contentEditable=true; el.dataset.kind='weekrename'; el.focus(); return;
    }
    case 'week-del':{
      const idx=state.week.list.findIndex(x=>x.id===id); if(idx<0) return;
      const t=state.week.list.splice(idx,1)[0];
      toast('Deleted "'+t.title.slice(0,28)+'"',
        ()=>state.week.list.splice(Math.min(idx,state.week.list.length),0,t));
      break;
    }

    case 'note-new':{
      const n={id:uid(),title:'',body:'',up:Date.now()};
      state.notes.unshift(n); s.noteSel=n.id;
      ui.noteQ='';   /* a fresh note must be visible, whatever was being searched */
      save(); render();
      const t=$('#noteTitle'); if(t) t.focus();   /* name it straight away */
      return;
    }
    case 'note-open': s.noteSel=el.dataset.id; break;
    case 'note-pin':{
      const n=state.notes.find(x=>x.id===el.dataset.id); if(!n) return;
      if(n.pinned) delete n.pinned; else n.pinned=true;   /* absent, not false */
      break;
    }
    case 'note-fmt':{
      /* apply, serialize, save; NO render: the caret and its selection live in the
         editor and the command was for them */
      const n=state.notes.find(x=>x.id===state.settings.noteSel), ed=$('#noteBody');
      if(!n||!ed) return;
      noteCmd(el.dataset.cmd,ed);
      n.body=noteSerialize(ed);
      noteHistTrack(ed,n);   /* a command is structural, so always its own undo step */
      notePatchRow(n);
      save(); noteToolState();
      return;
    }
    /* the buttons are the chords: one history, one function, one set of rules. No
       render, for the same reason note-fmt does not: the caret lives in the editor. */
    case 'note-step':{
      const ed=$('#noteBody'); if(!ed) return;
      noteUndo(ed,el.dataset.cmd==='redo');
      return;
    }
    case 'note-del':{
      const i=state.notes.findIndex(n=>n.id===el.dataset.id); if(i<0) return;
      const n=state.notes.splice(i,1)[0];
      if(s.noteSel===n.id) s.noteSel=null;
      toast('Deleted "'+(n.title||'Untitled').slice(0,28)+'"',
        ()=>{ state.notes.splice(Math.min(i,state.notes.length),0,n); state.settings.noteSel=n.id });
      break;
    }

    /* folders: the chooser is the one move mechanism, reached from the list row
       and from the open page alike. Nothing here is a drag. */
    case 'note-movemenu': noteMoveModal(el.dataset.id); return;
    case 'note-move-to':{
      const n=state.notes.find(x=>x.id===el.dataset.id); if(!n) return;
      const fid=el.dataset.fid||'';
      const f=fid?state.folders.find(x=>x.id===fid):null;
      if(f) n.folder=f.id; else delete n.folder;   /* absent, not '': exports stay clean */
      $('#modalRoot').innerHTML='';
      toast(f?'Moved to "'+String(f.name).slice(0,28)+'"':'Moved out of folders');
      break;
    }
    case 'folder-new':{
      const f={id:uid(),name:'New folder',up:Date.now()};
      state.folders.push(f);
      ui.noteQ='';   /* a fresh folder must be visible, whatever was being searched */
      save(); render();
      const node=[...document.querySelectorAll('[data-action="folder-rename"]')].pop();
      if(node) node.click();
      return;
    }
    case 'folder-rename':{
      const head=el.closest('.fldhead').querySelector('.fldname');
      head.contentEditable=true; head.dataset.kind='folderrename'; head.dataset.fid=el.dataset.fid;
      head.focus(); document.execCommand&&document.execCommand('selectAll',false,null); return;
    }
    case 'folder-del':{
      const f=arr(state.folders).find(x=>x.id===el.dataset.fid); if(!f) return;
      const inside=state.notes.filter(n=>n.folder===f.id).length;
      /* a folder holding notes asks first, exactly as a tab holding tasks does;
         deleting it must move the notes out, never delete them */
      if(inside) return confirmFolderDelete(f,inside);
      const i=state.folders.indexOf(f); state.folders.splice(i,1);
      toast('Folder deleted',()=>state.folders.splice(i,0,f));
      break;
    }
    case 'folder-del-move':{
      const f=arr(state.folders).find(x=>x.id===el.dataset.fid); if(!f) return;
      const i=state.folders.indexOf(f);
      const moved=state.notes.filter(n=>n.folder===f.id);
      moved.forEach(n=>{ delete n.folder });         /* out to the loose list, never deleted */
      ui.binNote=ui.binNote||{}; ui.binNote[f.id]={moved:moved.map(n=>n.id)};
      state.folders.splice(i,1);
      $('#modalRoot').innerHTML='';
      toast('Folder deleted, '+moved.length+(moved.length===1?' note':' notes')+' kept in the loose list',()=>{
        state.folders.splice(i,0,f);
        moved.forEach(n=>{ if(!n.folder) n.folder=f.id });
      });
      break;
    }

    case 'goto-day':{
      s.view='board'; s.floatMode=false;
      showDay(el.dataset.day); break;
    }
    case 'roll-now':{
      /* a deliberate pull, so it is stamped now rather than at midnight: the user asked
         for this on this device and it should win over another device's stale copy */
      const n=rollover();
      toast(n?n+(n===1?' task moved into the tray':' tasks moved into the tray')
             :'Nothing is waiting on a past day');
      break;
    }
    case 'nav': shiftBoard(+el.dataset.d); break;
    case 'nav-today': showDay(today()); break;
    /* TODAY ONLY. Turning it on SHOWS TODAY, whatever day the board was pointing at:
       the mode is for the days when only today matters, so it would be useless if it
       framed a random week's Thursday. showDay is how it gets there, never a write to
       boardOffset or stripDay, so the two halves of the board position stay in step at
       both widths (the trap Prev and Next fell into on iOS).
       TURNING IT OFF GOES TO TODAY TOO, and for the same reason. It used to snap
       nothing, which read as "the week opens on the day being looked at" and was
       measured as something else: one press of Next inside the mode leaves
       boardOffset at 1, so the seven day window opened on TOMORROW with today off the
       left edge, and a night in the mode could leave it anywhere. What comes back has
       to be a coherent week, and the only week that is coherent to come back to is the
       one holding today, with today visible: that is boardOffset 0, which is what
       showDay(today()) means. Both directions therefore reach the board position the
       same single way, and neither writes a field.
       Returns rather than breaks, the convention this switch keeps for a case that has
       done its own save and render, and the one the other mode switch (mrange) uses. */
    case 'todayonly':{
      s.todayOnly=!s.todayOnly;
      showDay(today());
      save(); render(); return;
    }
    case 'strip': showDay(el.dataset.day); break;

    /* the collapse is presentation, per device: the flag lives in settings on
       VIEWSET, outside stateSig, so toggling it never syncs and a Pull never
       imports another screen's tray. Breaks to the shared save()+render() tail
       like habit-toggle, so there is no second save or render to collide with. */
    case 'tray-toggle': s.trayOpen=s.trayOpen!==true; break;
    /* triage that EMPTIES the tray also drops the open flag, so the next carry to
       arrive, by this device's own roll or by a pull from another one, starts as
       the collapsed bar again. The undo closures restore the flag with the items:
       triage only happens in an open tray, so open is what an undo comes back to. */
    case 'carry-all':{
      const snap=state.carry.slice();
      const to=el.dataset.to;
      snap.forEach(t=>{delete t.from; place(t, to==='today'?{kind:'day',date:today(),zone:'must'}:{kind:'float',fid:activeFloat().id})});
      state.carry=[]; s.trayOpen=false;
      toast('Moved '+snap.length+' to '+(to==='today'?'Today · Prio 0':'Free Floating'),()=>{
        snap.forEach(t=>pull(t.id)); state.carry=snap; state.settings.trayOpen=true;
      }); break;
    }
    case 'carry-one':{
      const t=pull(id); if(!t) return; delete t.from;
      place(t, el.dataset.to==='today'?{kind:'day',date:today(),zone:'must'}:{kind:'float',fid:activeFloat().id});
      if(!state.carry.length) s.trayOpen=false;
      ui.flash=t.id; break;
    }
    case 'carry-drop':{
      const i=state.carry.findIndex(t=>t.id===id), t=state.carry.splice(i,1)[0];
      if(!state.carry.length) s.trayOpen=false;
      toast('Dropped "'+t.title.slice(0,24)+'"',()=>{
        state.carry.splice(i,0,t); state.settings.trayOpen=true;
      }); break;
    }

    case 'float-new':{
      const f={id:uid(),name:'New tab',tasks:[]}; state.floats.push(f);
      s.activeFloat=f.id; save(); render();
      const node=[...document.querySelectorAll('[data-action="float-rename"]')].pop();
      if(node) node.click();
      return;
    }
    case 'float-rename':{
      const head=el.closest('.colhead').querySelector('.dow');
      head.contentEditable=true; head.dataset.kind='floatrename'; head.dataset.fid=el.dataset.fid;
      head.focus(); return;
    }
    case 'float-del':{
      const f=float(el.dataset.fid);
      if(f.tasks.length) return confirmTabDelete(f);
      const i=state.floats.indexOf(f); state.floats.splice(i,1);
      if(s.activeFloat===f.id) s.activeFloat=state.floats[0].id;
      toast('Tab deleted',()=>state.floats.splice(i,0,f)); break;
    }
    case 'float-del-move':{
      const f=float(el.dataset.fid), i=state.floats.indexOf(f);
      const other=state.floats.find(x=>x.id!==f.id);
      const moved=f.tasks.slice(); other.tasks.push(...moved);
      ui.binNote=ui.binNote||{}; ui.binNote[f.id]={moved:moved.map(x=>x.id)};
      state.floats.splice(i,1);
      if(s.activeFloat===f.id) s.activeFloat=state.floats[0].id;
      $('#modalRoot').innerHTML='';
      toast('Tab deleted, '+moved.length+' moved to '+other.name,()=>{
        other.tasks.splice(other.tasks.length-moved.length,moved.length);
        state.floats.splice(i,0,f);
      }); break;
    }

    case 'focus-add':{
      const i=$('#fi'); if(!i.value.trim()) return;
      state.focus.push({id:uid(),title:i.value.trim(),done:false}); i.value='';
      /* someone who just set a statement is plainly using the panel, so it stays
         active and the field stays under their hands for a second one. Without this
         the field would vanish the instant the first statement landed, because the
         empty-panel peek is dropped as soon as the panel holds something. */
      ui.northOn=true;
      break;
    }
    /* set aside / bring back write the same done/doneAt the old tick wrote, so
       the dn axis, the merge and every saved planner carry over unchanged */
    case 'focus-aside':{
      const f=state.focus.find(x=>x.id===id);
      f.done=true; f.doneAt=today();
      /* setting the last held statement aside empties the panel; peek it open so
         the archive does not vanish mid-gesture. Not persisted, like every peek. */
      if(!state.focus.some(x=>!x.done)) ui.peek.focus=true;
      break;
    }
    case 'focus-back':{
      const f=state.focus.find(x=>x.id===id);
      f.done=false; f.doneAt=null; break;
    }
    case 'focus-del':{
      const i=state.focus.findIndex(x=>x.id===id), f=state.focus.splice(i,1)[0];
      toast('Statement removed',()=>state.focus.splice(i,0,f)); break;
    }
    case 'focus-rename':{
      el.contentEditable=true; el.dataset.kind='focusrename'; el.dataset.id=id; el.focus(); return;
    }
    case 'focus-toggle-done': s.showDone=!s.showDone; save(); renderFocus(); return;

    case 'cal-nav': s.calOffset=(+el.dataset.d===0)?0:s.calOffset+(+el.dataset.d); break;
    case 'cal-day': s.calSel=s.calSel===el.dataset.day?null:el.dataset.day; break;
    case 'cal-clear': s.calSel=null; break;
    case 'cal-add':{
      const i=$('#calAdd'); if(!i.value.trim()) return;
      addFromText(i.value,'day:'+el.dataset.day+':'+$('#calZone').value); i.value=''; break;
    }

    case 'bin': binModal(); return;
    case 'bin-restore': restoreBin(el.dataset.id); return;
    case 'bin-purge': purgeBin(el.dataset.id); return;
    case 'bin-empty': confirmEmptyBin(); return;
    case 'bin-back': refreshBinModal(); return;
    case 'bin-empty-yes': emptyBinNow(); return;

    case 'help': helpModal(); return;
    /* theme cases MUST return: the choice is a device preference, not state, so
       it may never touch save() or the render/sync path */
    case 'themes': themeModal(); return;
    case 'theme-set': themeSet(el.dataset.t); return;
    case 'mclose': if(e.target.classList.contains('mback')||el.dataset.close) $('#modalRoot').innerHTML=''; return;
    case 'export':{
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='headspace-'+today()+'.json'; a.click();
      URL.revokeObjectURL(a.href); toast('Exported'); return;
    }
    case 'import': $('#fileIn').click(); return;

    case 'sync': syncModal(); return;
    case 'sync-gen':{
      const i=$('#syncKeyIn'); if(!i) return;
      i.value=newSyncKey(); i.focus(); if(i.select) i.select();
      toast('New key made. Press "Use this key", then copy it to your other device.'); return;
    }
    case 'sync-connect':{ const i=$('#syncKeyIn'); connectKey(i?i.value:''); return }
    case 'sync-copy':{
      const i=$('#syncKeyIn'); if(!i||!i.value.trim()) return toast('There is no key to copy yet');
      i.focus(); if(i.select) i.select();
      const done=()=>toast('Key copied');
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(i.value.trim()).then(done,()=>toast('Select the key and copy it by hand'));
        else if(document.execCommand&&document.execCommand('copy')) done();
        else toast('Select the key and copy it by hand');
      }catch(err){ toast('Select the key and copy it by hand') }
      return;
    }
    case 'sync-push': pushNow(true); return;
    case 'sync-pull': pullNow(true); return;
    case 'sync-forget': forgetKey(); return;
  }
  save(); render();
});

/* select dropdown: file to a float tab */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.action==='tofloat'&&el.value){
    move(el.dataset.id,{kind:'float',fid:el.value}); ui.sel=null; save(); render();
  }
  if(el.dataset.action==='pickdate'&&el.value){
    const f=findTask(el.dataset.id);
    const z=f&&f.from.kind==='day'?f.from.zone:'must';
    move(el.dataset.id,{kind:'day',date:el.value,zone:z}); save(); render();
  }
  if(el.id==='jumpDate'&&el.value){
    showDay(el.value); save(); render();
  }
  if(el.id==='notePage'){
    /* the page appearance rides the content axis (CONTENTF.note); patched live
       rather than rendered, so a caret parked in the editor is never disturbed */
    const n=state.notes.find(x=>x.id===state.settings.noteSel); if(!n) return;
    if(el.value==='plain') delete n.pg; else n.pg=el.value;
    const ed=$('#noteBody');
    if(ed){ ed.classList.toggle('pg-ruled',n.pg==='ruled');
            ed.classList.toggle('pg-dot',n.pg==='dot') }
    save(); return;
  }
  if(el.id==='fileIn'&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        if(!p.days&&!p.floats) throw 0;
        const f=fresh();
        /* an import replaces this device's planner, so whatever it brings counts as
           the newest word on those items and whatever it drops counts as removed */
        swapState(stampLegacy({...f,...p,settings:{...f.settings,...(p.settings||{})}}));
        eachItem(state,(k,o)=>{ o.up=Date.now() });
        commit(); render(); toast('Imported');
      }catch(err){ toast('That file could not be read as a Headspace export') }
    };
    r.readAsText(el.files[0]); el.value='';
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const el=e.target, d=el.dataset||{};

  /* ---- the Notes editor's own keys, before anything else claims them ---- */
  if(el.id==='noteBody'){
    /* undo and redo are ours, not the browser's: preventDefault, or Chrome would
       ALSO run its native step and the two stacks would fight. Ctrl+Z / Ctrl+Y on
       Windows and Linux, Cmd+Z / Cmd+Shift+Z on a Mac, Ctrl+Shift+Z for the many
       people who type it out of habit. */
    if((e.ctrlKey||e.metaKey)&&!e.altKey&&/^[zyZY]$/.test(e.key)){
      e.preventDefault();
      noteUndo(el,e.key==='y'||e.key==='Y'||e.shiftKey);
      return;
    }
    /* the two dash rules. Both rewrite the sanctioned shapes by hand and then raise
       ONE input event, so the body, the save and the undo history all see the whole
       conversion as a single edit rather than as a stray space. */
    if(e.key===' '&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      if(noteDashClose(el)||noteDashOpen(el)){
        e.preventDefault();
        el.dispatchEvent(new Event('input',{bubbles:true}));
        return;
      }
    }
  }

  if(e.key==='Enter'&&!e.shiftKey){
    if(el.id==='qi'&&el.value.trim()){ e.preventDefault(); $('#qb').click(); return }
    /* commit and reopen, rather than commit and close: see addChain */
    if(d.enter==='add'){ e.preventDefault(); addChain(d.k); return }
    if(d.enter==='sub'){ e.preventDefault();
      const b=document.querySelector('[data-action="sadd"][data-id="'+d.tid+'"]'); if(b)b.click(); return }
    if(d.enter==='caladd'){ e.preventDefault();
      const b=document.querySelector('[data-action="cal-add"][data-day="'+d.day+'"]'); if(b)b.click(); return }
    if(d.enter==='focus'){ e.preventDefault();
      const b=document.querySelector('[data-action="focus-add"]'); if(b)b.click(); return }
    if(d.enter==='habit'){ e.preventDefault();
      const b=document.querySelector('[data-action="habit-add"]'); if(b)b.click(); return }
    if(d.enter==='week'){ e.preventDefault();
      const b=document.querySelector('[data-action="week-add"]'); if(b)b.click(); return }
    if(d.enter==='synckey'){ e.preventDefault(); connectKey(el.value); return }
    if(el.id==='noteTitle'){ e.preventDefault();
      const b=$('#noteBody'); if(b) b.focus(); return }
    if(['rename','subrename','floatrename','folderrename','focusrename','habitrename','weekrename'].includes(d.kind)){ e.preventDefault(); el.blur(); return }
  }
  if(e.key==='Escape'){
    if(['rename','subrename','floatrename','folderrename','focusrename','habitrename','weekrename'].includes(d.kind)){ ui.cancelEdit=true; el.blur(); return }
    if($('#modalRoot').innerHTML){ $('#modalRoot').innerHTML=''; return }
    if(ui.adding){ closeAdd(false); render(); return }
    /* the keyboard's way out of an active True north, matching the outside press */
    if(ui.northOn){ ui.northOn=false; renderFocus(); return }
    if(ui.sel){ ui.sel=null; render(); return }
  }
});
document.addEventListener('blur',e=>{
  const el=e.target, d=el.dataset||{};
  if(!['rename','subrename','floatrename','folderrename','focusrename','habitrename','weekrename'].includes(d.kind)) return;
  el.contentEditable=false;
  const txt=el.textContent.trim();
  if(ui.cancelEdit||!txt){ ui.cancelEdit=false; render(); return }
  if(d.kind==='rename') findTask(d.id).task.title=txt;
  if(d.kind==='subrename'){
    const t=findTask(d.id).task, s=t.subtasks.find(x=>x.id===d.sid); if(s) s.title=txt;
  }
  if(d.kind==='floatrename'){ const f=float(d.fid); if(f) f.name=txt.replace(/^\s*/,'') }
  if(d.kind==='folderrename'){ const f=arr(state.folders).find(x=>x.id===d.fid); if(f) f.name=txt }
  if(d.kind==='focusrename'){ const f=state.focus.find(x=>x.id===d.id); if(f) f.title=txt }
  if(d.kind==='habitrename'){ const h=state.habits.list.find(x=>x.id===d.id); if(h) h.name=txt }
  if(d.kind==='weekrename'){ const t=state.week.list.find(x=>x.id===d.id); if(t) t.title=txt }
  delete el.dataset.kind;
  save(); render();
},true);

/* FLIP the tab swap: measure where every tab column sits, redraw in the new
   order, then run each column from its old spot to its new one as a transform,
   which with opacity is all that stays off the layout and paint path. One render,
   the rest is compositor work. Skipped whole under prefers-reduced-motion, and
   wherever element.animate does not exist (jsdom). */
function flipTabs(){
  const cols=$$('#board .col.backlog');
  if(!cols.length||typeof cols[0].animate!=='function'
    ||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)){ render(); return }
  const first={};
  cols.forEach(c=>first[c.dataset.fid]=c.getBoundingClientRect());
  render();
  $$('#board .col.backlog').forEach(c=>{
    const a=first[c.dataset.fid]; if(!a) return;
    const b=c.getBoundingClientRect(), dx=a.left-b.left, dy=a.top-b.top;
    if(dx||dy) c.animate(
      [{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],
      {duration:200,easing:'cubic-bezier(.2,.7,.3,1)'});
  });
}

/* ---------- drag and drop ----------
   Three drag sources, told apart by where the press started: a subtask row, a task
   card, or a Free Floating tab's header. Cards and subtasks drop on [data-drop] zones
   as they always have; a tab drops on another tab's column. ui.drag.type routes every
   dragover and drop, so the new tab drag cannot shadow the card paths. */
document.addEventListener('dragstart',e=>{
  const sub=e.target.closest('.sub');
  if(sub){ ui.drag={type:'sub',sid:sub.dataset.sub,pid:sub.dataset.parent}; sub.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',sub.dataset.sub); return }
  const t=e.target.closest('.task');
  if(t){ ui.drag={type:'task',id:t.dataset.id}; t.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',t.dataset.id); return }
  const th=e.target.closest('.col.backlog .colhead');
  if(th){
    /* a rename is open in this header: leave the browser's text drag alone.
       data-kind is the app's own open-rename marker, set by every rename path. */
    if(th.querySelector('[data-kind],[contenteditable="true"]')) return;
    const col=th.closest('.col.backlog');
    ui.drag={type:'tab',fid:col.dataset.fid}; col.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',col.dataset.fid);
  }
});
document.addEventListener('dragend',()=>{
  $$('.dragging').forEach(n=>n.classList.remove('dragging'));
  $$('.drop').forEach(n=>n.classList.remove('drop','drop-before','drop-after'));
  ui.drag=null;
});
document.addEventListener('dragover',e=>{
  if(!ui.drag) return;
  if(ui.drag.type==='tab'){
    /* dragover streams continuously, moving or not, so this path caches the
       target column, its rect (nothing relayouts mid-drag) and the landing side
       on ui.drag and returns before any DOM write when none of them changed */
    const c=e.target.closest('.col.backlog');
    if(!c||c.dataset.fid===ui.drag.fid){
      /* off every target: let the cue go at once, so it cannot linger and
         promise a landing the drop would not make */
      if(ui.drag.over){ ui.drag.over.classList.remove('drop','drop-before','drop-after'); ui.drag.over=null }
      return;
    }
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    /* the same midpoint the drop will use, so the bar names the true landing side */
    const r=ui.drag.over===c?ui.drag.rect:c.getBoundingClientRect();
    const side=(!wideLayout()?e.clientY>r.top+r.height/2:e.clientX>r.left+r.width/2)
      ?'drop-after':'drop-before';
    if(ui.drag.over===c&&ui.drag.side===side) return;
    if(ui.drag.over&&ui.drag.over!==c) ui.drag.over.classList.remove('drop','drop-before','drop-after');
    c.classList.remove(side==='drop-after'?'drop-before':'drop-after');
    c.classList.add('drop',side);
    ui.drag.over=c; ui.drag.rect=r; ui.drag.side=side;
    return;
  }
  const z=e.target.closest('[data-drop]'); if(!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  $$('.drop').forEach(n=>n!==z&&n.classList.remove('drop'));
  z.classList.add('drop');
});
document.addEventListener('drop',e=>{
  if(ui.drag&&ui.drag.type==='tab'){
    const c=e.target.closest('.col.backlog'), fid=ui.drag.fid;
    ui.drag=null;
    if(!c||c.dataset.fid===fid) return;
    e.preventDefault(); c.classList.remove('drop','drop-before','drop-after');
    /* land before or past the target by which half of it the pointer let go in;
       the columns run sideways on a wide screen and stack on a narrow one */
    const r=c.getBoundingClientRect();
    const after=!wideLayout()?e.clientY>r.top+r.height/2:e.clientX>r.left+r.width/2;
    if(reorderTab(fid,c.dataset.fid,after)){ save(); flipTabs() }
    return;
  }
  const z=e.target.closest('[data-drop]'); if(!z||!ui.drag) return;
  e.preventDefault(); z.classList.remove('drop');
  const dest=z.dataset.drop==='day'
    ? {kind:'day',date:z.dataset.day,zone:z.dataset.zone}
    : {kind:'float',fid:z.dataset.fid};
  if(ui.drag.type==='task'){ move(ui.drag.id,dest) }
  else{
    const parent=findTask(ui.drag.pid);
    if(parent){
      const i=parent.task.subtasks.findIndex(s=>s.id===ui.drag.sid);
      const sub=parent.task.subtasks.splice(i,1)[0];
      const card=e.target.closest('.task');
      if(card&&card.dataset.id!==ui.drag.pid){
        const other=findTask(card.dataset.id);
        if(other) other.task.subtasks.push(sub);
        else{ ui.skipBin=(ui.skipBin||[]).concat(sub.id);
          const nt=mkTask(sub.title); nt.done=sub.done; place(nt,dest) }
      }else{ ui.skipBin=(ui.skipBin||[]).concat(sub.id);
        const nt=mkTask(sub.title); nt.done=sub.done; place(nt,dest); ui.flash=nt.id }
    }
  }
  ui.drag=null; save(); render();
});

/* ================= custom pickers (desktop pointer only) =================
   The native date popup and select dropdown cannot be styled, and their OS blue
   highlight fights the palette. On devices with a real pointer (hover:hover, the
   same condition the CSS keys its hover states on) a popover is layered OVER the
   native controls: the inputs, their values and every handler that reads them stay
   untouched, the popover just writes the value and fires the same change event.
   Touch devices keep the native pickers, which are genuinely better there.
   Focus stays on the trigger the whole time (arrow keys are routed from it), so
   there is no focus to trap and nothing to restore beyond the trigger itself. */
let pop=null;
const finePointer=()=>ui.pointerFine!=null?ui.pointerFine
  :!!(window.matchMedia&&window.matchMedia('(hover: hover)').matches);
function popClose(refocus){
  if(!pop) return;
  const sel=pop.refocus;
  $('#popRoot').innerHTML=''; pop=null;
  /* preventScroll everywhere in this layer: focusing an anchor half out of a scroll
     container would scroll it into view, and that scroll would close the popover */
  if(refocus&&sel){ const n=$(sel); if(n) n.focus({preventScroll:true}) }
}
function popPlace(){
  const p=pop.el, r=pop.anchor.getBoundingClientRect();
  if(pop.kind==='list') p.style.minWidth=Math.max(190,r.width)+'px';
  let x=r.left, y=r.bottom+6;
  const pw=p.offsetWidth||0, ph=p.offsetHeight||0;
  if(x+pw>window.innerWidth-8) x=window.innerWidth-8-pw;
  if(x<8) x=8;
  if(y+ph>window.innerHeight-8) y=Math.max(8,r.top-6-ph);   /* flip above the anchor */
  p.style.left=x+'px'; p.style.top=y+'px';
}
function popOpen(anchor,kind,refocus){
  popClose(false);
  $('#popRoot').innerHTML='<div class="popover" role="dialog"></div>';
  pop={el:$('#popRoot .popover'),anchor,kind,refocus};
}
/* a render may have replaced the anchor node; aim the write at the live one */
function popAnchor(){
  return document.contains(pop.anchor)?pop.anchor:$(pop.refocus);
}

/* date picker over #jumpDate and the per-task pickdate input */
function dpOpen(inp){
  const sel=inp.id==='jumpDate'?'#jumpDate'
    :'[data-action="pickdate"][data-id="'+inp.dataset.id+'"]';
  popOpen(inp,'date',sel);
  pop.act=inp.value||today();
  const d=new Date(pop.act+'T12:00:00');
  pop.y=d.getFullYear(); pop.m=d.getMonth();
  dpRender();
  /* the popover holds focus while open. Focusing the date input instead would light
     its segment highlight, which Chrome paints in OS blue and does not let CSS touch;
     the key router works from any target, so nothing is lost */
  pop.el.tabIndex=-1; pop.el.focus({preventScroll:true});
}
function dpRender(){
  const y=pop.y, m=pop.m, val=pop.anchor.value;
  const first=new Date(y,m,1).getDay(), len=new Date(y,m+1,0).getDate();
  let h='<div class="phead"><button class="nbtn" data-pnav="-1" aria-label="Previous month">‹</button>'+
    '<b>'+MON[m]+' '+y+'</b>'+
    '<button class="nbtn" data-pnav="1" aria-label="Next month">›</button></div>'+
    '<div class="pdow">'+DOW.map(x=>'<span>'+x.slice(0,2)+'</span>').join('')+'</div>'+
    '<div class="pgrid">';
  for(let i=0;i<first;i++) h+='<span></span>';
  for(let n=1;n<=len;n++){
    const d=iso(new Date(y,m,n));
    h+='<button class="pday'+(d===today()?' today':'')+(d===val?' on':'')+
      (d===pop.act?' act':'')+'" data-pday="'+d+'">'+n+'</button>';
  }
  h+='</div><div class="pfoot"><button class="nbtn" data-pact="today">Today</button>'+
     '<button class="nbtn" data-pact="clear">Clear</button></div>';
  pop.el.innerHTML=h; popPlace();
}
function dpMove(days){
  pop.act=plus(days,pop.act);
  const d=new Date(pop.act+'T12:00:00');
  pop.y=d.getFullYear(); pop.m=d.getMonth();
  dpRender();
}
function dpShift(dm){
  const d=new Date(pop.y,pop.m+dm,1);
  pop.y=d.getFullYear(); pop.m=d.getMonth();
  dpRender();
}
function dpSet(v){
  const a=popAnchor(), sel=pop.refocus, viaKey=pop.viaKey;
  popClose(false);
  if(!a) return;
  a.value=v;
  a.dispatchEvent(new Event('change',{bubbles:true}));
  /* only a keyboard flow puts focus back on the date input: that is the focus the user
     needs to continue, and the segment highlight it lights is their focus indicator.
     After a mouse pick the input stays unfocused, so no OS blue ever shows */
  if(viaKey){ const n=$(sel); if(n) n.focus({preventScroll:true}) }
}

/* destination list over the #qd select, built from its live optgroups so the
   grouping and labels can never drift from what the select itself holds */
function qdOpen(sel){
  popOpen(sel,'list','#qd');
  pop.opts=[];
  let h='';
  [...sel.querySelectorAll('optgroup,option')].forEach(n=>{
    if(n.tagName==='OPTGROUP'){ h+='<div class="pgl">'+esc(n.label)+'</div>'; return }
    h+='<button class="popt'+(n.value===sel.value?' on':'')+'" role="option" data-pval="'+
      esc(n.value)+'">'+esc(n.textContent)+'</button>';
    pop.opts.push(n.value);
  });
  pop.el.innerHTML='<div class="plist" role="listbox">'+h+'</div>';
  pop.act=Math.max(0,pop.opts.indexOf(sel.value));
  qdMark(); popPlace();
  pop.el.tabIndex=-1; pop.el.focus({preventScroll:true});
}
function qdMark(){
  $$('#popRoot .popt').forEach((b,i)=>{
    b.classList.toggle('act',i===pop.act);
    if(i===pop.act&&b.scrollIntoView) b.scrollIntoView({block:'nearest'});
  });
}
function qdSet(v){
  const a=popAnchor()||$('#qd');
  popClose(false);
  if(!a) return;
  if(a.value!==v){ a.value=v; a.dispatchEvent(new Event('change',{bubbles:true})) }
  a.focus({preventScroll:true});
}

const pickAnchor=t=>t.id==='qd'||t.id==='jumpDate'||(t.dataset&&t.dataset.action==='pickdate');
document.addEventListener('mousedown',e=>{
  const t=e.target;
  if(pop&&!pop.el.contains(t)&&t!==pop.anchor) popClose(false);
  if(!finePointer()||!pickAnchor(t)) return;
  e.preventDefault();                      /* keeps the native picker shut */
  if(pop&&pop.anchor===t){ popClose(pop.viaKey); return }
  let a=t;
  if(ui.adding&&!t.closest('.zaddrow')){   /* mirror the click handler's outside-tap close,
                                              since the click below never reaches it */
    const sel=t.id?'#'+t.id:'[data-action="pickdate"][data-id="'+t.dataset.id+'"]';
    closeAdd(true); save(); render();
    a=$(sel); if(!a) return;
  }
  if(a.id==='qd') qdOpen(a); else dpOpen(a);
});
/* The pickdate input carries a data-action, so its raw click would fall through the
   delegated switch into the shared save()+render() tail: the board rebuild resets the
   horizontal scroll, and that scroll closes the popover that mousedown just opened.
   With the layer active the click has no job left, so stop it before the app sees it.
   Without a fine pointer nothing is stopped and the native path is exactly as before. */
document.addEventListener('click',e=>{
  if(finePointer()&&pickAnchor(e.target)) e.stopPropagation();
},true);
/* keep a press inside the popover from stealing focus off the trigger, but leave
   the list's scrollbar draggable */
$('#popRoot').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault() });
$('#popRoot').addEventListener('click',e=>{
  e.stopPropagation();                     /* the app's delegated handler stays out */
  const b=e.target.closest('button'); if(!b||!pop) return;
  if(b.dataset.pnav) dpShift(+b.dataset.pnav);
  else if(b.dataset.pday) dpSet(b.dataset.pday);
  else if(b.dataset.pact==='today') dpSet(today());
  else if(b.dataset.pact==='clear') dpSet('');
  else if(b.dataset.pval!=null) qdSet(b.dataset.pval);
});
/* capture phase, so an open popover owns its keys before the app-wide keydown
   handler can act on them (Escape must not also deselect the card behind it) */
document.addEventListener('keydown',e=>{
  if(!pop){
    if(!finePointer()) return;
    const el=e.target;
    if(el.id==='qd'&&['Enter',' ','ArrowDown','ArrowUp'].includes(e.key)){
      e.preventDefault(); e.stopPropagation(); qdOpen(el); pop.viaKey=true; return }
    if((el.id==='jumpDate'||(el.dataset&&el.dataset.action==='pickdate'))&&
       (e.key==='Enter'||e.key===' ')){
      e.preventDefault(); e.stopPropagation(); dpOpen(el); pop.viaKey=true }
    return;
  }
  if(e.key==='Tab'){ popClose(false); return }
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); popClose(true); return }
  const nav={list:{ArrowDown:1,ArrowUp:-1},date:{ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}}[pop.kind];
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault(); e.stopPropagation();
    if(pop.kind==='list') qdSet(pop.opts[pop.act]); else dpSet(pop.act);
  }else if(nav[e.key]){
    e.preventDefault(); e.stopPropagation();
    if(pop.kind==='list'){ pop.act=Math.min(pop.opts.length-1,Math.max(0,pop.act+nav[e.key])); qdMark() }
    else dpMove(nav[e.key]);
  }
},true);
window.addEventListener('resize',()=>popClose(false));
window.addEventListener('scroll',e=>{
  if(!pop) return;
  const t=e.target&&e.target.nodeType===9?document.documentElement:e.target;
  if(t&&pop.el.contains(t)) return;        /* the list scrolling itself is fine */
  popClose(false);
},true);

/* ---------- modals ---------- */

   and the open page). A modal rather than a drag or a per-row select: it works
   by tap on a phone (risk 12 is why drag was never an option), it reuses the
   surface and option idioms the app already has, and it adds nothing to the
   row or the meta strip beyond one quiet button each. */
function noteMoveBody(n){

      '" data-action="note-move-to" data-id="'+n.id+'" data-fid="'+f.id+'">'+esc(f.name)+'</button>').join('')+
    '</div><div class="mrow"><button data-action="mclose" data-close="1">Cancel</button></div>';
}
function noteMoveModal(id){

/* ---------- quick-add autogrow ---------- */
function grow(){ const t=$('#qi'); if(!t) return; t.style.height='auto';
  t.style.height=Math.min(170,Math.max(44,t.scrollHeight))+'px' }
document.addEventListener('input',e=>{
  if(e.target.id==='qi') grow();
  if(e.target.classList&&e.target.classList.contains('addin')) ui.addText=e.target.value;
  /* the notes editor: every keystroke lands in state and rides the normal save
     debounce. No render here, so the caret is never disturbed by typing; only the
     list row's label and the quiet meta line are patched in place.
     The body serializes through the sanitizer on every input, collapsing back to
     plain text whenever no formatting is present. */
  if(e.target.id==='noteTitle'||e.target.id==='noteBody'){
    const n=state.notes.find(x=>x.id===state.settings.noteSel);
    if(!n) return;
    if(e.target.id==='noteTitle'){
      n.title=e.target.value;
      const row=$('.noterow.on .ntx'); if(row) row.textContent=noteLabel(n);
      const m=$('#noteMeta'); if(m) m.textContent=noteMetaText(n,Date.now());
    }else{
      n.body=noteSerialize(e.target);
      noteHistTrack(e.target,n);   /* one snapshot per word, see noteHistBreak */
      notePatchRow(n);
      noteStepState();             /* the first word makes Undo live, and a fresh edit kills Redo */
    }
    save();
  }
  /* the sticky note: text and stamp move TOGETHER, at the keystroke, so the
     unstamped-debounce window that once cost a note body its merge (Section 5 of
     the review) cannot exist here: whenever the text is newer, so is its stamp.
     No render, so the caret is never disturbed. */
  if(e.target.id==='stickyPad'){
    state.sticky={text:e.target.value,at:Date.now()};
    save();
  }
  /* the search box filters the list in place: no save (nothing persists), and no
     render, so the editor, and whoever is typing in it, is never touched */
  if(e.target.id==='noteSearch'){
    ui.noteQ=e.target.value;
    const rows=$('#noteRows'); if(rows) rows.innerHTML=noteRowsHtml();
  }
});
/* paste into the editor lands as plain text: outside markup, whatever survived the
   sanitizer, would still be someone else's formatting habits pasted into a calm
   page. insertText raises the normal input event, so the serialize path runs. */
document.addEventListener('paste',e=>{
  const ed=e.target&&e.target.closest?e.target.closest('#noteBody'):null;
  const host=ed||((e.target&&e.target.id==='noteBody')?e.target:null);
  if(!host) return;
  e.preventDefault();
  const t=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';
  if(t&&document.execCommand){ try{ document.execCommand('insertText',false,t) }catch(err){} }
});
/* pressing a toolbar button must not blur the editor: the selection it is about to
   format lives there, and an undo fired against a lost selection restores text with
   nowhere to put the caret. Prevented across the strip rather than on the buttons
   alone, so a press that lands on the padding, on a separator, or on a DISABLED step
   button (which is pointer-transparent, so the press arrives here) is caught too.
   The page select keeps its default so its dropdown still opens. */
document.addEventListener('mousedown',e=>{
  const t=e.target;
  if(!t||!t.closest) return;
  if(t.closest('#noteTools')&&!t.closest('#notePage')) e.preventDefault();
});
/* the toolbar mirrors the caret: bold lights while the caret sits in bold text.
   Cheap, and gated to the one view that has a toolbar at all. */
document.addEventListener('selectionchange',()=>{
  if(state&&state.settings&&state.settings.view==='notes'&&
     document.activeElement&&document.activeElement.id==='noteBody') noteToolState();
});

/* ---------- scrollbars ----------
   The one class the stylesheet's two scrollbar states hang off. `scroll` does not
   bubble, so this listens in the CAPTURE phase: that is what lets ONE listener cover
   every scroller in the app, including any added later, without each one opting in.
   Passive, so it can never delay a scroll. The element is marked while scrolling and
   unmarked after SB_IDLE ms of stillness; a rebuilt element simply leaves a stale
   timer pointing at a detached node, which fires once into nothing. */
const SB_IDLE=900;
const sbTimers=new WeakMap();
document.addEventListener('scroll',e=>{
  const t=e.target;
  const el=(!t||t===document||t===window)?document.documentElement:t;
  if(!el.classList) return;
  el.classList.add('scrolling');
  clearTimeout(sbTimers.get(el));
  sbTimers.set(el,setTimeout(()=>el.classList.remove('scrolling'),SB_IDLE));
},{capture:true,passive:true});

/* ---------- resize ---------- */
/* Phones fire resize every time the on-screen keyboard opens or closes, because it
   shrinks the layout viewport. That only ever changes the height. Re-rendering there
   tore out the very input the keyboard belonged to, wiping the half typed text and
   stealing focus back, so only a real width change rebuilds the board. */
let rz=null, lastW=window.innerWidth;
window.addEventListener('resize',()=>{
  if(window.innerWidth===lastW) return;
  lastW=window.innerWidth;
  clearTimeout(rz);rz=setTimeout(()=>{ui.renderKey='';render()},150);
});

/* ---------- offline support ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

/* ---------- boot ---------- */
load();
themeApply(themeGet());   /* the head script already set the attribute; this keeps the meta in step */
rollIfNewDay({delay:true,boot:true});
if(!state.settings.stripDay) state.settings.stripDay=today();
render();
syncBoot();
window.A={state,ui,render,rollover,findTask,move,reorderTab,tally,streak,save:commit,
  sync,syncPush:()=>pushNow(true),syncPull:()=>pullNow(true),newSyncKey,
  mergeStates,flatten,stateSig,readCloud,stampLegacy,syncCycle,
  restoreBin,purgeBin,emptyBinNow,binList,fresh,MERGED_KEYS,rollIfNewDay,pastOpenCount,
  themeGet,themeSet,railOpen,railSet,
  get live(){ return state }};
</script>
