<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Headspace — Day Planner</title>
<meta name="description" content="A calm daily planner: musts, shoulds and free time.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CFE3F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Headspace">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* light blue palette adapted from the three references */
  --bg:#EDF4FA;          /* Cloud Blue: the highlighted light background */
  --panel:#CFE3F1;       /* Powder Sky: rails, columns, framed surfaces */
  --panel2:#C4DBEC;      /* a touch deeper for headers / active tabs */
  --card:#EDF4FA;        /* Cloud Blue again: cards that sit inside panels */
  --line:#B7D0E1; --line2:#9BBBD4;
  --txt:#14293F;         /* deep navy ink */
  --mut:#41627F; --mut2:#6A88A3;
  --navy:#243A5E; --denim:#5F86A6; --ocean:#8FB6D8; --teal:#567C8D;
  --sky:#CFE3F1; --cloud:#EDF4FA; --night:#243A5E; --pearl:#F5F4EF; --tasktile:#E3EEF7;
  --must:#2F4156; --should:#5F86A6; --extra:#7FA7CC;
  --done:#46728B;        /* completion / today, teal side of the palette */
  --on:#EDF4FA;          /* light ink used on dark accents (cloud blue, never white) */
  --grad:linear-gradient(135deg,#2F4156,#5F86A6);          /* text-safe */
  --gradf:linear-gradient(135deg,#2F4156,#5F86A6 55%,#8FB6D8); /* decorative */
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(36,58,94,.09),0 8px 22px rgba(36,58,94,.08);
  --fd:'Space Grotesk','Inter',system-ui,sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --rail:308px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:14.5px;line-height:1.45;overflow:hidden}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(760px 480px at 12% -6%, rgba(95,134,166,.20), transparent 62%),
    radial-gradient(680px 520px at 92% 4%, rgba(143,182,216,.24), transparent 60%),
    radial-gradient(720px 560px at 60% 108%, rgba(36,58,94,.08), transparent 62%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:radial-gradient(rgba(36,58,94,.55) .5px, transparent .5px);
  background-size:3px 3px;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{background:var(--cloud);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14px;outline:none;color:var(--txt)}
input:focus,select:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(95,134,166,.24)}
select option{background:var(--pearl);color:var(--txt)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(36,58,94,.22);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(36,58,94,.34)}
::-webkit-scrollbar-track{background:transparent}

/* shell */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh}
#app>*{min-width:0}
#rail{border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(207,227,241,.9),rgba(196,219,236,.75));backdrop-filter:blur(8px);padding:16px 14px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#main{min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:14px 16px 0;background:var(--denim)}

/* brand */
.brandrow{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--gradf);flex:none;display:grid;place-items:center;box-shadow:0 6px 18px rgba(36,58,94,.28)}
.mark i{width:11px;height:11px;border-radius:50%;background:var(--cloud);display:block}
.brand{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1.1}
.brand span{display:block;font-family:var(--fb);font-weight:600;font-size:10.5px;color:var(--txt);letter-spacing:.09em;text-transform:uppercase}
.savebadge{font-size:10.5px;color:var(--teal);background:rgba(86,124,141,.14);border:1px solid rgba(86,124,141,.34);padding:3px 9px;border-radius:99px;white-space:nowrap;align-self:center;margin-left:auto}
.savebadge.warn{color:var(--navy);border-color:rgba(36,58,94,.34);background:rgba(36,58,94,.09)}

/* rail buttons */
.navgrp{display:flex;flex-direction:column;gap:6px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r2);font-size:13.5px;font-weight:500;color:var(--mut);border:1px solid transparent;transition:.16s}
.navbtn:hover{background:rgba(36,58,94,.06);color:var(--txt)}
.navbtn.on{background:var(--pearl);border-color:var(--line2);color:var(--navy);box-shadow:var(--shadow)}
.navbtn .em{width:18px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.navbtn .em svg{width:17px;height:17px}
.navbtn .cnt{margin-left:auto;font-size:11px;color:var(--mut);background:rgba(36,58,94,.08);padding:1px 7px;border-radius:99px}
.railcap{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);padding:0 2px;margin-top:2px}
.railfoot{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.railfoot button{flex:1;padding:8px;border-radius:9px;font-size:12px;color:var(--mut);border:1px solid var(--line);background:var(--cloud);transition:.16s}
.railfoot button:hover{color:var(--navy);border-color:var(--line2)}

/* cards */
.kard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
.kh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.kh .sp{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--mut2)}

/* focus */
.frow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:none}
.ftxt{flex:1;font-size:13px;line-height:1.35;min-width:0;word-break:break-word}
.frow.done .ftxt{color:var(--mut2);text-decoration:line-through}
.fdate{font-size:10.5px;color:var(--mut2);display:block;margin-top:1px}
.mini{font-size:11px;color:var(--mut2);padding:2px 5px;border-radius:6px;transition:.14s}
.mini:hover{color:var(--navy);background:rgba(36,58,94,.08)}
.box{width:17px;height:17px;border-radius:6px;border:1.6px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:transparent;transition:.16s}
.box:hover{border-color:var(--done)}
.box.on{background:var(--done);border-color:var(--done);color:var(--on)}
.box.pop{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.fadd{display:flex;gap:6px;margin-top:9px}
.fadd input{flex:1;padding:7px 9px;font-size:13px}
.fadd button{padding:7px 12px;border-radius:9px;background:var(--grad);color:var(--on);font-weight:600;font-size:12.5px}
.fdone{margin-top:8px;font-size:11.5px;color:var(--mut2);cursor:pointer;user-select:none}

/* metrics */
.mtabs{display:flex;gap:3px;margin-left:auto;background:rgba(36,58,94,.07);padding:2px;border-radius:8px}
.mtabs button{font-size:10.5px;padding:3px 8px;border-radius:6px;color:var(--mut);font-weight:500}
.mtabs button.on{background:var(--cloud);color:var(--navy);box-shadow:0 1px 2px rgba(36,58,94,.12)}
.ringwrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rlab{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rlab b{font-family:var(--fd);font-size:21px;font-weight:700;letter-spacing:-.02em;display:block;color:var(--navy)}
.ring .rlab i{font-style:normal;font-size:9.5px;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase}
.rp{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px;color:var(--mut)}
.legend b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.dotm{width:7px;height:7px;border-radius:50%;flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.statsub{font-size:11px;color:var(--mut2);margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:2px}
.bar{flex:1;min-width:0;border-radius:5px 5px 3px 3px;background:var(--gradf);transition:height .45s cubic-bezier(.4,0,.2,1);min-height:3px;position:relative}
.bar.now{box-shadow:0 0 0 1.5px var(--teal)}
.barlbl{display:flex;gap:6px;margin-top:5px;font-size:9.5px;color:var(--mut2)}
.barlbl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.goalbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.goalbar .gt{display:flex;font-size:11px;color:var(--mut);margin-bottom:6px}
.goalbar .gt b{margin-left:auto;color:var(--txt);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:rgba(36,58,94,.10);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--gradf);transition:width .55s cubic-bezier(.4,0,.2,1)}

/* quick add */
#quickadd{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#qi{flex:1;min-width:180px;min-height:44px;padding:11px 13px;font-size:14.5px;line-height:1.4;background:var(--pearl);border:1px solid var(--line2);border-radius:var(--r2);resize:none;overflow:hidden;max-height:170px;outline:none;box-shadow:var(--shadow)}
#qi:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(95,134,166,.24)}
#qi::placeholder{color:var(--mut2)}
#qd{padding:11px 10px;font-size:13px;max-width:190px;background:var(--pearl)}
#qb{padding:11px 18px;border-radius:var(--r2);background:var(--grad);color:var(--on);font-weight:700;font-size:14px;letter-spacing:-.01em;transition:.15s;box-shadow:var(--shadow)}
#qb:active{transform:scale(.97)}

/* carry tray */
#tray:not(:empty){margin-bottom:12px}
.tray{border:1px solid rgba(95,134,166,.5);border-radius:var(--r);padding:11px 13px;background:linear-gradient(160deg,rgba(143,182,216,.30),rgba(207,227,241,.6));animation:drop .3s ease;box-shadow:var(--shadow)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.trayhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.trayhead b{font-family:var(--fd);font-size:13.5px;color:var(--navy)}
.trayhead .why{font-size:11.5px;color:var(--mut)}
.trayhead .acts{margin-left:auto;display:flex;gap:6px}
.tbtn{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);color:var(--navy);background:var(--cloud);transition:.15s}
.tbtn:hover{background:var(--panel)}
.trayitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(36,58,94,.10);font-size:13px}
.trayitem .from{font-size:10.5px;color:var(--mut);background:rgba(36,58,94,.08);padding:1px 7px;border-radius:99px;white-space:nowrap}
.trayitem .t{flex:1;min-width:0;word-break:break-word}

/* board nav */
#boardnav{display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.nbtn{padding:7px 12px;border-radius:9px;font-size:12.5px;color:var(--navy);border:1px solid var(--line);background:var(--pearl);transition:.15s;font-weight:500}
.nbtn:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
.nbtn:hover{color:var(--navy);border-color:var(--line2)}
.nbtn.solid{background:var(--navy);border-color:rgba(237,244,250,.32);color:var(--on)}
#boardnav .jl{font-size:11.5px;color:#A9C4DB;margin-left:6px}
#boardnav input[type=date]{padding:6px 9px;font-size:12.5px;color-scheme:light}
.offnote{font-size:11.5px;color:#8FB6D8;margin-left:auto;font-weight:600}

/* board */
#board{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-bottom:16px;flex:1;min-width:0;align-items:flex-start}
.col{width:268px;flex:none;display:flex;flex-direction:column;max-height:100%;background:var(--cloud);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.anim .col{animation:rise .34s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.col.today{border-color:var(--teal);box-shadow:0 0 0 1px rgba(86,124,141,.35),var(--shadow)}
.col.past{opacity:.66}
.colhead{padding:11px 12px 9px;border-bottom:1px solid var(--line);flex:none;background:rgba(36,58,94,.03)}
.colhead .d1{display:flex;align-items:baseline;gap:7px}
.colhead .dow{font-family:var(--fd);font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--navy);text-transform:uppercase}
.colhead .dnum{font-size:11.5px;color:var(--mut);text-transform:uppercase}
.badge{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:rgba(86,124,141,.2);color:var(--teal);border:1px solid rgba(86,124,141,.42)}
.colhead .meta{font-size:11px;color:var(--mut);margin-top:3px}
.heavy{margin-top:7px;font-size:11px;padding:5px 8px;border-radius:8px;background:rgba(36,58,94,.10);border:1px solid rgba(36,58,94,.32);color:var(--navy)}
.colbody{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:11px;min-height:60px}
.zone{border-radius:var(--r2);padding:2px}
.zone.drop{outline:1.5px dashed var(--denim);outline-offset:2px;background:rgba(95,134,166,.12)}
.zh{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:2px 3px 6px}
.zh .pip{width:6px;height:6px;border-radius:50%;flex:none}
.zh .lk{width:12px;height:12px;margin-left:2px;color:var(--denim);flex:none}
.zh .n{margin-left:auto;font-weight:500;letter-spacing:0;font-size:10.5px}
.zone.locked{opacity:.55}
.lockmsg{font-size:11px;color:var(--mut2);padding:4px 4px 6px;font-style:italic}
.freego{font-size:11px;color:var(--teal);padding:4px 4px 6px;font-weight:600}
.zadd{width:100%;text-align:left;font-size:11.5px;color:var(--mut2);padding:5px 6px;border-radius:7px;transition:.14s;margin-top:2px}
.zadd:hover{background:rgba(36,58,94,.06);color:var(--navy)}

/* task card */
.task{background:var(--tasktile);border:1px solid var(--line);border-radius:var(--r2);padding:8px 9px;margin-bottom:6px;transition:.15s;box-shadow:0 1px 1px rgba(36,58,94,.06)}
.task:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.task.sel{border-color:var(--denim);background:var(--cloud);box-shadow:0 0 0 1px rgba(95,134,166,.4),var(--shadow)}
.task.dragging{opacity:.4}
.task.flash{animation:flash .7s ease}
@keyframes flash{0%{background:rgba(95,134,166,.4)}100%{background:var(--tasktile)}}
.trow{display:flex;align-items:flex-start;gap:8px}
.ttl{flex:1;min-width:0;font-size:13.5px;line-height:1.35;word-break:break-word;cursor:pointer}
.task.done .ttl{color:var(--mut2);text-decoration:line-through}
.subn{font-size:10.5px;color:var(--mut2);white-space:nowrap;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.abtn{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mut);background:var(--panel);transition:.14s;white-space:nowrap}
.abtn:hover{color:var(--navy);border-color:var(--line2);background:var(--panel2)}
.abtn.m{color:#2F4156;border-color:rgba(47,65,86,.4)}
.abtn.s{color:#3F6488;border-color:rgba(95,134,166,.45)}
.abtn.e{color:#3C6A8E;border-color:rgba(127,167,204,.5)}
.abtn.del{color:var(--mut)}
.acts select{font-size:11px;padding:3px 6px;border-radius:7px}
.sbody{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;padding:2px 0}
.sub.dragging{opacity:.4}
.sub .st{flex:1;min-width:0;word-break:break-word;line-height:1.3}
.sub.done .st{color:var(--mut2);text-decoration:line-through}
.sbox{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:9px;color:transparent;transition:.15s}
.sbox.on{background:var(--done);border-color:var(--done);color:var(--on)}
.saddrow{display:flex;gap:5px;margin-top:3px}
.saddrow input{flex:1;padding:5px 8px;font-size:12px;border-radius:7px}
[contenteditable]{outline:none;border-bottom:1.5px solid var(--denim);padding-bottom:1px}

/* calendar */
#cal{flex:1;overflow-y:auto;padding-bottom:16px;min-width:0}
.calbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.calbar h2{font-family:var(--fd);font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;color:var(--navy)}
.chip{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(86,124,141,.18);border:1px solid rgba(86,124,141,.38);color:var(--teal);display:inline-flex;align-items:center;gap:7px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.caldow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.caldow div{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);padding:2px}
.cell{min-height:74px;border-radius:var(--r2);padding:6px 7px;border:1px solid var(--line);background:var(--card);transition:.15s;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.cell:hover{background:var(--panel)}
.cell.blank{border:none;background:none;cursor:default;min-height:0}
.cell.today{border-color:var(--teal)}
.cell.sel{border-color:var(--denim);background:rgba(95,134,166,.14)}
.cell .n{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.cell.today .n{color:var(--teal);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots .more{font-size:9px;color:var(--mut2);line-height:6px}
.cell .allok{font-size:11px;color:var(--teal)}
.dpanel{margin-top:16px}
.dphead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.dphead b{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--navy)}
.dpadd{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.dpadd input{flex:1;min-width:160px}
.dplist{max-width:640px}

/* modal / toast */
.mback{position:fixed;inset:0;background:rgba(33,64,95,.4);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:22px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;animation:drop .24s cubic-bezier(.2,.7,.3,1);box-shadow:0 24px 60px rgba(36,58,94,.28)}
.modal h3{font-family:var(--fd);font-size:19px;font-weight:600;margin:0 0 12px;letter-spacing:-.02em;color:var(--navy)}
.modal p{font-size:13.5px;color:var(--mut);margin:0 0 11px;line-height:1.55}
.modal p b{color:var(--txt)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mrow button{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line2);color:var(--navy);background:var(--panel)}
.mrow button.pri{background:var(--grad);color:var(--on);border-color:transparent}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300}

.toast button{font-size:12.5px;font-weight:700;color:var(--ocean);padding:3px 8px;border-radius:7px}
.toast button:hover{background:rgba(143,182,216,.2)}
.empty{font-size:12px;color:var(--mut2);padding:10px 4px;font-style:italic}

/* sync panel */
.syncrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.syncrow input{flex:1;min-width:190px;font-size:12.5px;letter-spacing:.02em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--pearl)}
.syncstat{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.5;color:var(--mut);
  background:var(--pearl);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;margin-bottom:12px}
.syncstat .sdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--mut2)}
.syncstat.busy .sdot{background:var(--denim)}
.syncstat.synced .sdot{background:var(--done)}
.syncstat.offline .sdot{background:var(--ocean)}
.syncstat.error .sdot,.syncstat.conflict .sdot{background:var(--navy)}
.synchint{font-size:11.5px!important;color:var(--mut2)!important;line-height:1.5}

/* day strip (mobile) */
#strip{display:none;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:9px}
#strip button{flex:none;padding:7px 12px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);color:var(--navy);background:var(--pearl);white-space:nowrap}
#strip button:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
#strip button.on{background:var(--navy);border-color:rgba(237,244,250,.32);color:var(--on)}
#strip button.istoday{border-color:var(--teal)}
#railtoggle{display:none}

/* responsive */
@media (max-width:900px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;height:auto;min-height:100dvh}
  #rail{border-right:none;border-bottom:1px solid var(--line);overflow:visible;position:static;padding:12px 14px;gap:11px}
  #rail .railhide{display:none!important}
  #rail.open .railhide{display:flex!important}
  #rail .navgrp{flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px}
  #rail .navgrp .navbtn{width:auto;flex:none;padding:8px 12px;white-space:nowrap}
  #rail .railfoot{margin-top:0}
  #railtoggle{display:inline-flex;margin-left:auto;font-size:12px;color:var(--mut);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
  #main{overflow:visible;padding:12px 14px 40px;max-width:100vw}
  #board,#cal,#quickadd,#boardnav,#strip,#tray{max-width:100%}
  #quickadd{gap:7px}
  #qi{flex:1 1 100%;min-width:0;min-height:46px}
  #qd{flex:1;min-width:0;max-width:none}
  #qb{flex:none;padding:11px 22px}
  #boardnav{gap:6px}
  #boardnav .jl{margin-left:0}
  .calgrid,.caldow{gap:4px}
  .cell{min-height:58px;padding:4px 5px}
  #board{overflow-x:visible;flex-direction:column;padding-bottom:0}
  .col{width:100%;max-height:none}
  .colbody{overflow-y:visible;max-height:none}
  #strip{display:flex}
  .duo{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- interaction polish (hover, press, focus) ---------- */
:where(button,input,select,textarea):focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.nbtn,.tbtn,.abtn,.navbtn,.mini,.zadd,.railfoot button,.mtabs button,#strip button,#qb,.fadd button,.mrow button,.box,.sbox,.cell,#qd,.task{
  transition:transform .16s cubic-bezier(.33,1.35,.6,1),box-shadow .22s ease,background-color .18s ease,background-position .5s ease,border-color .18s ease,color .18s ease,opacity .2s ease}
/* press glow */
.nbtn,.tbtn,.abtn,.navbtn,.railfoot button,#strip button,#qb,.fadd button,.mrow button{position:relative;overflow:hidden}
.nbtn::after,.tbtn::after,.abtn::after,.navbtn::after,.railfoot button::after,#strip button::after,#qb::after,.fadd button::after,.mrow button::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:scale(.55);
  background:radial-gradient(closest-side at 50% 50%,rgba(36,58,94,.18),transparent 92%);
  transition:opacity .5s ease,transform .5s ease}
#qb::after,.fadd button::after,.mrow button.pri::after,.nbtn.solid::after,#strip button.on::after{
  background:radial-gradient(closest-side at 50% 50%,rgba(245,244,239,.55),transparent 92%)}
.nbtn:active::after,.tbtn:active::after,.abtn:active::after,.navbtn:active::after,.railfoot button:active::after,#strip button:active::after,#qb:active::after,.fadd button:active::after,.mrow button:active::after{
  opacity:1;transform:scale(1.9);transition:opacity 0s,transform 0s}
/* sheen + gradient drift on primary buttons */
#qb,.fadd button,.mrow button.pri{
  background-image:linear-gradient(180deg,rgba(245,244,239,.25),rgba(245,244,239,0) 55%),var(--grad);
  background-size:100% 100%,170% 170%;background-position:0 0,0% 50%}
.nbtn.solid,#strip button.on{background-image:linear-gradient(180deg,rgba(245,244,239,.18),rgba(245,244,239,0) 60%)}
/* hover: pointer devices only, so phones never get sticky hover states */
@media (hover:hover){
  .nbtn:hover,.tbtn:hover,.railfoot button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(36,58,94,.18)}
  .abtn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(36,58,94,.14)}

  .mini:hover{transform:scale(1.15)}
  .box:hover{transform:scale(1.12)}

  .mtabs button:hover{color:var(--navy)}
  #qb:hover,.fadd button:hover,.mrow button.pri:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(36,58,94,.3);background-position:0 0,100% 50%}
  .nbtn.solid:hover{box-shadow:0 6px 16px rgba(36,58,94,.35)}

  .task:hover{box-shadow:0 4px 12px rgba(36,58,94,.14)}
  #qd:hover,.acts select:hover{border-color:var(--line2)}
}
/* press feedback: every device */
.nbtn:active,.tbtn:active,.railfoot button:active,.mtabs button:active{transform:scale(.95)}
.abtn:active{transform:scale(.93)}
.navbtn:active{transform:scale(.97)}

}

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='agora_dayplanner_v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const t=new Date(d);t.setHours(12,0,0,0);return t.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const plus=(n,from)=>{const d=new Date((from||today())+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZONES=['must','should','extra'];
const ZL={must:'Prio 0',should:'Prio 1',extra:'Extra'};
const ZSHORT={must:'0',should:'1',extra:'E'};
const ZC={must:'var(--must)',should:'var(--should)',extra:'var(--extra)'};
const LOCK=`<svg class="lk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.4" y="7.2" width="9.2" height="6.2" rx="1.5"/><path d="M5.5 7.2V5.4a2.5 2.5 0 0 1 5 0v1.8"/></svg>`;

/* ================= state ================= */
let state=null, ui={sel:null,adding:null,drag:null,cancelEdit:false,renderKey:''};

function fresh(){
  return {
    days:{}, carry:[], focus:[],
    floats:[{id:uid(),name:'Inbox',tasks:[]},{id:uid(),name:'Ideas',tasks:[]}],
    settings:{view:'board',boardOffset:0,floatMode:false,activeFloat:null,
      calSel:null,calOffset:0,mRange:'day',stripDay:null,lastRoll:null,showDone:false}
  };
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){state=fresh();return}
    const p=JSON.parse(raw); const f=fresh();
    state={...f,...p,settings:{...f.settings,...(p.settings||{})}};
    if(!Array.isArray(state.floats)||!state.floats.length) state.floats=f.floats;
    if(!Array.isArray(state.carry)) state.carry=[];
    if(!Array.isArray(state.focus)) state.focus=[];
    if(!state.days||typeof state.days!=='object') state.days={};
    /* migrate an old flat backlog into the first float tab */
    if(Array.isArray(p.backlog)&&p.backlog.length) state.floats[0].tasks.push(...p.backlog);
  }catch(e){ state=fresh() }
  if(!state.settings.activeFloat) state.settings.activeFloat=state.floats[0].id;
}
let saveT=null;
function save(){
  $('#save').textContent='saving…'; $('#save').classList.add('warn');
  clearTimeout(saveT);
  saveT=setTimeout(commit,400);
}
function commit(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
    $('#save').textContent='saved'; $('#save').classList.remove('warn');
  }catch(e){
    $('#save').textContent='not saving'; $('#save').classList.add('warn');
    if(!ui.warned){ ui.warned=true;
      toast('This browser will not store data on a file:// page. Host it (see SETUP) to keep your tasks.') }
  }
  if(!sync.applying) pushSoon();
}
window.addEventListener('beforeunload',()=>{clearTimeout(saveT);commit()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ clearTimeout(saveT); commit(); flushPush() }
  else recheck();
});

/* ================= cloud sync (Supabase REST, no build step, no login) =================
   localStorage stays the source of truth. The cloud is a copy under one private key. */
const SUPABASE_URL='https://yldpazejxahvvhernprq.supabase.co';
const SUPABASE_KEY='sb_publishable_QPCUCWiCX0NmgL-oJYwW_g_9Oa_Y-5Y';
const SYNC_TABLE='planner';
const SKEY_LS='agora_dayplanner_synckey';     /* the key this device uses */
const SSTAMP_LS='agora_dayplanner_syncstamp'; /* updated_at of the copy this device last agreed with */
const SBACK_LS='agora_dayplanner_v1_backup';  /* last local state before a pull replaced it */
/* settings that describe what this screen is looking at. Never taken from another device. */
const VIEWSET=['view','boardOffset','floatMode','activeFloat','calSel','calOffset','mRange','stripDay','showDone'];
const sync={key:'',state:'off',note:'',ready:false,pending:false,applying:false,pushT:null,checked:0};

function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k) }catch(e){} }
const at=v=>{ const n=Date.parse(v); return isFinite(n)?n:0 };
const clock=v=>{ const d=new Date(v);
  return isNaN(d.getTime())?'':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) };

function newSyncKey(){
  let out='';
  try{
    const a=new Uint32Array(14); (window.crypto||window.msCrypto).getRandomValues(a);
    for(let i=0;i<a.length;i++) out+=a[i].toString(36);
  }catch(e){
    for(let i=0;i<12;i++) out+=Math.random().toString(36).slice(2);
  }
  return 'hs-'+out.slice(0,48);
}

/* ---------- status ---------- */
function syncSet(st,note){ sync.state=st; sync.note=note||''; paintSync() }
function syncLabel(){
  switch(sync.state){
    case 'off': return 'Not syncing. This device keeps your tasks locally.';
    case 'busy': return 'Talking to the cloud…';
    case 'synced': return 'Synced'+(sync.note?', '+sync.note:'')+'.';
    case 'offline': return 'Offline. Everything is safe on this device and goes up when you are back.';
    case 'error': return 'Error. '+(sync.note||'The cloud refused that request.');
    case 'conflict': return 'That key already holds a planner and this device has its own. '+
      'Choose Pull to take the cloud copy, or Push to overwrite it. Nothing changes until you pick.';
    default: return 'Connected. Not pushed yet.';
  }
}
function paintSync(){
  const n=$('#syncStatus'); if(!n) return;
  n.className='syncstat '+sync.state;
  n.innerHTML='<i class="sdot"></i><span>'+esc(syncLabel())+'</span>';
}

/* ---------- network ---------- */
function syncHeaders(extra){
  return Object.assign({
    'apikey':SUPABASE_KEY,
    'Authorization':'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json'
  },extra||{});
}
async function cloudGet(k){
  if(typeof fetch!=='function') throw new Error('This browser cannot reach the cloud.');
  const url=SUPABASE_URL+'/rest/v1/'+SYNC_TABLE+'?select=data,updated_at&limit=1&sync_key=eq.'+encodeURIComponent(k);
  const res=await fetch(url,{headers:syncHeaders({'Accept':'application/json'}),cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text().catch(()=>'')).slice(0,120));
  const rows=await res.json();
  return (Array.isArray(rows)&&rows.length)?rows[0]:null;
}
async function cloudPut(k,data,when){
  if(typeof fetch!=='function') throw new Error('This browser cannot reach the cloud.');
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+SYNC_TABLE,{
    method:'POST',
    headers:syncHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{sync_key:k,data:data,updated_at:when}])
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text().catch(()=>'')).slice(0,120));
  return true;
}
function netFail(e,manual){
  const m=String((e&&e.message)||e);
  const off=(navigator&&navigator.onLine===false)||
    /failed to fetch|networkerror|load failed|network request failed|cannot reach/i.test(m);
  syncSet(off?'offline':'error',off?'':m.slice(0,160));
  if(manual) toast(off?'No connection right now. Nothing was lost.':'Cloud said: '+m.slice(0,80));
  return off;
}

/* ---------- push ---------- */
function pushSoon(){
  if(!sync.key) return;
  sync.pending=true;
  clearTimeout(sync.pushT);
  sync.pushT=setTimeout(flushPush,1800);
}
function flushPush(){
  clearTimeout(sync.pushT);
  if(sync.key&&sync.ready&&sync.pending&&sync.state!=='conflict') pushNow(false);
}
async function pushNow(manual){
  if(!sync.key) return manual?(toast('Add a sync key first'),false):false;
  clearTimeout(sync.pushT);
  const when=new Date().toISOString();
  syncSet('busy');
  try{
    await cloudPut(sync.key,state,when);
    sync.pending=false; sync.ready=true;
    lsSet(SSTAMP_LS,when);
    syncSet('synced','sent at '+clock(when));
    if(manual) toast('Pushed to the cloud');
    return true;
  }catch(e){ netFail(e,manual); return false }
}

/* ---------- pull ---------- */
async function pullNow(manual){
  if(!sync.key) return manual?(toast('Add a sync key first'),false):false;
  syncSet('busy');
  let row;
  try{ row=await cloudGet(sync.key) }
  catch(e){ netFail(e,manual); return false }
  if(!row){
    sync.ready=true;
    syncSet('synced','nothing saved under this key yet');
    if(manual) toast('Nothing is saved under that key yet');
    return false;
  }
  return applyCloud(row,manual);
}
function emptyPlanner(s){
  const days=s.days||{};
  const noDays=Object.keys(days).every(d=>ZONES.every(z=>!((days[d]||{})[z]||[]).length));
  return noDays&&!(s.carry||[]).length&&!(s.focus||[]).length&&
    (s.floats||[]).every(f=>!(f.tasks||[]).length);
}
function swapState(next){
  Object.keys(state).forEach(k=>{ delete state[k] });
  Object.assign(state,next);
}
function applyCloud(row,announce){
  const p=row&&row.data;
  if(!p||typeof p!=='object'||(!p.days&&!p.floats)){
    syncSet('error','the copy in the cloud could not be read');
    if(announce) toast('The cloud copy could not be read, so nothing was changed');
    return false;
  }
  const before=JSON.stringify(state);
  lsSet(SBACK_LS,before);
  const f=fresh(), keep=state.settings;
  const next={...f,...p,settings:{...f.settings,...(p.settings||{})}};
  VIEWSET.forEach(k=>{ next.settings[k]=keep[k] });
  if(!Array.isArray(next.floats)||!next.floats.length) next.floats=f.floats;
  if(!Array.isArray(next.carry)) next.carry=[];
  if(!Array.isArray(next.focus)) next.focus=[];
  if(!next.days||typeof next.days!=='object') next.days={};
  if(!next.floats.some(x=>x.id===next.settings.activeFloat)) next.settings.activeFloat=next.floats[0].id;

  swapState(next);
  sync.applying=true; commit(); sync.applying=false;
  sync.pending=false; sync.ready=true;
  lsSet(SSTAMP_LS,row.updated_at);
  syncSet('synced','pulled from '+clock(row.updated_at));
  ui.sel=null; ui.adding=null; ui.renderKey='';
  render();
  if(announce) toast('Pulled from the cloud',()=>{
    try{ swapState(JSON.parse(before)) }catch(e){}
    lsSet(SSTAMP_LS,new Date().toISOString());
  });
  return true;
}

/* ---------- reconcile: newest updated_at wins, and nothing goes silently ---------- */
async function reconcile(manual){
  if(!sync.key) return;
  syncSet('busy');
  let row;
  try{ row=await cloudGet(sync.key) }
  catch(e){ netFail(e,manual); sync.ready=true; if(sync.pending) pushSoon(); return }
  sync.checked=Date.now();
  const mine=lsGet(SSTAMP_LS);
  if(!row){ sync.ready=true; sync.pending=true; await pushNow(false); return }
  if(!mine){
    /* this device has never agreed with the cloud, so do not guess */
    if(emptyPlanner(state)){ applyCloud(row,false); return }
    sync.ready=true; syncSet('conflict');
    const m=$('#syncModal'); if(m) m.innerHTML=syncBody();
    toast('Sync: this device and the cloud both hold a planner. Open Sync to choose.');
    return;
  }
  if(at(row.updated_at)>at(mine)){ applyCloud(row,false); toast('Updated from your other device'); return }
  sync.ready=true;
  if(at(mine)>at(row.updated_at)||sync.pending){ sync.pending=true; await pushNow(false); return }
  syncSet('synced','up to date');
}
function recheck(){
  if(!sync.key||!sync.ready||sync.state==='conflict') return;
  if(Date.now()-sync.checked<20000) return;
  reconcile(false);
}

/* ---------- connect / disconnect ---------- */
async function connectKey(raw){
  const k=String(raw||'').trim();
  if(!k){ toast('Paste a key, or press Generate'); return }
  sync.key=k; lsSet(SKEY_LS,k); lsDel(SSTAMP_LS);
  sync.ready=false; sync.pending=false; sync.checked=0;
  syncSet('busy');
  let row;
  try{ row=await cloudGet(k) }
  catch(e){ sync.ready=true; netFail(e,true); refreshSyncModal(); return }
  if(!row){
    sync.ready=true; sync.pending=true;
    await pushNow(false);
    toast('Key saved. This device is now the cloud copy.');
    refreshSyncModal(); return;
  }
  if(emptyPlanner(state)){ applyCloud(row,false); toast('Key saved. Your planner came down from the cloud.'); refreshSyncModal(); return }
  sync.ready=true; syncSet('conflict');
  toast('That key already holds a planner. Choose Pull or Push.');
  refreshSyncModal();
}
function forgetKey(){
  clearTimeout(sync.pushT);
  sync.key=''; sync.pending=false; sync.ready=true; sync.checked=0;
  lsDel(SKEY_LS); lsDel(SSTAMP_LS);
  syncSet('off');
  toast('Sync turned off here. Your tasks stay on this device.');
  refreshSyncModal();
}

/* ================= data ops ================= */
function day(d){
  if(!state.days[d]) state.days[d]={must:[],should:[],extra:[]};
  ZONES.forEach(z=>{if(!Array.isArray(state.days[d][z])) state.days[d][z]=[]});
  return state.days[d];
}
function mkTask(title){return {id:uid(),title:title.trim(),done:false,subtasks:[]}}
function float(id){return state.floats.find(f=>f.id===id)}
function activeFloat(){return float(state.settings.activeFloat)||state.floats[0]}

function findTask(id){
  for(const d in state.days) for(const z of ZONES){
    const i=state.days[d][z].findIndex(t=>t.id===id);
    if(i>-1) return {task:state.days[d][z][i],from:{kind:'day',date:d,zone:z},index:i};
  }
  for(const f of state.floats){
    const i=f.tasks.findIndex(t=>t.id===id);
    if(i>-1) return {task:f.tasks[i],from:{kind:'float',fid:f.id},index:i};
  }
  const i=state.carry.findIndex(t=>t.id===id);
  if(i>-1) return {task:state.carry[i],from:{kind:'carry'},index:i};
  return null;
}
function pull(id){
  const f=findTask(id); if(!f) return null;
  const {from,index}=f;
  if(from.kind==='day') state.days[from.date][from.zone].splice(index,1);
  else if(from.kind==='float') float(from.fid).tasks.splice(index,1);
  else state.carry.splice(index,1);
  return f.task;
}
function place(task,dest,at){
  if(dest.kind==='day'){
    const arr=day(dest.date)[dest.zone];
    arr.splice(at==null?arr.length:at,0,task);
  }else if(dest.kind==='float'){
    const f=float(dest.fid)||state.floats[0];
    f.tasks.splice(at==null?f.tasks.length:at,0,task);
  }else state.carry.push(task);
}
function move(id,dest,at){
  const t=pull(id); if(!t) return;
  place(t,dest,at); ui.flash=id;
}

/* rollover: unfinished tasks from past days go to the carry tray */
function rollover(){
  const t=today(); let moved=0;
  for(const d of Object.keys(state.days)){
    if(dayDiff(d,t)<=0) continue;
    for(const z of ZONES){
      const keep=[];
      for(const task of state.days[d][z]){
        if(task.done) keep.push(task);
        else{ task.from=ZL[z]+' · '+DOW[new Date(d+'T12:00:00').getDay()]; state.carry.push(task); moved++ }
      }
      state.days[d][z]=keep;
    }
  }
  state.settings.lastRoll=t;
  return moved;
}

/* ================= metrics ================= */
function tasksOn(d){
  const x=state.days[d]; if(!x) return [];
  return ZONES.flatMap(z=>(x[z]||[]));
}
function rangeDates(r){
  const n=r==='day'?1:r==='week'?7:30, out=[];
  for(let i=n-1;i>=0;i--) out.push(plus(-i));
  return out;
}
function tally(dates){
  let done=0,open=0;
  dates.forEach(d=>tasksOn(d).forEach(t=>t.done?done++:open++));
  return {done,open,total:done+open,pct:(done+open)?Math.round(done/(done+open)*100):0};
}
function streak(){
  let n=0;
  for(let i=0;i<400;i++){
    const d=plus(-i), list=tasksOn(d);
    if(i===0&&!list.length) continue;
    if(!list.length) break;
    if(list.every(t=>t.done)) n++; else break;
  }
  return n;
}
function monthTally(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), out=[];
  for(const d in state.days){
    const dt=new Date(d+'T12:00:00');
    if(dt.getFullYear()===y&&dt.getMonth()===m) out.push(d);
  }
  return tally(out);
}

      'stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
      '<div class="rlab"><div><b>'+t.pct+'%</b><i>done</i></div></div></div>'+

  '<div class="duo">'+

function floatCol(f,i){

    '</div>'+addRow({kind:'float',fid:f.id})+'</div></div>';

function dayCol(d,i){
  const x=day(d), dd=dayDiff(today(),d);
  const dt=new Date(d+'T12:00:00');
  const openMust=x.must.filter(t=>!t.done).length;
  const allMustDone=x.must.length>0&&openMust===0;
  const total=ZONES.reduce((a,z)=>a+x[z].length,0);
  const done=ZONES.reduce((a,z)=>a+x[z].filter(t=>t.done).length,0);

  let h='<div class="col'+(dd===0?' today':'')+(dd<0?' past':'')+'" data-day="'+d+'" style="animation-delay:'+(i*35)+'ms">'+
    '<div class="colhead"><div class="d1"><span class="dow">'+DOW[dt.getDay()]+'</span>'+
    '<span class="dnum">'+MON[dt.getMonth()].slice(0,3)+' '+dt.getDate()+'</span>'+
    (dd===0?'<span class="badge">TODAY</span>':'')+'</div>'+
    '<div class="meta">'+(total?done+' of '+total+' done':'nothing planned')+'</div>'+
    (openMust>5?'<div class="heavy">'+openMust+' Prio 0 tasks. Heavier than a day can hold, so demote or move some.</div>':'')+
    '</div><div class="colbody">';

  ZONES.forEach(z=>{
    const locked=z==='extra'&&!allMustDone;
    h+='<div class="zone'+(locked?' locked':'')+'" data-drop="day" data-day="'+d+'" data-zone="'+z+'">'+
      '<div class="zh"><i class="pip" style="background:'+ZC[z]+'"></i>'+ZL[z]+
      (z==='extra'?(locked?' '+LOCK:''):'')+'<span class="n">'+x[z].length+'</span></div>';
    if(z==='extra'){
      h+= locked
        ? '<div class="lockmsg">'+(x.must.length?'Opens when every Prio 0 is ticked.':'Add a Prio 0 first. Free time is earned.')+'</div>'
        : '<div class="freego">free time, go</div>';
    }
    h+=x[z].map(t=>card(t,{kind:'day',date:d,zone:z})).join('');
    h+=addRow({kind:'day',date:d,zone:z})+'</div>';
  });
  return h+'</div></div>';
}
function addRow(dest){
  const k=dest.kind==='day'?('day:'+dest.date+':'+dest.zone):('float:'+dest.fid);
  if(ui.adding===k){
    return '<div class="saddrow"><input class="addin" data-enter="add" data-k="'+k+'" '+
      'placeholder="What is it?" autocomplete="off"><button class="abtn" data-action="add-commit" data-k="'+k+'">Add</button></div>';

function card(t,loc){
  const sel=ui.sel===t.id;
  const sdone=t.subtasks.filter(s=>s.done).length;
  let h='<div class="task'+(t.done?' done':'')+(sel?' sel':'')+(ui.flash===t.id?' flash':'')+
    '" draggable="true" data-id="'+t.id+'">'+
    '<div class="trow"><button class="box'+(t.done?' on':'')+'" data-action="tick" data-id="'+t.id+'">✓</button>'+
    '<div class="ttl" data-action="sel" data-id="'+t.id+'">'+esc(t.title)+'</div>'+
    (t.subtasks.length?'<span class="subn">'+sdone+'/'+t.subtasks.length+'</span>':'')+'</div>';

  if(sel){
    h+='<div class="acts">';
    if(loc.kind==='day'){
      ZONES.forEach(z=>{ if(z!==loc.zone)
        h+='<button class="abtn '+z[0]+'" data-action="zone" data-id="'+t.id+'" data-day="'+loc.date+'" data-zone="'+z+'">'+ZSHORT[z]+'</button>' });
      h+='<button class="abtn" data-action="bump" data-id="'+t.id+'">→ Tmrw</button>';
    }else{
      ZONES.forEach(z=>h+='<button class="abtn '+z[0]+'" data-action="zone" data-id="'+t.id+'" data-day="'+today()+'" data-zone="'+z+'">'+ZSHORT[z]+'</button>');
    }
    h+='<input type="date" class="abtn" data-action="pickdate" data-id="'+t.id+'" style="padding:3px 6px;font-size:11px;color-scheme:dark">';
    h+='<select data-action="tofloat" data-id="'+t.id+'"><option value="">file to…</option>'+
       state.floats.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')+'</select>';
    h+='<button class="abtn" data-action="reorder" data-id="'+t.id+'" data-d="-1">↑</button>'+
       '<button class="abtn" data-action="reorder" data-id="'+t.id+'" data-d="1">↓</button>'+
       '<button class="abtn" data-action="rename" data-id="'+t.id+'">✎</button>'+
       '<button class="abtn del" data-action="del" data-id="'+t.id+'">✕</button></div>';

    h+='<div class="sbody">'+
      t.subtasks.map(s=>'<div class="sub'+(s.done?' done':'')+'" draggable="true" data-sub="'+s.id+'" data-parent="'+t.id+'">'+
        '<button class="sbox'+(s.done?' on':'')+'" data-action="stick" data-id="'+t.id+'" data-sid="'+s.id+'">✓</button>'+
        '<div class="st" data-action="srename" data-id="'+t.id+'" data-sid="'+s.id+'">'+esc(s.title)+'</div>'+
        '<button class="mini" data-action="spop" data-id="'+t.id+'" data-sid="'+s.id+'" title="Make its own task">⤴</button>'+
        '<button class="mini" data-action="sdel" data-id="'+t.id+'" data-sid="'+s.id+'">✕</button></div>').join('')+
      '<div class="saddrow"><input id="sadd-'+t.id+'" data-enter="sub" data-tid="'+t.id+'" placeholder="add a step…" autocomplete="off">'+
      '<button class="abtn" data-action="sadd" data-id="'+t.id+'">+</button></div></div>';
  }
  return h+'</div>';
}

/* ================= render: calendar ================= */
function renderCal(){
  const base=new Date(); base.setDate(1);
  base.setMonth(base.getMonth()+state.settings.calOffset);
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1).getDay(), len=new Date(y,m+1,0).getDate();
  let h='<div class="calbar"><button class="nbtn" data-action="cal-nav" data-d="-1">‹</button>'+
    '<h2>'+MON[m]+' '+y+'</h2>'+
    '<button class="nbtn" data-action="cal-nav" data-d="1">›</button>'+
    '<button class="nbtn" data-action="cal-nav" data-d="0">This month</button>'+
    (state.settings.calSel?'<span class="chip">Showing '+state.settings.calSel+
      '<button class="mini" data-action="cal-clear">✕</button></span>':'')+'</div>'+
    '<div class="caldow">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div><div class="calgrid">';
  for(let i=0;i<first;i++) h+='<div class="cell blank"></div>';
  for(let n=1;n<=len;n++){
    const d=iso(new Date(y,m,n)), list=tasksOn(d), open=list.filter(t=>!t.done);
    const x=state.days[d];
    let dots='';
    if(list.length&&!open.length) dots='<span class="allok">✓ done</span>';
    else if(open.length){
      let shown=0, bits='';
      ZONES.forEach(z=>{ (x?x[z]:[]).filter(t=>!t.done).forEach(()=>{
        if(shown<4){bits+='<i style="background:'+ZC[z]+'"></i>';shown++}
      })});
      if(open.length>4) bits+='<span class="more">+'+(open.length-4)+'</span>';
      dots='<div class="dots">'+bits+'</div>';
    }
    h+='<div class="cell'+(d===today()?' today':'')+(d===state.settings.calSel?' sel':'')+
      '" data-action="cal-day" data-day="'+d+'"><span class="n">'+n+'</span>'+dots+'</div>';
  }
  h+='</div>';

  if(state.settings.calSel){
    const d=state.settings.calSel, x=day(d);
    h+='<div class="dpanel"><div class="dphead"><b>Tasks on '+
      DOW[new Date(d+'T12:00:00').getDay()]+', '+d+'</b>'+
      '<button class="nbtn" data-action="goto-day" data-day="'+d+'">Open on board →</button></div>'+
      '<div class="dpadd"><input id="calAdd" data-enter="caladd" data-day="'+d+'" placeholder="Add to this day…" autocomplete="off">'+
      '<select id="calZone">'+ZONES.map(z=>'<option value="'+z+'">'+ZL[z]+'</option>').join('')+'</select>'+
      '<button class="nbtn solid" data-action="cal-add" data-day="'+d+'">Add</button></div><div class="dplist">';
    let any=false;
    ZONES.forEach(z=>{
      if(!x[z].length) return; any=true;
      h+='<div class="zh" style="padding-top:8px"><i class="pip" style="background:'+ZC[z]+'"></i>'+ZL[z]+'</div>'+
        x[z].map(t=>card(t,{kind:'day',date:d,zone:z})).join('');
    });
    if(!any) h+='<div class="empty">Nothing on this day yet.</div>';
    h+='</div></div>';
  }
  $('#cal').innerHTML=h;
}

/* ================= master render ================= */
function render(){
  const v=state.settings.view;
  $$('#rail .navbtn[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#rail .navbtn[data-action="floattoggle"]').classList.toggle('on',state.settings.floatMode&&v==='board');
  $('#ftlabel').textContent=state.settings.floatMode?'Back to dates':'Free Floating';
  $('#board').style.display=v==='board'?'flex':'none';
  $('#cal').style.display=v==='calendar'?'block':'none';
  $('#quickadd').style.display=v==='board'?'flex':'none';

  renderQuick(); renderTray(); renderNav(); renderFocus(); renderMetrics(); grow();
  if(v==='board') renderBoard(); else renderCal();

  if(ui.adding){ const el=$('.addin[data-k="'+ui.adding+'"]'); if(el) el.focus() }
  if(ui.flash) setTimeout(()=>{ui.flash=null},700);
}

/* ================= actions ================= */
function addFromText(text,destStr){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return 0;
  const p=destStr.split(':');
  const dest=p[0]==='float'?{kind:'float',fid:p[1]}:{kind:'day',date:p[1],zone:p[2]};
  lines.forEach(l=>place(mkTask(l),dest));
  return lines.length;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id, s=state.settings;

  switch(a){
    case 'railtoggle': $('#rail').classList.toggle('open'); return;
    case 'undo': doUndo(); return;
    case 'view': s.view=el.dataset.v; if(s.view==='calendar') s.floatMode=false; break;
    case 'floattoggle': s.floatMode=!s.floatMode; s.view='board'; break;
    case 'mrange': s.mRange=el.dataset.r; save(); renderMetrics(); return;

    case 'quickadd':{
      const i=$('#qi'), n=addFromText(i.value,$('#qd').value);
      if(!n) return; i.value=''; i.style.height='auto';
      toast(n===1?'Added':'Added '+n+' tasks'); break;
    }
    case 'add-open': ui.adding=el.dataset.k; break;
    case 'add-commit':{
      const inp=$('.addin[data-k="'+el.dataset.k+'"]');
      if(inp&&inp.value.trim()) addFromText(inp.value,el.dataset.k);
      ui.adding=null; break;
    }

    case 'tick':{
      const f=findTask(id); if(!f) return;
      f.task.done=!f.task.done;
      el.classList.add('pop');
      break;
    }
    case 'sel': ui.sel=ui.sel===id?null:id; break;
    case 'zone': move(id,{kind:'day',date:el.dataset.day,zone:el.dataset.zone}); break;
    case 'bump':{
      const f=findTask(id); if(!f||f.from.kind!=='day') return;
      move(id,{kind:'day',date:plus(1,f.from.date),zone:f.from.zone}); break;
    }
    case 'reorder':{
      const f=findTask(id); if(!f) return;
      const d=+el.dataset.d;
      let arr = f.from.kind==='day'?state.days[f.from.date][f.from.zone]:float(f.from.fid).tasks;
      const i=f.index, j=i+d;
      if(j<0||j>=arr.length) return;
      arr.splice(j,0,arr.splice(i,1)[0]); break;
    }
    case 'del':{
      const f=findTask(id); if(!f) return;
      const {from,index,task}=f; pull(id);
      toast('Deleted "'+task.title.slice(0,28)+'"',()=>place(task,
        from.kind==='day'?{kind:'day',date:from.date,zone:from.zone}:
        from.kind==='float'?{kind:'float',fid:from.fid}:{kind:'carry'},index));
      ui.sel=null; break;
    }
    case 'rename':{
      const node=el.closest('.task').querySelector('.ttl');
      node.contentEditable=true; node.dataset.kind='rename'; node.dataset.id=id;
      node.focus(); document.execCommand&&document.execCommand('selectAll',false,null); return;
    }

    case 'sadd':{
      const inp=$('#sadd-'+id); if(!inp||!inp.value.trim()) return;
      findTask(id).task.subtasks.push({id:uid(),title:inp.value.trim(),done:false}); break;
    }
    case 'stick':{
      const t=findTask(id).task, sub=t.subtasks.find(x=>x.id===el.dataset.sid);
      sub.done=!sub.done; break;
    }
    case 'sdel':{
      const t=findTask(id).task, i=t.subtasks.findIndex(x=>x.id===el.dataset.sid);
      const sub=t.subtasks.splice(i,1)[0];
      toast('Step removed',()=>t.subtasks.splice(i,0,sub)); break;
    }
    case 'spop':{
      const f=findTask(id), t=f.task, i=t.subtasks.findIndex(x=>x.id===el.dataset.sid);
      const sub=t.subtasks.splice(i,1)[0];
      const nt=mkTask(sub.title); nt.done=sub.done;
      place(nt, f.from.kind==='day'?{kind:'day',date:f.from.date,zone:f.from.zone}:{kind:'float',fid:f.from.fid});
      ui.flash=nt.id; toast('Popped out as its own task'); break;
    }
    case 'srename':{
      el.contentEditable=true; el.dataset.kind='subrename'; el.focus(); return;
    }

    case 'tofloat': return;
    case 'goto-day':{
      s.view='board'; s.floatMode=false;
      if(window.innerWidth<900) s.stripDay=el.dataset.day;
      else s.boardOffset=dayDiff(today(),el.dataset.day);
      break;
    }
    case 'nav': s.boardOffset+=(+el.dataset.d); break;
    case 'nav-today': s.boardOffset=0; s.stripDay=today(); break;
    case 'strip': s.stripDay=el.dataset.day; break;

    case 'carry-all':{
      const snap=state.carry.slice();
      const to=el.dataset.to;
      snap.forEach(t=>{delete t.from; place(t, to==='today'?{kind:'day',date:today(),zone:'must'}:{kind:'float',fid:activeFloat().id})});
      state.carry=[];
      toast('Moved '+snap.length+' to '+(to==='today'?'Today · Prio 0':'Free Floating'),()=>{
        snap.forEach(t=>pull(t.id)); state.carry=snap;
      }); break;
    }
    case 'carry-one':{
      const t=pull(id); if(!t) return; delete t.from;
      place(t, el.dataset.to==='today'?{kind:'day',date:today(),zone:'must'}:{kind:'float',fid:activeFloat().id});
      ui.flash=t.id; break;
    }
    case 'carry-drop':{
      const i=state.carry.findIndex(t=>t.id===id), t=state.carry.splice(i,1)[0];
      toast('Dropped "'+t.title.slice(0,24)+'"',()=>state.carry.splice(i,0,t)); break;
    }

    case 'float-new':{
      const f={id:uid(),name:'New tab',tasks:[]}; state.floats.push(f);
      s.activeFloat=f.id; save(); render();
      const node=[...document.querySelectorAll('[data-action="float-rename"]')].pop();
      if(node) node.click();
      return;
    }
    case 'float-rename':{
      const head=el.closest('.colhead').querySelector('.dow');
      head.contentEditable=true; head.dataset.kind='floatrename'; head.dataset.fid=el.dataset.fid;
      head.focus(); return;
    }
    case 'float-del':{
      const f=float(el.dataset.fid);
      if(f.tasks.length) return confirmTabDelete(f);
      const i=state.floats.indexOf(f); state.floats.splice(i,1);
      if(s.activeFloat===f.id) s.activeFloat=state.floats[0].id;
      toast('Tab deleted',()=>state.floats.splice(i,0,f)); break;
    }
    case 'float-del-move':{
      const f=float(el.dataset.fid), i=state.floats.indexOf(f);
      const other=state.floats.find(x=>x.id!==f.id);
      const moved=f.tasks.slice(); other.tasks.push(...moved);
      state.floats.splice(i,1);
      if(s.activeFloat===f.id) s.activeFloat=state.floats[0].id;
      $('#modalRoot').innerHTML='';
      toast('Tab deleted, '+moved.length+' moved to '+other.name,()=>{
        other.tasks.splice(other.tasks.length-moved.length,moved.length);
        state.floats.splice(i,0,f);
      }); break;
    }

    case 'focus-add':{
      const i=$('#fi'); if(!i.value.trim()) return;
      state.focus.push({id:uid(),title:i.value.trim(),done:false}); i.value=''; break;
    }
    case 'focus-tick':{
      const f=state.focus.find(x=>x.id===id);
      f.done=!f.done; f.doneAt=f.done?today():null; break;
    }
    case 'focus-del':{
      const i=state.focus.findIndex(x=>x.id===id), f=state.focus.splice(i,1)[0];
      toast('Focus removed',()=>state.focus.splice(i,0,f)); break;
    }
    case 'focus-rename':{
      el.contentEditable=true; el.dataset.kind='focusrename'; el.dataset.id=id; el.focus(); return;
    }
    case 'focus-toggle-done': s.showDone=!s.showDone; save(); renderFocus(); return;

    case 'cal-nav': s.calOffset=(+el.dataset.d===0)?0:s.calOffset+(+el.dataset.d); break;
    case 'cal-day': s.calSel=s.calSel===el.dataset.day?null:el.dataset.day; break;
    case 'cal-clear': s.calSel=null; break;
    case 'cal-add':{
      const i=$('#calAdd'); if(!i.value.trim()) return;
      addFromText(i.value,'day:'+el.dataset.day+':'+$('#calZone').value); i.value=''; break;
    }

    case 'help': helpModal(); return;
    case 'mclose': if(e.target.classList.contains('mback')||el.dataset.close) $('#modalRoot').innerHTML=''; return;
    case 'export':{
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='headspace-'+today()+'.json'; a.click();
      URL.revokeObjectURL(a.href); toast('Exported'); return;
    }
    case 'import': $('#fileIn').click(); return;

    case 'sync': syncModal(); return;
    case 'sync-gen':{
      const i=$('#syncKeyIn'); if(!i) return;
      i.value=newSyncKey(); i.focus(); if(i.select) i.select();
      toast('New key made. Press "Use this key", then copy it to your other device.'); return;
    }
    case 'sync-connect':{ const i=$('#syncKeyIn'); connectKey(i?i.value:''); return }
    case 'sync-copy':{
      const i=$('#syncKeyIn'); if(!i||!i.value.trim()) return toast('There is no key to copy yet');
      i.focus(); if(i.select) i.select();
      const done=()=>toast('Key copied');
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(i.value.trim()).then(done,()=>toast('Select the key and copy it by hand'));
        else if(document.execCommand&&document.execCommand('copy')) done();
        else toast('Select the key and copy it by hand');
      }catch(err){ toast('Select the key and copy it by hand') }
      return;
    }
    case 'sync-push': pushNow(true); return;
    case 'sync-pull': pullNow(true); return;
    case 'sync-forget': forgetKey(); return;
  }
  save(); render();
});

/* select dropdown: file to a float tab */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.action==='tofloat'&&el.value){
    move(el.dataset.id,{kind:'float',fid:el.value}); ui.sel=null; save(); render();
  }
  if(el.dataset.action==='pickdate'&&el.value){
    const f=findTask(el.dataset.id);
    const z=f&&f.from.kind==='day'?f.from.zone:'must';
    move(el.dataset.id,{kind:'day',date:el.value,zone:z}); save(); render();
  }
  if(el.id==='jumpDate'&&el.value){
    if(window.innerWidth<900) state.settings.stripDay=el.value;
    else state.settings.boardOffset=dayDiff(today(),el.value);
    save(); render();
  }
  if(el.id==='fileIn'&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        if(!p.days&&!p.floats) throw 0;
        state={...fresh(),...p,settings:{...fresh().settings,...(p.settings||{})}};
        commit(); render(); toast('Imported');
      }catch(err){ toast('That file could not be read as a Headspace export') }
    };
    r.readAsText(el.files[0]); el.value='';
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  const el=e.target, d=el.dataset||{};
  if(e.key==='Enter'&&!e.shiftKey){
    if(el.id==='qi'&&el.value.trim()){ e.preventDefault(); $('#qb').click(); return }
    if(d.enter==='add'){ e.preventDefault();
      const b=document.querySelector('[data-action="add-commit"][data-k="'+d.k+'"]'); if(b)b.click(); return }
    if(d.enter==='sub'){ e.preventDefault();
      const b=document.querySelector('[data-action="sadd"][data-id="'+d.tid+'"]'); if(b)b.click(); return }
    if(d.enter==='caladd'){ e.preventDefault();
      const b=document.querySelector('[data-action="cal-add"][data-day="'+d.day+'"]'); if(b)b.click(); return }
    if(d.enter==='focus'){ e.preventDefault();
      const b=document.querySelector('[data-action="focus-add"]'); if(b)b.click(); return }
    if(d.enter==='synckey'){ e.preventDefault(); connectKey(el.value); return }
    if(['rename','subrename','floatrename','focusrename'].includes(d.kind)){ e.preventDefault(); el.blur(); return }
  }
  if(e.key==='Escape'){
    if(['rename','subrename','floatrename','focusrename'].includes(d.kind)){ ui.cancelEdit=true; el.blur(); return }
    if($('#modalRoot').innerHTML){ $('#modalRoot').innerHTML=''; return }
    if(ui.adding){ ui.adding=null; render(); return }
    if(ui.sel){ ui.sel=null; render(); return }
  }
});
document.addEventListener('blur',e=>{
  const el=e.target, d=el.dataset||{};
  if(!['rename','subrename','floatrename','focusrename'].includes(d.kind)) return;
  el.contentEditable=false;
  const txt=el.textContent.trim();
  if(ui.cancelEdit||!txt){ ui.cancelEdit=false; render(); return }
  if(d.kind==='rename') findTask(d.id).task.title=txt;
  if(d.kind==='subrename'){
    const t=findTask(d.id).task, s=t.subtasks.find(x=>x.id===d.sid); if(s) s.title=txt;
  }
  if(d.kind==='floatrename'){ const f=float(d.fid); if(f) f.name=txt.replace(/^\s*/,'') }
  if(d.kind==='focusrename'){ const f=state.focus.find(x=>x.id===d.id); if(f) f.title=txt }
  delete el.dataset.kind;
  save(); render();
},true);

/* ---------- drag and drop ---------- */
document.addEventListener('dragstart',e=>{
  const sub=e.target.closest('.sub');
  if(sub){ ui.drag={type:'sub',sid:sub.dataset.sub,pid:sub.dataset.parent}; sub.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',sub.dataset.sub); return }
  const t=e.target.closest('.task');
  if(t){ ui.drag={type:'task',id:t.dataset.id}; t.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',t.dataset.id) }
});
document.addEventListener('dragend',()=>{
  $$('.dragging').forEach(n=>n.classList.remove('dragging'));
  $$('.drop').forEach(n=>n.classList.remove('drop'));
  ui.drag=null;
});
document.addEventListener('dragover',e=>{
  const z=e.target.closest('[data-drop]'); if(!z||!ui.drag) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  $$('.drop').forEach(n=>n!==z&&n.classList.remove('drop'));
  z.classList.add('drop');
});
document.addEventListener('drop',e=>{
  const z=e.target.closest('[data-drop]'); if(!z||!ui.drag) return;
  e.preventDefault(); z.classList.remove('drop');
  const dest=z.dataset.drop==='day'
    ? {kind:'day',date:z.dataset.day,zone:z.dataset.zone}
    : {kind:'float',fid:z.dataset.fid};
  if(ui.drag.type==='task'){ move(ui.drag.id,dest) }
  else{
    const parent=findTask(ui.drag.pid);
    if(parent){
      const i=parent.task.subtasks.findIndex(s=>s.id===ui.drag.sid);
      const sub=parent.task.subtasks.splice(i,1)[0];
      const card=e.target.closest('.task');
      if(card&&card.dataset.id!==ui.drag.pid){
        const other=findTask(card.dataset.id);
        if(other) other.task.subtasks.push(sub);
        else{ const nt=mkTask(sub.title); nt.done=sub.done; place(nt,dest) }
      }else{ const nt=mkTask(sub.title); nt.done=sub.done; place(nt,dest); ui.flash=nt.id }
    }
  }
  ui.drag=null; save(); render();
});

/* ---------- modals ---------- */
function confirmTabDelete(f){
  $('#modalRoot').innerHTML='<div class="mback" data-action="mclose"><div class="modal">'+
    '<h3>Delete "'+esc(f.name)+'"?</h3>'+
    '<p>It still holds <b>'+f.tasks.length+'</b> '+(f.tasks.length===1?'task':'tasks')+
    '. Deleting the tab should not delete them.</p>'+
    '<div class="mrow"><button data-action="mclose" data-close="1">Keep the tab</button>'+
    '<button class="pri" data-action="float-del-move" data-fid="'+f.id+'">Move tasks out, then delete</button></div>'+
    '</div></div>';
}
function helpModal(){
  $('#modalRoot').innerHTML='<div class="mback" data-action="mclose"><div class="modal">'+
    '<h3>How this space works</h3>'+
    '<p><b>Days, not hours.</b> Each day has three zones: <b style="color:var(--must)">Prio 0</b>, '+

    'locked until every Prio 0 is ticked.</p>'+
    '<p><b> Free Floating</b> holds everything with no date yet. Add tabs to categorise it (Ideas, Errands, Someday). '+
    'Rename or delete a tab any time, and drag a card onto a day to schedule it.</p>'+
    '<p><b>Reaching a future date.</b> Use <b>‹ Prev / Next ›</b> to shift the board a week, <b>Jump to</b> for any date, '+
    'or open <b>Calendar</b> and tap the day. Anything dated outside the window shows in <b>Off-board</b> so nothing hides.</p>'+
    '<p><b>Calendar view.</b> Coloured dots show open tasks per day (purple Must, blue Should, green Extra). '+
    'Tap a date to see its list and add straight into it.</p>'+
    '<p><b>Focus</b> holds the mindset you set for the week. Tick one and it drops into <b>Completed</b>, '+

/* ---------- quick-add autogrow ---------- */
function grow(){ const t=$('#qi'); if(!t) return; t.style.height='auto';
  t.style.height=Math.min(170,Math.max(44,t.scrollHeight))+'px' }
document.addEventListener('input',e=>{ if(e.target.id==='qi') grow() });

/* ---------- resize ---------- */
let rz=null;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{ui.renderKey='';render()},150)});

/* ---------- offline support ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

/* ---------- boot ---------- */
load();
if(state.settings.lastRoll!==today()){ const n=rollover(); if(n) setTimeout(()=>toast(n+' carried over from before'),400); commit() }
if(!state.settings.stripDay) state.settings.stripDay=today();
render();
syncBoot();
window.A={state,render,rollover,findTask,move,tally,streak,save:commit,
  sync,syncPush:()=>pushNow(true),syncPull:()=>pullNow(true),newSyncKey};
</script>
