<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Headspace — Day Planner</title>
<meta name="description" content="A calm daily planner: musts, shoulds and free time.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#CFE3F1">
<script>
/* Theme boot: the stored choice must be on <html> before the stylesheet paints,
   or one frame of the other theme flashes. Device preference only, read from its
   own localStorage key; the planner state never carries it and sync never sees it. */
try{
  if(localStorage.getItem('agora_dayplanner_theme')==='mono'){
    document.documentElement.setAttribute('data-theme','mono');
    var __tm=document.querySelector('meta[name="theme-color"]');
    if(__tm) __tm.setAttribute('content','#070708');
  }
  /* The rail's collapsed state rides the same contract as the theme: device chrome,
     its own key, never in `state`, never synced. Applied here for the same reason
     too, so the board does not visibly jump from 308px to full width on every load. */
  if(localStorage.getItem('agora_dayplanner_rail')==='off')
    document.documentElement.setAttribute('data-rail','off');
}catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Headspace">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* light blue palette adapted from the three references.
     A THEME IS THIS SET OF VALUES and nothing else: every colour, tint, gradient,
     shadow and label face the stylesheet uses reads a variable declared here, and
     [data-theme="mono"] below re-declares the same set. No rule may hardcode a
     colour, or the other theme silently keeps the wrong one. */
  --bg:#EDF4FA;          /* Cloud Blue: the highlighted light background */
  --canvas:#5F86A6;      /* the board's dusty-denim ground behind the columns */
  --panel:#CFE3F1;       /* Powder Sky: rails, columns, framed surfaces */
  --panel2:#C4DBEC;      /* a touch deeper for headers / active tabs */
  --card:#EDF4FA;        /* Cloud Blue again: cards that sit inside panels */
  --line:#B7D0E1; --line2:#9BBBD4;
  --txt:#14293F;         /* deep navy ink */
  --mut:#41627F; --mut2:#6A88A3;
  --navy:#243A5E; --denim:#5F86A6; --ocean:#8FB6D8; --teal:#567C8D;
  --sky:#CFE3F1; --cloud:#EDF4FA; --night:#243A5E; --pearl:#F5F4EF; --tasktile:#E3EEF7;
  --must:#2F4156; --should:#5F86A6; --extra:#7FA7CC;
  --must-t:#2F4156; --should-t:#3F6488; --extra-t:#3C6A8E; /* text-safe zone inks on buttons */
  --done:#46728B;        /* completion: the tick fill, the ring, the "done" marks */
  --today:#567C8D;       /* today's marker: column ring, badge, calendar cell, strip */
  --okdot:#46728B;       /* the sync panel's all-well dot; status, not completion */
  --on:#EDF4FA;          /* light ink used on dark accents (cloud blue, never white) */
  --onpri:#EDF4FA;       /* ink on the primary action and the completion fill */
  --oncanvas:#A9C4DB;    /* hint text sitting directly on the canvas */
  --toastact:#8FB6D8; --toastact-rgb:143,182,216; /* the Undo button inside a toast */
  /* True north: the statement ink, the panel backdrop, and the panel's OWN ink set.
     The ink here is the deep text-safe denim the zone buttons already use
     (--should-t), never an imported red. The backdrop is #F6F6F7 in BOTH themes:
     the app's stand-in for white, mono's brightest existing value, deliberately
     short of #ffffff so the no-white rule needs no exception. A backdrop that is
     near-white in both themes makes the panel a light island, and an island needs
     its own inks, because a dark theme cannot lend a light panel its near-white
     ones. In this theme they are the values the panel already used: nothing but
     the backdrop moves, and the blue panel is unchanged to the pixel. */
  --north:#3F6488; --northbg:#F6F6F7;
  --northtxt:#243A5E; --northmut:#41627F; --northmut2:#6A88A3;
  --northline:#9BBBD4; --northfield:#EDF4FA; --northink-rgb:36,58,94;
  --northfocus:#5F86A6; --northfocus-rgb:95,134,166;
  --grad:linear-gradient(135deg,#2F4156,#5F86A6);          /* text-safe */
  --gradf:linear-gradient(135deg,#2F4156,#5F86A6 55%,#8FB6D8); /* decorative */
  --ring1:#2F4156; --ring2:#5F86A6; --ring3:#8FB6D8;       /* the progress ring's stops */
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(36,58,94,.09),0 8px 22px rgba(36,58,94,.08);
  /* tint anchors: every rgba() in the sheet reads one of these channel triplets,
     so the other theme retints every wash, cue and shadow by changing five lines.
     ink = fills, borders and hover washes; shd = box-shadows and depth only. */
  --ink-rgb:36,58,94; --shd-rgb:36,58,94;
  --denim-rgb:95,134,166; --teal-rgb:86,124,141; --today-rgb:86,124,141;
  --pearl-rgb:245,244,239; --cloud-rgb:237,244,250;
  --must-rgb:47,65,86; --should-rgb:95,134,166; --extra-rgb:127,167,204;
  --scrim:rgba(33,64,95,.4);
  /* decorated surfaces, held whole so a theme can flatten them */
  --bgfx:radial-gradient(760px 480px at 12% -6%, rgba(95,134,166,.20), transparent 62%),
    radial-gradient(680px 520px at 92% 4%, rgba(143,182,216,.24), transparent 60%),
    radial-gradient(720px 560px at 60% 108%, rgba(36,58,94,.08), transparent 62%);
  --railbg:linear-gradient(180deg,rgba(207,227,241,.9),rgba(196,219,236,.75));
  --traybg:linear-gradient(168deg,rgba(245,244,239,.92),rgba(245,244,239,.24) 62%),var(--cloud);
  --trayrim:rgba(245,244,239,.8);
  --trayshadow:inset 0 1px 0 rgba(245,244,239,.95),
    0 0 0 1px rgba(86,124,141,.30),
    0 0 18px rgba(143,182,216,.55),
    0 3px 8px rgba(36,58,94,.14),
    0 14px 34px rgba(36,58,94,.22);
  --sheen:linear-gradient(180deg,rgba(245,244,239,.25),rgba(245,244,239,0) 55%);
  --sheen2:linear-gradient(180deg,rgba(245,244,239,.18),rgba(245,244,239,0) 60%);
  --oscheme:light;       /* native date-control rendering follows the theme */
  --fd:'Space Grotesk','Inter',system-ui,sans-serif;
  --fb:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* label faces: fdx where a display-face numeral or short uppercase label sits,
     fbx where a body-face one does. In this theme they ARE the base faces; the
     mono theme leads both with its dot-matrix face, body text untouched. */
  --fdx:'Space Grotesk','Inter',system-ui,sans-serif;
  --fbx:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --rail:308px;
}
/* Monochrome: near-black to near-light-grey, one red, dot-matrix numerals, flat.
   Same variable set as :root, different values, nothing else. Surfaces climb the
   grey ramp exactly as the blue theme climbs its own: canvas darkest, then rail,
   column, task tile, pearl brightest. Ink is near-white grey, NEVER #ffffff (the
   brightest value in the theme is #F6F6F7). Red appears only where something must
   stand out: today's marker (--today), completion (--done, the ring stops) and
   the primary action (--grad), and the True north statements (--north, on the
   panel's own --northbg backdrop). Everything decorative flattens: no background
   washes, no sheens, no gradients (flat two-stop stand-ins), no shadow depth. */
:root[data-theme="mono"]{
  --bg:#070708;
  --canvas:#070708;
  --panel:#161619;
  --panel2:#1C1C20;
  --card:#212126;
  --line:#2E2E34; --line2:#40404A;
  --txt:#E9E9EC;
  --mut:#ABABB3; --mut2:#85858D;
  --navy:#ECECEF; --denim:#A9A9B3; --ocean:#616169; --teal:#8E8E99;
  --sky:#161619; --cloud:#212126; --night:#ECECEF; --pearl:#313138; --tasktile:#28282D;
  --must:#E4E4E8; --should:#A5A5AE; --extra:#6F6F79;
  --must-t:#E4E4E8; --should-t:#C0C0C8; --extra-t:#9E9EA8;
  --done:#E8443C;
  --today:#E8443C;
  --okdot:#8E8E99;
  --on:#151518;
  --onpri:#F6F6F7;
  --oncanvas:#9B9BA5;
  --toastact:#151518; --toastact-rgb:21,21,24;
  /* the statements are the red, at 19px/700 (WCAG large text, the 3:1 bar), on
     #F6F6F7: the same near-white backdrop the blue theme takes, and the brightest
     value this palette owns. Red measures 3.65:1 there, up from 3.27 on the old
     mono pearl but still UNDER the 4.5 normal-text bar, so the type size remains
     load-bearing and not a flourish. Measured, not eyeballed.
     A near-white panel in a near-black rail inverts every OTHER role it uses: ink
     and hairlines come down the grey ramp instead of up it, and the add field
     takes a light surface so its text can be dark. Without this the panel header
     would sit at 2.11 and its dates, mini buttons and set-aside rows at 3.39 on
     the new backdrop, and anything reaching --txt would vanish at 1.12. */
  --north:#E8443C; --northbg:#F6F6F7;
  --northtxt:#161619; --northmut:#40404A; --northmut2:#6F6F79;
  --northline:#40404A; --northfield:#E9E9EC; --northink-rgb:22,22,25;
  --northfocus:#40404A; --northfocus-rgb:64,64,74;
  --grad:linear-gradient(135deg,#E8443C,#E8443C);
  --gradf:linear-gradient(135deg,#E9E9EC,#E9E9EC);
  --ring1:#E8443C; --ring2:#E8443C; --ring3:#E8443C;
  --shadow:0 0 rgba(0,0,0,0);
  --ink-rgb:233,233,236; --shd-rgb:0,0,0;
  --denim-rgb:169,169,179; --teal-rgb:142,142,152; --today-rgb:232,68,60;
  --pearl-rgb:49,49,56; --cloud-rgb:22,22,25;
  --must-rgb:228,228,232; --should-rgb:165,165,174; --extra-rgb:111,111,121;
  --scrim:rgba(0,0,0,.55);
  --bgfx:none;
  --railbg:linear-gradient(180deg,#161619,#161619);
  --traybg:#313138;
  --trayrim:#4A4A54;
  --trayshadow:0 0 0 1px #4A4A54;
  --sheen:none;
  --sheen2:none;
  --oscheme:dark;
  --fdx:'Silkscreen','Space Grotesk','Inter',system-ui,sans-serif;
  --fbx:'Silkscreen','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:14.5px;line-height:1.45;overflow:hidden}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--bgfx);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:radial-gradient(rgba(var(--ink-rgb),.55) .5px, transparent .5px);
  background-size:3px 3px;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select{background:var(--cloud);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14px;outline:none;color:var(--txt)}
input:focus,select:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(var(--denim-rgb),.24)}
select option{background:var(--pearl);color:var(--txt)}
/* the always-visible scrollbar that used to live here is gone; the one auto-hiding
   set below governs every scroller in the app, so there is nothing to keep in step */

/* shell */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh}
#app>*{min-width:0}
#rail{border-right:1px solid var(--line);background:var(--railbg);backdrop-filter:blur(8px);padding:16px 14px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#main{min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:14px 16px 0;background:var(--canvas)}

/* brand */
.brandrow{display:flex;align-items:center;gap:10px}
/* the logo is the way back to the board, so it is a real button and carries a name */
.brandbtn{display:flex;align-items:center;gap:10px;text-align:left;padding:0;border-radius:12px}
@media (hover:hover){ .brandbtn:hover .brand{color:var(--denim)} }
.brandbtn:active{transform:scale(.97)}
.mark{width:34px;height:34px;border-radius:11px;background:var(--gradf);flex:none;display:grid;place-items:center;box-shadow:0 6px 18px rgba(var(--shd-rgb),.28)}
.mark i{width:11px;height:11px;border-radius:50%;background:var(--cloud);display:block}
.brand{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1.1}
.brand span{display:block;font-family:var(--fbx);font-weight:600;font-size:10.5px;color:var(--txt);letter-spacing:.09em;text-transform:uppercase}
.savebadge{font-size:10.5px;color:var(--teal);background:rgba(var(--teal-rgb),.14);border:1px solid rgba(var(--teal-rgb),.34);padding:3px 9px;border-radius:99px;white-space:nowrap;align-self:center;margin-left:auto}
.savebadge.warn{color:var(--navy);border-color:rgba(var(--ink-rgb),.34);background:rgba(var(--ink-rgb),.09)}

/* rail buttons */
.navgrp{display:flex;flex-direction:column;gap:6px}
/* the nav items take the True north backdrop, so the five panels in the rail are
   one surface. That makes each item a light island exactly as #fpanel is, and it
   needs the same treatment: a dark theme cannot lend a near-white pill its
   near-white ink. The roles it actually consumes are re-pointed here (label ink,
   hover ink, active ink and the tint triplet behind the hover wash, the count
   pill and the press glow); every rule below still reads the ordinary role.
   The labels are 13.5px again: they were briefly 19px to match the statement,
   and that pairing is gone. */
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;
  border-radius:var(--r2);font-size:13.5px;font-weight:500;color:var(--mut);
  border:1px solid transparent;transition:.16s}
/* hover paints the wash as a LAYER, not as a background-color. On a resting item
   the two would look the same, but the ACTIVE item has a surface of its own now,
   and a background-color wash would replace that white with a translucent film
   and let the rail show through: under mono the current view would go nearly
   black on hover. Layering is correct for both. The idiom is --traybg's.
   A resting item does not re-point --ink-rgb, so its wash is still the rail tint
   these states were originally tuned with: navy over powder in Cloud blue, and
   the near-white triplet over near-black in Monochrome, where it lightens rather
   than darkens. The press glow (an ::after radial on the same triplet) is tuned
   the same way and needed no change. The active item re-points the triplet below,
   so on white both the wash and the glow darken instead. */
.navbtn:hover{background-image:linear-gradient(rgba(var(--ink-rgb),.06),rgba(var(--ink-rgb),.06));color:var(--txt)}
/* WHITE MEANS ACTIVE: the current view is the only item that leaves the rail's
   surface, and it takes the True north backdrop plus the ink set that backdrop
   requires, because a dark theme cannot lend a near-white pill its near-white
   text (mono's resting label measures 2.11 on it, its strong ink 1.09).
   background-color rather than the background shorthand, or it would reset the
   hover layer above.
   The surface is not alone. It keeps the marks it already had, none of them new:
   the inset bar and tinted icon in the today colour, the rim, the ink stepping
   from the muted tier to the strong one, and the heavier label, which is how
   .pday.today and .cell.today .n already say "this is the current one".
   CLOUD BLUE has no red, so there the bar and icon are the today teal (#567C8D,
   4.17:1 on the backdrop, over the 3:1 non-text bar) and the ink goes navy at
   600. Teal on white is quieter than red on white, which is exactly why the
   backdrop change matters more in that theme than in Monochrome. */
.navbtn.on{background-color:var(--northbg);border-color:var(--northline);color:var(--navy);font-weight:600;
  box-shadow:inset 3px 0 0 var(--today),var(--shadow);
  --txt:var(--northtxt);--navy:var(--northtxt);--mut:var(--northmut);--ink-rgb:var(--northink-rgb)}
.navbtn.on .em{color:var(--today)}
.navbtn .em{width:18px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.navbtn .em svg{width:17px;height:17px}
.navbtn .cnt{margin-left:auto;font-size:11px;color:var(--mut);background:rgba(var(--ink-rgb),.08);padding:1px 7px;border-radius:99px}
.railcap{font-family:var(--fbx);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);padding:0 2px;margin-top:2px}
.railfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.railfoot button{flex:1 1 31%;padding:8px;border-radius:9px;font-size:12px;color:var(--mut);border:1px solid var(--line);background:var(--cloud);transition:.16s}
.railfoot button:hover{color:var(--navy);border-color:var(--line2)}

/* cards */
.kard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
.kh{display:flex;align-items:center;gap:8px;font-family:var(--fbx);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.kh .sp{margin-left:auto;font-family:var(--fb);text-transform:none;letter-spacing:0;font-weight:500;color:var(--mut2)}
/* the one chevron every collapsible panel header uses: right when collapsed, down when open */
.chev{width:12px;height:12px;flex:none;color:var(--mut2);transition:transform .18s ease}
.chev.open{transform:rotate(90deg)}
.kh[data-action],.hhead[data-action],.trayhead[data-action]{cursor:pointer;user-select:none}
.kh.solo{margin-bottom:0}
@media (hover:hover){
  .kh[data-action]:hover,.hhead[data-action]:hover{color:var(--navy)}
  .kh[data-action]:hover .chev,.hhead[data-action]:hover .chev,
  .trayhead[data-action]:hover .chev{color:var(--navy)}
}

/* focus (True north): a statement panel, not a task list. Its presence in the
   rail comes only from levers the app already has: the pearl surface against the
   rail's powder, the deeper input line colour on the same 1px border, a touch
   more padding, and the display face for the statement itself. No new colour,
   no gradient, no stripe, no icon; row hairlines and the tick are gone because
   a statement is read, not processed. */
/* the panel is a light island in both themes, so it re-points the roles it uses
   rather than every rule inside it learning which theme it is in. Each rule below
   (.kh, .chev, .empty, .fdate, .mini, .fdone, the add field) keeps reading exactly
   the variable it always read; only the values change, and only inside the panel.
   In cloud blue these resolve to the values those roles already held, so the blue
   panel does not move. In mono they are the inversion the near-white backdrop
   forces. What keeps it reading as a panel and not a hole punched in the sidebar
   is that the surface still carries the card's 14px radius and a --northline rim
   in both themes, and its contents are inked FOR it: a bright rectangle with the
   rail's own near-white text sitting in it is what would have looked like a cut. */
#fpanel{background:var(--northbg);border-color:var(--northline);padding:15px 15px 14px;
  --txt:var(--northtxt);--navy:var(--northtxt);--mut:var(--northmut);--mut2:var(--northmut2);
  --line2:var(--northline);--cloud:var(--northfield);--ink-rgb:var(--northink-rgb);
  --denim:var(--northfocus);--denim-rgb:var(--northfocus-rgb)}
.frow{display:flex;align-items:flex-start;gap:8px;padding:8px 0}
/* the held statements are the one highlighted thing in the sidebar: statement
   ink (--north) at 19px/700. The size is load-bearing, not taste: 19px at 700 is
   WCAG large text, and mono's red on the #F6F6F7 backdrop clears the 3:1
   large-text bar (3.65) while falling short of the 4.5 normal-text bar, so
   shrinking this face breaks accessibility, not just looks. Contrast does not
   move with type size; only which bar applies does. The nav labels were briefly
   sized to match this face and are not any more: the two are independent, and
   this one is the one that cannot move. Scoped to the panel: the weekly list
   shares .ftxt and keeps its own size. Set-aside rows keep their muted small
   face through the .frow.done override below. */
#fpanel .frow:not(.done) .ftxt{font-size:19px;font-weight:700;line-height:1.35;color:var(--north)}
/* block, not inline: at 19px a statement wraps in the rail, and a wrapped inline
   span's box no longer covers its own centre, so the tap that should open the
   rename landed on the div behind it. Block, the span owns its full lines. */
#fpanel .ftxt span[data-action]{display:block}
.ftxt{flex:1;min-width:0;word-break:break-word;font-family:var(--fd);
  font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.45;color:var(--navy)}
.frow .mini{margin-top:3px}
/* a set-aside statement mutes and shrinks back to body type; never struck through */
.frow.done{padding:5px 0}
.frow.done .ftxt{font-family:var(--fb);font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--mut2)}
.frow.done .mini{margin-top:0}
.fdate{font-size:10.5px;color:var(--mut2);display:block;margin-top:1px}
.mini{font-size:11px;color:var(--mut2);padding:2px 5px;border-radius:6px;transition:.14s}
.mini:hover{color:var(--navy);background:rgba(var(--ink-rgb),.08)}
.box{width:17px;height:17px;border-radius:6px;border:1.6px solid var(--line2);flex:none;margin-top:1px;display:grid;place-items:center;font-size:11px;color:transparent;transition:.16s}
.box:hover{border-color:var(--done)}
.box.on{background:var(--done);border-color:var(--done);color:var(--onpri)}
.box.pop{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.fadd{display:flex;gap:6px;margin-top:9px}
.fadd input{flex:1;padding:7px 9px;font-size:13px}
.fadd button{padding:7px 12px;border-radius:9px;background:var(--grad);color:var(--onpri);font-weight:600;font-size:12.5px}
.fdone{margin-top:8px;font-size:11.5px;color:var(--mut2);cursor:pointer;user-select:none}

/* metrics */
.mtabs{display:flex;gap:3px;margin-left:auto;background:rgba(var(--ink-rgb),.07);padding:2px;border-radius:8px}
.mtabs button{font-size:10.5px;padding:3px 8px;border-radius:6px;color:var(--mut);font-weight:500}
.mtabs button.on{background:var(--cloud);color:var(--navy);box-shadow:0 1px 2px rgba(var(--shd-rgb),.12)}
.ringwrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rlab{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rlab b{font-family:var(--fdx);font-size:21px;font-weight:700;letter-spacing:-.02em;display:block;color:var(--navy)}
.ring .rlab i{font-style:normal;font-family:var(--fbx);font-size:9.5px;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase}
.rp{transition:stroke-dashoffset .55s cubic-bezier(.4,0,.2,1)}
/* the ring's paints come from the theme: the track tint, and the bar's gradient
   stops (a flat colour in mono, where all three stops agree) */
.ring .rt{stroke:rgba(var(--ink-rgb),.12)}
#rg stop:nth-of-type(1){stop-color:var(--ring1)}
#rg stop:nth-of-type(2){stop-color:var(--ring2)}
#rg stop:nth-of-type(3){stop-color:var(--ring3)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.legend div{display:flex;align-items:center;gap:7px;color:var(--mut)}
.legend b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.dotm{width:7px;height:7px;border-radius:50%;flex:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{font-family:var(--fdx);font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.statsub{font-size:11px;color:var(--mut2);margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:2px}
.bar{flex:1;min-width:0;border-radius:5px 5px 3px 3px;background:var(--gradf);transition:height .45s cubic-bezier(.4,0,.2,1);min-height:3px;position:relative}
.bar.now{box-shadow:0 0 0 1.5px var(--today)}
.barlbl{display:flex;gap:6px;margin-top:5px;font-family:var(--fbx);font-size:9.5px;color:var(--mut2)}
.barlbl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.goalbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.goalbar .gt{display:flex;font-size:11px;color:var(--mut);margin-bottom:6px}
.goalbar .gt b{margin-left:auto;color:var(--txt);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:rgba(var(--ink-rgb),.10);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--gradf);transition:width .55s cubic-bezier(.4,0,.2,1)}

/* quick add */
#quickadd{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#qi{flex:1;min-width:180px;min-height:44px;padding:11px 13px;font-size:14.5px;line-height:1.4;background:var(--pearl);border:1px solid var(--line2);border-radius:var(--r2);resize:none;overflow:hidden;max-height:170px;outline:none;box-shadow:var(--shadow)}
#qi:focus{border-color:var(--denim);box-shadow:0 0 0 3px rgba(var(--denim-rgb),.24)}
#qi::placeholder{color:var(--mut2)}
#qd{padding:11px 10px;font-size:13px;max-width:190px;background:var(--pearl)}
#qb{padding:11px 18px;border-radius:var(--r2);background:var(--grad);color:var(--onpri);font-weight:700;font-size:14px;letter-spacing:-.01em;transition:.15s;box-shadow:var(--shadow)}
#qb:active{transform:scale(.97)}

/* carry tray. The slot is emptied in Notes, never hidden while full (renderTray says
   why), so this is the whole of what keeps its band from staying open there: no
   children, no margin, no height. Same contract as #boardnav and #strip. */
#tray:not(:empty){margin-bottom:12px}
/* The brightest surface on the board, so it reads as the one panel asking to be dealt
   with first: a pearl sheen over the same cloud blue the day columns use, a pearl rim
   catching the light, a teal ring and a soft ocean glow just outside it, and more
   elevation than a column, with a 2px lift so it sits forward of the canvas. */
.tray{border:1px solid var(--trayrim);border-radius:var(--r);padding:11px 13px;
  background:var(--traybg);
  transform:translateY(-2px);
  box-shadow:var(--trayshadow);
  animation:traydrop .34s ease}
@keyframes traydrop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(-2px)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.trayhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
/* collapsed, the header IS the tray: no items below it, so no gap held under it */
.tray.closed .trayhead{margin-bottom:0}
.trayhead b{font-family:var(--fd);font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:7px}
/* THE ACCENT, and the one place the tray reads --today: the marker dot. --today is
   the "attention here" accent the nav already reuses, so mono gets its red and cloud
   blue its teal from the one variable and no red enters the blue palette. A real
   element rather than a ::before so the viewport pass's red sweep can see it and the
   whitelist names it. NON-TEXT on purpose: the red measures 3.27:1 on --traybg under
   mono, over the 3:1 non-text bar and under the 4.5 text one, so it may never ink the
   label beside it (blue's teal measures 4.08 on the tray's pearl sheen). */
.traydot{width:7px;height:7px;border-radius:50%;background:var(--today);flex:none}
/* the count rides the collapsed bar the way "0 open" and "0 habits" do, and stays
   put when the bar opens; it carries the auto margin, so the actions follow it */
.traycnt{margin-left:auto;font-size:11.5px;color:var(--mut);white-space:nowrap}
.trayhead .acts{display:flex;gap:6px}
/* tray only: powder keeps the controls readable now the panel behind them is brighter */
.tbtn{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line2);color:var(--navy);background:var(--panel);transition:.15s}
.tbtn:hover{background:var(--panel2)}
.trayitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(var(--ink-rgb),.13);font-size:13px}
.trayitem .from{font-size:10.5px;color:var(--mut);background:rgba(var(--ink-rgb),.08);padding:1px 7px;border-radius:99px;white-space:nowrap}
.trayitem .t{flex:1;min-width:0;word-break:break-word}
/* a done task can no longer reach the tray (the merge repairs it at the axis that
   made it), so this styles a state that should never appear. It exists so that a
   regression is VISIBLE: same struck-through --mut2 a finished card takes, and the
   header count leaves it out. No new variable, no colour of its own. */
.trayitem.done .t{color:var(--mut2);text-decoration:line-through}

/* recycle bin */
.binrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line)}
.binrow .bt{flex:1;min-width:0}
.binrow .bt b{display:block;font-size:13px;font-weight:600;color:var(--txt);word-break:break-word}
.binrow .bt span{font-size:11px;color:var(--mut)}
.binrow .nbtn{flex:none;font-size:11.5px;padding:6px 10px}

/* board nav */
/* the empty-slot contract, the one `#habits`, `#weekMobile` and `#tray` already keep:
   a slot that a render can empty must carry its spacing on :not(:empty), or it holds
   a band of canvas open in every view that does not draw it. #boardnav and #strip were
   the two that missed it, and in Notes (where both are emptied) they were 11px and 9px
   of dead space above the pane. */
#boardnav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#boardnav:not(:empty){margin-bottom:11px}
.nbtn{padding:7px 12px;border-radius:9px;font-size:12.5px;color:var(--navy);border:1px solid var(--line);background:var(--pearl);transition:.15s;font-weight:500}
.nbtn:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
.nbtn:hover{color:var(--navy);border-color:var(--line2)}
.nbtn.solid{background:var(--navy);border-color:rgba(var(--cloud-rgb),.32);color:var(--on)}
#boardnav .jl{font-size:11.5px;color:var(--oncanvas);margin-left:6px}
#boardnav input[type=date]{padding:6px 9px;font-size:12.5px;color-scheme:var(--oscheme)}
.offnote{font-size:11.5px;color:var(--ocean);margin-left:auto;font-weight:600}

/* board */
#board{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding-bottom:16px;flex:1;min-width:0;align-items:flex-start}
.col{width:268px;flex:none;display:flex;flex-direction:column;max-height:100%;background:var(--cloud);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
/* Today only: the one column takes the content area instead of a 268px track. FENCED
   INTO THE WIDE LAYOUT deliberately. #board turns column-direction under 900px, where
   a grow rule would size the column to its content rather than the width, and the
   narrow board is a single day strip already, so the mode is not offered there and
   the rule must not be reachable either. The sticky corner's reservation is padding
   on #board, so the column grows into what is left of the row and never under it. */
@media (min-width:901px){
  #board.oneday .col{width:auto;flex:1 1 auto;min-width:0}
}
.anim .col{animation:rise .34s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.col.today{border-color:var(--today);box-shadow:0 0 0 1px rgba(var(--today-rgb),.35),var(--shadow)}
.col.past{opacity:.66}
.colhead{padding:11px 12px 9px;border-bottom:1px solid var(--line);flex:none;background:rgba(var(--ink-rgb),.03)}
/* a Free Floating tab header is the tab's drag handle; day column headers are not */
.backlog .colhead{cursor:grab}
.backlog .colhead:active{cursor:grabbing}
/* tab drag: the grabbed column stays in place as a ghost in the dashed-denim
   drag language every drop surface already speaks; the target keeps the dashed
   cue, and an inset bar on its near or far edge names the exact landing side */
.col.backlog{position:relative}
.col.dragging{opacity:.45;border-style:dashed;border-color:var(--denim)}
.col.drop{outline:1.5px dashed var(--denim);outline-offset:3px}
.col.drop-before::after,.col.drop-after::after{content:'';position:absolute;top:12px;bottom:12px;width:3px;
  border-radius:2px;background:var(--denim);pointer-events:none;animation:fade .18s ease}
.col.drop-before::after{left:5px}
.col.drop-after::after{right:5px}
.colhead .d1{display:flex;align-items:baseline;gap:7px}
/* rename and delete sit together in a tab header, so they need to match each other */
.backlog .colhead .mini{align-self:center;display:inline-flex;align-items:center;justify-content:center;min-width:21px}
.colhead .dow{font-family:var(--fdx);font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--navy);text-transform:uppercase}
.colhead .dnum{font-family:var(--fbx);font-size:11.5px;color:var(--mut);text-transform:uppercase}
.badge{margin-left:auto;font-family:var(--fbx);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:rgba(var(--today-rgb),.2);color:var(--today);border:1px solid rgba(var(--today-rgb),.42)}
.colhead .meta{font-size:11px;color:var(--mut);margin-top:3px}
.heavy{margin-top:7px;font-size:11px;padding:5px 8px;border-radius:8px;background:rgba(var(--ink-rgb),.10);border:1px solid rgba(var(--ink-rgb),.32);color:var(--navy)}
.colbody{overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:11px;min-height:60px}
.zone{border-radius:var(--r2);padding:2px}
.zone.drop{outline:1.5px dashed var(--denim);outline-offset:2px;background:rgba(var(--denim-rgb),.12)}
.zh{display:flex;align-items:center;gap:6px;font-family:var(--fbx);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:2px 3px 6px}
.zh .pip{width:6px;height:6px;border-radius:50%;flex:none}
.zh .lk{width:12px;height:12px;margin-left:2px;color:var(--denim);flex:none}
.zh .n{margin-left:auto;font-weight:500;letter-spacing:0;font-size:10.5px}
.zone.locked{opacity:.55}
.freego{font-size:11px;color:var(--teal);padding:4px 4px 6px;font-weight:600}
.zadd{width:100%;text-align:left;font-size:11.5px;color:var(--mut2);padding:5px 6px;border-radius:7px;transition:.14s;margin-top:2px}
.zadd:hover{background:rgba(var(--ink-rgb),.06);color:var(--navy)}

/* task card */
.task{background:var(--tasktile);border:1px solid var(--line);border-radius:var(--r2);padding:8px 9px;margin-bottom:6px;transition:.15s;box-shadow:0 1px 1px rgba(var(--shd-rgb),.06)}
.task:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--shadow)}
.task.sel{border-color:var(--denim);background:var(--cloud);box-shadow:0 0 0 1px rgba(var(--denim-rgb),.4),var(--shadow)}
.task.dragging{opacity:.4}
.task.flash{animation:flash .7s ease}
@keyframes flash{0%{background:rgba(var(--denim-rgb),.4)}100%{background:var(--tasktile)}}
.trow{display:flex;align-items:flex-start;gap:8px}
.ttl{flex:1;min-width:0;font-size:13.5px;line-height:1.35;word-break:break-word;cursor:pointer}
.task.done .ttl{color:var(--mut2);text-decoration:line-through}
.subn{font-family:var(--fbx);font-size:10.5px;color:var(--mut2);white-space:nowrap;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.abtn{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mut);background:var(--panel);transition:.14s;white-space:nowrap}
.abtn:hover{color:var(--navy);border-color:var(--line2);background:var(--panel2)}
.abtn.m{color:var(--must-t);border-color:rgba(var(--must-rgb),.4)}
.abtn.s{color:var(--should-t);border-color:rgba(var(--should-rgb),.45)}
.abtn.e{color:var(--extra-t);border-color:rgba(var(--extra-rgb),.5)}
/* the one destructive control in the bar, on a day card and inside a Free Floating tab
   alike, so it reads as deliberate instead of as another neutral button. Navy inversion,
   the same idiom the day strip already uses. */
.abtn.del{color:var(--navy);border-color:var(--line2)}
.abtn.del:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
.acts select{font-size:11px;padding:3px 6px;border-radius:7px}
.sbody{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;padding:2px 0}
.sub.dragging{opacity:.4}
.sub .st{flex:1;min-width:0;word-break:break-word;line-height:1.3}
.sub.done .st{color:var(--mut2);text-decoration:line-through}
.sbox{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:9px;color:transparent;transition:.15s}
.sbox.on{background:var(--done);border-color:var(--done);color:var(--onpri)}
.saddrow{display:flex;gap:5px;margin-top:3px}
.saddrow input{flex:1;padding:5px 8px;font-size:12px;border-radius:7px;min-width:0}
.zaddrow .addcancel{flex:none;padding:5px 9px;color:var(--mut)}
[contenteditable]{outline:none;border-bottom:1.5px solid var(--denim);padding-bottom:1px}

/* habits: a commitment band under the board, same surface language as a column */
#habits:not(:empty){margin-top:2px;padding-bottom:16px;flex:none}
.hpanel{background:var(--cloud);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 13px}
.hhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hhead b{font-family:var(--fd);font-size:13.5px;color:var(--navy);display:flex;align-items:center;gap:7px}
.hhead b::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
.hhead .hsub{font-size:11.5px;color:var(--mut)}
.hhead .mini{margin-left:auto}
.hhead .hcnt{margin-left:auto;color:var(--mut2)}
.hgridwrap{overflow-x:auto;margin-top:9px}
.hgrid{display:grid;grid-template-columns:minmax(110px,1fr) repeat(6,40px) auto auto;gap:3px 4px;align-items:center}
.hdow{text-align:center;font-family:var(--fbx);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.hdow.now{color:var(--today)}
.hname{font-size:13px;line-height:1.3;word-break:break-word;padding:2px 4px;border-radius:6px;cursor:pointer}
.hname:hover{background:rgba(var(--ink-rgb),.06)}
.hbox{width:19px;height:19px;justify-self:center;margin-top:0}
.hdash{text-align:center;color:var(--mut2);opacity:.55;font-size:12px;user-select:none}
.hday{font-size:10px;padding:4px 0;border-radius:7px;border:1px solid var(--line);color:var(--mut);background:var(--cloud);transition:.14s}
.hday:hover{border-color:var(--line2);color:var(--navy)}
.hday:active{transform:scale(.93)}
.hday.on{background:var(--pearl);border-color:var(--denim);color:var(--navy);font-weight:600}
.haddrow{display:flex;gap:6px;margin-top:10px}
.haddrow input{flex:1;padding:7px 9px;font-size:13px;min-width:0}
.haddrow .nbtn{flex:none}
@media (max-width:900px){
  .hgrid{grid-template-columns:minmax(88px,1fr) repeat(6,34px) auto auto}
  .hbox{width:20px;height:20px}
  .hday{min-height:30px}
  .haddrow input{font-size:16px;min-height:42px}
}
/* rail placement (desktop): 254px inside the kard cannot hold a name beside six cells
   and their controls, so each habit is two lines and the cells get the full width */
#habitsRail:empty,#weekRail:empty,#weekMobile:empty{display:none}
#weekMobile:not(:empty){padding-bottom:16px}
.hcard .kh .mini,.wcard .kh .mini{text-transform:none;letter-spacing:0;font-weight:500}
.hrdow,.hrcells{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;justify-items:center;align-items:center}
.hrdow{margin-bottom:2px}
.hrail .hdow{padding:2px 0}
.hrname{display:flex;align-items:center;gap:5px;margin-top:8px}
.hrname .hname{flex:1;min-width:0;padding:1px 4px}
.hrcells{margin-top:3px}
.hrcells .hbox{width:20px;height:20px}
.hrcells .hday{width:100%;min-height:24px}
.hcard .haddrow{margin-top:11px}
.hcard .haddrow input,.wcard .fadd input{font-size:13px}
.wcard .ftxt span{cursor:pointer}

/* calendar */
#cal{flex:1;overflow-y:auto;padding-bottom:16px;min-width:0}
.calbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.calbar h2{font-family:var(--fd);font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;color:var(--navy)}
.chip{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(var(--teal-rgb),.18);border:1px solid rgba(var(--teal-rgb),.38);color:var(--teal);display:inline-flex;align-items:center;gap:7px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.caldow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.caldow div{text-align:center;font-family:var(--fbx);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);padding:2px}
.cell{min-height:74px;border-radius:var(--r2);padding:6px 7px;border:1px solid var(--line);background:var(--card);transition:.15s;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.cell:hover{background:var(--panel)}
.cell.blank{border:none;background:none;cursor:default;min-height:0}
.cell.today{border-color:var(--today)}
.cell.sel{border-color:var(--denim);background:rgba(var(--denim-rgb),.14)}
.cell .n{font-family:var(--fbx);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.cell.today .n{color:var(--today);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots .more{font-size:9px;color:var(--mut2);line-height:6px}
.cell .allok{font-size:11px;color:var(--today)}
.dpanel{margin-top:16px}
.dphead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.dphead b{font-family:var(--fd);font-size:15px;font-weight:600;color:var(--navy)}
.dpadd{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.dpadd input{flex:1;min-width:160px}
.dplist{max-width:640px}

/* notes: the list panel borrows the column surface; the editor page sits directly
   beside it, one continuous surface, and the READING measure is the text column
   inside the page (.notewrap), not the page's placement. Every size already exists
   in the app: the title is the calendar-h2 face (19px --fd 600), the body 15px --fb,
   the meta line the 11px muted small print. The body is a contenteditable div, so
   it grows with its text and .noteed is the scroller: no inner scrollbar box. */
#notes{flex:1;min-width:0;gap:14px;padding-bottom:16px;align-items:stretch;overflow:hidden}
.notelist{width:272px;flex:none;display:flex;flex-direction:column;gap:7px;background:var(--cloud);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px;overflow-y:auto}
#noteSearch{width:100%;font-size:13px;background:var(--pearl)}
#noteRows{display:flex;flex-direction:column;gap:7px}
.noterow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;
  padding:8px 10px;border-radius:var(--r2);border:1px solid transparent;transition:.15s}
.noterow.on{background:var(--pearl);border-color:var(--line2);box-shadow:var(--shadow)}
.noterow .nt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--txt);max-width:100%}
.noterow .nt svg{width:11px;height:11px;flex:none;color:var(--denim)}
.noterow .ntx{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover){ .noterow:hover{background:rgba(var(--ink-rgb),.06)} .noterow.on:hover{background:var(--pearl)} }
.noterow:active{transform:scale(.99)}
/* folders: one level, no nesting. A folder is a quiet group heading in the list,
   in the railcap voice; its notes indent under it. Each row carries a Move
   control beside it (never inside the row button, which is the open action),
   so a note reaches a folder in two taps with no drag anywhere. */
.noteli{display:flex;align-items:stretch;gap:4px}
.noteli .noterow{flex:1;min-width:0}
.noteli.inf{padding-left:12px}
.notemv{flex:none;align-self:center;padding:6px;border-radius:8px;color:var(--mut2);border:1px solid transparent;transition:.15s}
@media (hover:hover){ .notemv:hover{color:var(--navy);border-color:var(--line)} }
.notemv:active{transform:scale(.9)}
.notemv svg{width:15px;height:15px;display:block}
.fldhead{display:flex;align-items:center;gap:6px;padding:8px 4px 2px;margin-top:2px}
.fldhead svg.fico{width:12px;height:12px;flex:none;color:var(--mut2)}
.fldname{font-family:var(--fbx);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fldhead .fn{font-size:10.5px;color:var(--mut2);margin-left:auto}
.fldhead .mini{flex:none}
.fldempty{font-size:11px;color:var(--mut2);font-style:italic;padding:2px 4px 4px 16px}
/* the folder chooser's options, on the modal surface */
.mvlist{display:flex;flex-direction:column;gap:2px;margin:4px 0 2px}
.noteed{flex:1;min-width:0;overflow-y:auto;padding:2px 6px 18px 0}
/* the page sits directly beside the list, one continuous surface like board-and-rail,
   and ENDS with its content: the text column declares the reading measure as its
   preferred width and the page fits that (fit-content), so title, meta, toolbar and
   body all share the same edges and the measure is written exactly once. Past the
   page's edge the denim canvas shows, the same way it does past the board's columns. */
.notepage{width:fit-content;max-width:100%;background:var(--pearl);border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:var(--shadow);padding:22px 30px 30px;display:flex;flex-direction:column}
.notepage:focus-within{border-color:var(--denim);box-shadow:0 0 0 3px rgba(var(--denim-rgb),.14),var(--shadow)}
.notewrap{width:640px;max-width:100%;min-width:0}
#noteTitle{width:100%;min-width:0;border:none;background:transparent;box-shadow:none;border-radius:0;
  padding:0 0 6px;font-family:var(--fd);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--navy)}
#noteTitle:focus{border:none;box-shadow:none}
.notemeta{display:flex;align-items:center;gap:6px;padding:0 0 7px;flex-wrap:wrap}
#noteMeta{font-size:11px;color:var(--mut2);margin-right:auto}
.nact{font-size:11.5px;font-weight:500;color:var(--mut);padding:4px 9px;border-radius:7px;
  border:1px solid transparent;transition:.15s}
@media (hover:hover){ .nact:hover{color:var(--navy);border-color:var(--line)} }
.nact:active{transform:scale(.95)}
.nact.on{color:var(--denim);border-color:var(--line)}
/* the toolbar: one quiet strip, always there while a note is open. Small letterform
   buttons, palette swatches, list glyphs, the page select at the end. */
.ntools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:3px 0 7px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.ntb{min-width:28px;padding:4px 7px;border-radius:7px;font-size:12.5px;font-weight:600;
  color:var(--mut);border:1px solid transparent;transition:.15s;line-height:1.25}
@media (hover:hover){ .ntb:not([disabled]):hover{color:var(--navy);border-color:var(--line)} }
.ntb:not([disabled]):active{transform:scale(.93)}
.ntb.on{color:var(--navy);background:rgba(var(--ink-rgb),.09);border-color:var(--line2)}
/* a step that does not exist reads as unavailable rather than as a live control. The
   native attribute, so the press, the hover and the accessibility tree all agree at
   once; opacity rather than a colour, so neither theme needs a variable for it. */
/* pointer-events:none is load-bearing, not decoration. Chrome does not dispatch
   mousedown from a disabled button, so the toolbar's preventDefault never runs and
   the press would blur the editor, dropping a phone keyboard for nothing. Made
   transparent, the press lands on #noteTools instead, which does prevent it. */
.ntb[disabled]{opacity:.34;cursor:default;pointer-events:none}
.ntb .swc{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid var(--line2);vertical-align:-2px}
.ntb .a1{font-size:10.5px}.ntb .a2{font-size:12.5px}.ntb .a3{font-size:15.5px}
.ntb.stepb{display:inline-flex;align-items:center;justify-content:center}
.ntb.stepb svg{width:15px;height:15px}
.ntsep{width:1px;height:15px;background:var(--line);margin:0 5px;flex:none}
#notePage{margin-left:auto;font-size:12px;padding:4px 7px;background:var(--pearl)}
#noteBody{width:100%;border:none;background:transparent;box-shadow:none;border-radius:0;
  padding:0 0 8px;min-height:240px;font-size:15px;line-height:1.7;color:var(--txt);outline:none;
  white-space:pre-wrap;overflow-wrap:break-word}
#noteBody:empty::before{content:attr(data-ph);color:var(--mut2);pointer-events:none}
/* formatted content: every colour and size is one the app already uses */
#noteBody .hl-powder{background:var(--panel)}
#noteBody .hl-ocean{background:var(--ocean)}
#noteBody .hl-tile{background:var(--tasktile)}
#noteBody .fz-s{font-size:13px}
#noteBody .fz-l{font-size:19px;line-height:1.45}
#noteBody ul,#noteBody ol{margin:0;padding-left:1.6em}
#noteBody ul.dash{list-style-type:circle;list-style-type:'-  '}
/* page appearance, drawn UNDER the text: hairlines and dots from the palette, kept
   faint enough that navy ink always wins. em-based so the ruling tracks the type. */
#noteBody.pg-ruled{background-image:linear-gradient(to top,rgba(var(--denim-rgb),.26) 1px,transparent 1px);
  background-size:100% 1.7em;background-position:0 .12em}
#noteBody.pg-dot{background-image:radial-gradient(rgba(var(--ink-rgb),.17) 1px,transparent 1.4px);
  background-size:1.13em 1.13em;background-position:.3em .55em}
/* ---------- the sticky note: one shared scratch block ----------
   A margin note, not a panel. Three placements, each chosen so it can never
   cover a control with no way to scroll clear:
   - Board and Free Floating (wide): a floating corner over the canvas, bottom
     right; #board reserves the sticky's width at the END of its sideways
     scroll, so at max scroll the last column clears the corner, and any other
     column scrolls clear the way content already moves under a margin note.
   - Notes (wide): a right-aligned strip at the TOP of #main's column, in flow, on
     order:-1, with the note list and the editor below it. It sat at the FOOT from
     2026-08-13 until this pass, and the foot rule is where this was fixed: the top
     right was asked for, so the order:-1 came back to the one rule that had lost
     it, rather than a second Notes-only selector going on top of a foot placement.
     The cost is stated plainly rather than discovered later. The strip takes a row
     of its own, so the canvas to its left drew nothing: 476x221 at 1280, 220x129
     at 1024. That band is exactly what the foot placement bought and what the top
     placement spends again. The HEIGHT is the same either way, above the pane or
     below it, because it is the same block of the same column flex, so the pane
     loses nothing to the move.
     AT 1200px AND UP THE NOTE LIST NOW TAKES THAT BAND: #main is a grid there and
     #notes is display:contents, so the list spans both rows down the left while
     the strip and the editor stack on the right (the .stickytop block below the
     pad rule). The strip does not move or resize by one pixel and neither does the
     editor; 190x221 of canvas is still bare above the editor at 1280, which is the
     strip's own 464px width and not something a layout can reclaim. The 901 to
     1199 band cannot have it: column two would be 398px against a 464px strip.
     AT 1554px AND UP THE STRIP BECOMES THE THIRD COLUMN and that last bare band
     goes with it: one row, three tracks, list and editor and strip all starting at
     the content top. 1554 is where the two-row grid's dead band beside the strip
     would reach the strip's own 464px, and from there the strip takes what the
     row leaves, 196px at the boundary up to its full 464 at 1822; the band's own
     comment does the arithmetic.
     An OVERLAY is still refused, now with this pass's numbers rather than from
     memory: at 1280 the page runs to x=1258 inside a content area ending at 1264,
     with Unpin at 1113-1166, Delete at 1172-1227 and the toolbar spanning
     641-1227. All three live in that corner, so anything floated there covers all
     three, and reserving the width instead leaves the page 168px wide at 1280 and
     nothing at all at 1024, where the whole pane is 398px. In flow, an overlap is
     not a risk to be tuned down: it cannot be built.
   - Under 900px: in flow, full width, at the END of the view, where a floating
     corner would cover content and fight the on-screen keyboard. This is also the
     answer to "top right" at a width that has no room for one: a single column has
     no right hand side, and 205px of scratch pad hoisted above the list would bury
     the list and stand in the way of the keyboard. So order:-1 stays inside the
     901px band and the narrow layout keeps the pad at the end of the flow.
   The textarea is STATIC markup, never rebuilt by a render, so its caret and
   its native undo survive every foreign render for free, the #qi trick.
   SIZE: the pad's HEIGHT is 92 at the base and every placement now overrides it.
   The corner used to be the one that could not, and the reason it can now is not a
   new measurement of the corner: it is that .colbody gained a padding-bottom, so a
   column has scroll to put its tail clear of the corner instead of ending under it.
   The refusals that remain are still measurements, not preferences:
   - THE CORNER GROWS, BUT ONLY AGAINST THAT RESERVATION, and never past the point
     where a centred add control meets it. It is an overlay on the board, so every
     pixel it gains is a pixel of board it covers AT REST; the reservation is what
     makes "at rest" stop being the whole story, because the column can now always
     be scrolled clear. What it does not fix is a control the corner reaches with
     the column already at its end, and that is what caps the middle band: at 1280
     the auditor centres a day column's "+ add" at x=794, exactly the 464px
     corner's left edge, and from there only height is left to decide it. Measured
     with the reservation in place, 152 passes and 154 fails, and 152 itself
     flickered between 0 and 2 misses across runs, so the corner takes 130 there
     and stands 23px inside a cliff rather than on it. From 901 to 1199 the corner
     is only 232px wide and never reaches that control at all, so it takes the full
     184 and audits clean at 260. Above 1000px of viewport height the 1280 cap goes
     too, on the axis that imposed it. The (794,625) defect this comment used to
     record as permanent was a corner grown WITHOUT the reservation; it is the
     reservation that was missing, not the room.
   - NOTES IS WALLED AT 1024 BUT NOT AT 1280, and neither the move to the foot nor
     the move back to the top changed which. Above the pane or below it, the strip
     is the same block of the same column flex, so .noteed pays its height either
     way; a move buys placement, not room. What Notes did win back is the carry
     tray, which is no longer drawn in this view at all. At 1024
     the doubled pad measured 571px of content into 502px of pane, a scroll on a
     short note. At 1280 the pane pays the 92px and a short note still fits.
   - the narrow flow keeps its 168. Height is uncovered there but it is not free
     of scroll: a near-empty board at 820 measures exactly 1180 of 1180, so any
     addition starts a scroll that was not there, and 336px of scratch pad is most
     of a phone screen with the keyboard up. Doubled once (84 to 168), not twice.
   So on a 1024 tablet the pad still does not grow on the WIDTH axis in either
   placement, and Notes there still cannot pay a taller pad; what changed is that
   the board can, because the column now reserves the room rather than the corner
   simply sitting on it. The board is still the thing this panel is not allowed to
   eat, and the reservation is how it eats nothing. */
#main{position:relative}
/* the corner keeps its 232px here and doubles only in the band below, where the
   board has the room. This is the base, so it is also what 901 to 1199px gets. */
#sticky{position:absolute;right:22px;bottom:18px;width:232px;z-index:40;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);
  box-shadow:var(--shadow);padding:8px 10px 9px;display:flex;flex-direction:column;gap:3px}
.stickycap{font-family:var(--fbx);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2)}
/* 92px is the BASE, and since the corner took a height of its own it is reached by
   exactly ONE placement: the Notes strip from 901 to 1199px. The corner overrides it
   in every band it appears in and the narrow flow overrides it below 900. */
#stickyPad{width:100%;height:92px;resize:none;border:none;background:transparent;box-shadow:none;
  border-radius:0;padding:0;font-size:12.5px;line-height:1.5;color:var(--txt);outline:none;overflow-y:auto}
#stickyPad::placeholder{color:var(--mut2)}
@media (min-width:901px){
  /* order:-1, deliberately: the strip is the FIRST block of the content column, so
     it stands at the TOP right of the content area with the list and the editor
     below it. In flow, never floated, which is what makes covering the editor's
     own controls impossible rather than merely unlikely. The 10px is the gap down
     to the pane. This is the rule the 2026-08-13 pass changed; changed back here,
     rather than overridden from somewhere else. */
  #sticky[data-pos="top"]{position:static;order:-1;align-self:flex-end;width:464px;margin:0 0 10px}
  /* the corner's clearance at the end of the board's sideways scroll: it tracks
     the corner's own width, or the last column slides back under it */
  #main.stickycorner #board{padding-right:264px}
  /* ---------- THE VERTICAL TWIN OF THAT RESERVATION ----------
     #board reserves the corner's WIDTH at the end of the scroll it has, which is
     sideways. This reserves the corner's HEIGHT at the end of the scroll a COLUMN
     has, which is .colbody's: #board is overflow-y:hidden and .col is overflow:hidden,
     so .colbody is the only thing in a column that scrolls vertically. Measured
     before it was written, not assumed.
     WHAT IT BUYS. Without it a column whose content happens to end inside the
     corner's band has no scroll at all to clear it: the tail, the "+ add" row
     included, simply sits under the pad, which is the residual risk 16 named and
     the mechanism behind the (794,625) defect. With it the scroller always keeps at
     least the corner's height plus its 18px offset of room past the last control, so
     scrolling a column to its end always puts that control clear of the corner. The
     guarantee is the inequality, not the number: reservation >= corner height + 18,
     asserted directly the way Section 13 asserts the width one, so it holds by
     construction at whatever size the corner is rather than by luck at one.
     WHAT IT COSTS, stated rather than discovered: the padding is content, so a
     column that used to end with its last card now ends with a band of its own
     surface below it, and a short column grows until it meets .col's max-height.
     That is the price of the tail being reachable, and it is the same shape of price
     #board's padding-right pays sideways.
     249 = 221 (a 184px pad plus 37px of cap, gap, padding and border) + 18 + 10 of
     slack, the same 10px the width reservation carries. */
  #main.stickycorner .colbody{padding-bottom:249px}
  /* THE CORNER'S HEIGHT IN THIS BAND IS 184, matching the Notes strip, because here
     the corner is 232px WIDE and never reaches a day column's add control at all.
     Measured clean with the reservation in place at 901x700, 1024x700, 1024x768,
     1199x700 and 1199x768, and still clean at a 260px pad on every one of them, so
     184 stands 76px inside the wall rather than against it. */
  #sticky[data-pos="corner"] #stickyPad{height:184px}
}
/* THE CORNER DOUBLES ONLY WHERE THE BOARD HAS THE ROOM. Measured, and the wall is
   hard: at 1024 the board is 684px wide and the second day column's "+ add" sits
   with its centre at x=738, so a corner wider than about 264px covers that centre
   and the control stops being hit-testable at rest. The viewport pass caught it
   as 48 to 72 misses on tablet-1024 in the ordinary boot-tray and enter-chain
   states, and no width or height between the old size and the doubled one clears
   it there: the 1024 board has no room to give on either axis. Above 1200px it
   does, and the pass is clean at 464px. So the corner is 232px from 901 to 1199
   and 464px above that, and the reservation moves with it. The alternative was a
   corner that buries a control on a common tablet, which is not a size choice. */
@media (min-width:1200px){
  #sticky{width:464px}
  #main.stickycorner #board{padding-right:496px}
  /* Notes keeps its 184: the pane can pay it at 1280 where the 1024 pane cannot. */
  #sticky[data-pos="top"] #stickyPad{height:184px}
  /* THE CORNER COMES BACK DOWN WHERE IT IS 464px WIDE, and the cause is horizontal
     before it is vertical. The auditor reaches a control by scrolling it into view
     first, block and inline centred, so what decides is where a centred add control
     lands. At 1280 the content area is 940px and the board scrolls, so that centring
     puts a day column's "+ add" centre at x=794, which is EXACTLY the corner's left
     edge (1280 less the 22px offset less 464). From there nothing but the vertical
     relationship is left, and at 800px of viewport the board is 439px tall.
     MEASURED, with the reservation above already in place: 152 passes, 154 fails,
     and 152 itself flickered between 0 and 2 misses across runs. That is a cliff,
     not a size. 130 stands 23px inside it and still audits clean with the board 40px
     shorter than the seed's own tray leaves it, which is two more tray rows; 138
     survives 20px of that and 145 survives none. So 130, and the headroom is the
     reason rather than the number being pretty.
     At 1920 the same centring lands the add at x=1114 against a corner beginning at
     1434, so it is not width that binds at every wide size: it is height, at this
     one. Which is what the band below is for. */
  #sticky[data-pos="corner"] #stickyPad{height:130px}
  /* 195 = 167 (the 130px pad plus 37 of chrome) + 18 + 10, the same inequality */
  #main.stickycorner .colbody{padding-bottom:195px}
  /* THE LIST FILLS THE BAND BESIDE THE STRIP, and the cause is what moves, not the
     pane. The strip is a row of #main's column, so everything after it began 231px
     down (14 padding, 221 of strip, 10 of margin) and the canvas to its left drew
     nothing: 476x221 at 1280, 636x221 at 1440. So #main becomes a two-column grid
     here and #notes hands its own children over with display:contents, which is
     the one thing that lets the list take column ONE across BOTH rows while the
     strip and the editor stack in column two. No negative margin, nothing pulled.
     NOTHING MOVES RIGHT AND NOTHING SHRINKS. Column two is the pane minus the list
     and the gap, so it ends where the pane ends: the strip keeps 464px and lands
     on exactly the x it had (800 to 1264 at 1280, 960 to 1424 at 1440), the editor
     keeps its 654px and its 648px page, and the editor still starts below the
     strip. The list is the only thing that changes: 540px tall to 771px, starting
     at the top of the content area. 190x221 of canvas is still bare above the
     editor at 1280; that is the strip's width talking and only a narrower strip
     could buy it back.
     ONLY HERE. At 901 to 1199 column two would be narrower than the strip itself
     (398px against 464px at 1024), so the strip would overflow back across the
     list; that band keeps the stacked flow, where the band is 129px rather than
     221px. Under 900px there is no band at all, the strip is last in the flow.
     AND AT 1554px THE 190x221 GOES TOO, because the strip stops being a row and
     becomes the third grid track: see the band below this one. That width is the
     first at which the dead canvas this grid leaves beside the strip would exceed
     the strip itself, so from there the row costs more than the feature takes and
     the strip goes beside the pane instead, at whatever width the row leaves it.
     THE EMPTY SLOTS span the full width. #tray, #boardnav, #strip, #habits and
     #weekMobile are all guaranteed empty in a wide Notes view (renderTray returns
     early on the view, renderNav empties the two board slots, and renderHabits and
     renderWeekly host in the rail whenever wideLayout()), so this decides nothing
     visible; it means a slot that somehow drew would be a row of its own rather
     than a squeeze on the list's column.
     The display:contents is !important because render() writes #notes's display
     inline. It applies only while .stickytop is set, which is only while Notes is
     the view, so the inline display:none that hides #notes everywhere else still
     wins. Same override the rail's .railhide already makes. */
  #main.stickytop{display:grid;grid-template-columns:272px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);column-gap:14px;padding-bottom:16px}
  #main.stickytop>#notes{display:contents!important}
  #main.stickytop .notelist{grid-column:1;grid-row:1/3}
  /* align-self on a grid item is the BLOCK axis, so the strip's flex-end no longer
     means "right": justify-self is what keeps it against the pane's right edge. */
  #main.stickytop #sticky{grid-column:2;grid-row:1;justify-self:end;align-self:start}
  #main.stickytop .noteed{grid-column:2;grid-row:2}
  #main.stickytop>#tray,#main.stickytop>#boardnav,#main.stickytop>#strip,
  #main.stickytop>#habits,#main.stickytop>#weekMobile{grid-column:1/-1}
}
/* ---------- a TALL viewport pays the full 184, and the axis is deliberate ----------
   The band above is capped by height, not by width: once the centred add control sits
   on the 464px corner's left edge at 1280, the only question left is how far up the
   board the corner reaches, and that is viewport height. So the cap lifts on the axis
   that imposed it rather than on the one that happens to be nearby. This is the first
   height query in the sheet and it is here for that reason alone.
   MEASURED at a 184px pad with the reservation: at 1000px of viewport the board is
   639px and the pass is clean at 1200, 1280, 1440 and 1920 wide. 1000 rather than 900
   is the headroom: at 1280x900 the worst control clears the corner by 25px, at
   1280x1000 by 125px, and 25px is one tray row away from being a cliff again.
   The corner is then the same 464x221 the Notes strip is, which is what was asked
   for; it is simply not affordable on a 800px-tall screen and the sheet says so in
   two bands instead of pretending one number fits both. */
@media (min-width:1200px) and (min-height:1000px){
  #sticky[data-pos="corner"] #stickyPad{height:184px}
  #main.stickycorner .colbody{padding-bottom:249px}
}
/* ---------- 1554px and up: the strip stops being a row and becomes a COLUMN ----------
   The 1200px grid handed the list the band beside the strip, but the strip itself was
   still a row of #main's column, so the editor still began 231px down and 190x221 of
   canvas still stood bare above it at 1280. Wide enough, none of that has to be paid:
   the strip stands BESIDE the pane rather than above it, and the list, the editor and
   the strip all start at the content top together. The bare band is gone, not moved.
   THE BAND USED TO START AT 1822 AND THAT THRESHOLD'S PREMISE WAS WRONG: it asked for
   the strip's DOUBLED 464px as a prerequisite, the one ceiling in a sum of floors, so
   between 1554 and 1821 the two-row grid held a 221px row for the strip and left MORE
   dead canvas beside it than the strip itself takes (the band beside a 464 strip is
   the viewport less 1090, which passes 464 at 1554 and reached about 497px on the
   1586px viewport that reported this). So the strip's track is now FLEXIBLE,
   minmax(196px,464px): it takes exactly what the row leaves once the list and a whole
   editor are paid, and saturates at its full 464 at 1822, where the resolved layout is
   pixel for pixel the one the old band drew. 1822 is no longer a threshold, only the
   saturation point 1358 + 464.
   WHAT THE EDITOR TRACK PROTECTS IS THE MEASURE, as before. The page is fit-content
   around .notewrap's 640px reading measure, so its full width is 640 + 60 of
   .notepage padding + 2 of border = 702px. .noteed spends 6px of its own padding and,
   while a note is long enough to scroll, the 10px scrollbar gutter, so the editor
   column needs 718px to leave the measure whole: minmax(718px,1fr), the 718 a floor a
   narrow band cannot squeeze and the 1fr what grows once the strip is full. Beside it
   stand the 272px list and the strip with the grid's two 14px gaps, inside #main's
   32px of padding and beside the 308px rail, so the fixed parts sum to
   272 + 14 + 718 + 14 + 32 + 308 = 1358 and the strip's width IS the viewport less
   1358, never chosen: 196 at the 1554 boundary (1554 = 1090 + 464, the width where
   the dead band would out-measure the strip), 228 at 1586, 464 from 1822 up. It is
   cut for the EXPANDED rail because that is the tighter case; collapsing the rail
   only ever hands the content area more (the freed column, less the 56px the restore
   button stands in), and the flexible tracks spend that room on the strip first and
   then the editor, with no second threshold to cut.
   NOTHING ELSE MOVES. The strip keeps its 184px pad, the list keeps its 272px, the
   editor keeps its page, and the strip is still IN FLOW: it is a grid track, not a
   float, so the overlap measured against .ntools, Unpin and Delete cannot be built
   here any more than it can below. Below 1554 the two-column grid is untouched, and
   below 1200 so is the stacked column flow. */
@media (min-width:1554px){
  /* ONE row, so the three tracks share the top edge; 1fr rather than auto so the list
     and the editor still fill the pane's height the way they do in the two-row grid. */
  #main.stickytop{grid-template-columns:272px minmax(718px,1fr) minmax(196px,464px);
    grid-template-rows:minmax(0,1fr)}
  #main.stickytop .notelist{grid-row:1}
  #main.stickytop .noteed{grid-column:2;grid-row:1}
  /* align-self:start carries over from the 1200 rule; the 10px was the gap down to a
     pane that is no longer underneath it. width:auto with justify-self:stretch is what
     lets the TRACK size the strip: the 464px declaration is the two-row bands' fixed
     width, and here it would overflow a 196px track, not fill it. */
  #main.stickytop #sticky{grid-column:3;grid-row:1;margin:0;width:auto;justify-self:stretch}
}
@media (max-width:900px){
  #sticky{position:static;width:auto;margin:10px 0 4px}
  /* 168, not 336: the near-empty board at 820 is exactly 1180 of 1180, so doubling
     again starts a scroll that was not there. 16px keeps the browser from zooming
     the page when the field takes focus. */
  #stickyPad{height:168px;font-size:16px}
}

@media (max-width:900px){
  #notes{flex-direction:column;overflow:visible}
  .notelist{width:100%;max-height:38vh;flex:none}
  .noteed{overflow:visible;padding:0}
  .notepage{width:auto;padding:16px 16px 24px}
  .notewrap{width:auto;max-width:none}
  /* 16px keeps the browser from zooming the page when the field takes focus */
  #noteSearch{font-size:16px;min-height:44px}
  #noteTitle{font-size:17px;min-height:44px}
  #noteBody{min-height:40vh;font-size:16px}
}

.popover{position:fixed;z-index:250;background:var(--card);border:1px solid var(--line2);
  border-radius:var(--r);padding:9px;box-shadow:0 4px 10px rgba(var(--shd-rgb),.14),0 18px 44px rgba(var(--shd-rgb),.26);

  color:var(--txt);border:1px solid transparent;transition:.14s;white-space:nowrap}

.pday{height:31px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;

/* the custom layer replaces the built-in popup on pointer devices, so hide its icon

@media (hover:hover){

  input[type=date]::-webkit-datetime-edit-day-field:focus,

/* modal / toast */

@keyframes fade{from{opacity:0}to{opacity:1}}

/* sync panel */
.syncrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.syncrow input{flex:1;min-width:190px;font-size:12.5px;letter-spacing:.02em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--pearl)}
.syncstat{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.5;color:var(--mut);
  background:var(--pearl);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;margin-bottom:12px}
.syncstat .sdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--mut2)}
.syncstat.busy .sdot{background:var(--denim)}
