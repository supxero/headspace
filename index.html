/* ================= render: tray =================
   NOT DRAWN IN NOTES, and that is a presentation decision only. The roll itself is
   untouched: rollover() still runs on its own schedule, carry still fills at the
   Monday 00:00 local boundary like any other day boundary, nothing is dropped,
   marked or re-dated, and every carried item is on screen again the moment the view
   goes back to the board. state.carry is never read for the decision, only the view.
   SKIPPED, not hidden. The slot is emptied, which is exactly what renderNav already
   does to #boardnav and #strip outside the board, so the `:not(:empty)` spacing
   contract collapses the band to nothing with no second mechanism. Hiding a drawn
   tray instead would keep three or four triage controls per carried item built and
   in the DOM in a view that must not offer them, and would need its own display
   rule on top of the contract to stop the slot holding a band open. */
function renderTray(){
  if(state.settings.view==='notes'||!state.carry.length){$('#tray').innerHTML='';return}
  /* COLLAPSED BY DEFAULT: with items the tray is a header bar until it is opened,
     the same chevron-and-count idiom Habits and This week keep, so a fresh carry
     announces itself without taking the top of the board. The bulk actions and the
     items draw only while open: a collapsed bar that offered All → Today would be
     triage without the list it triages. An EMPTY carry still draws nothing at all;
     the bar is never the dead band the :not(:empty) contract closed. */
  /* HONESTY ABOUT A DONE ITEM. The merge now repairs done-in-carry at the axis where
     it was manufactured (homed(), Section 21), so nothing should ever reach this line
     ticked. If one does, it is drawn ticked, in the same struck-through --mut2 a done
     card takes, and it is left OUT of the count, which counts what is actually waiting
     for triage. A regression then shows on the surface as a finished task in the tray
     and a count that disagrees with the list, rather than hiding as one more untidy
     row nobody reads twice. */
  const open=state.settings.trayOpen===true, n=state.carry.filter(t=>!t.done).length;
  $('#tray').innerHTML='<div class="tray'+(open?'':' closed')+'">'+
    '<div class="trayhead" data-action="tray-toggle">'+CHEV(open)+
    '<b><span class="traydot"></span>Carry-over</b>'+
    '<span class="traycnt">'+n+' waiting</span>'+
    (open?'<span class="acts"><button class="tbtn" data-action="carry-all" data-to="today">All → Today</button>'+
    '<button class="tbtn" data-action="carry-all" data-to="float">All → Free Floating</button></span>':'')+
    '</div>'+
    (open?state.carry.map(t=>'<div class="trayitem'+(t.done?' done':'')+'">'+
      '<span class="from">'+esc(t.from||'earlier')+'</span>'+
      '<span class="t">'+esc(t.title)+'</span>'+
      '<button class="tbtn" data-action="carry-one" data-id="'+t.id+'" data-to="today">Today</button>'+
      '<button class="tbtn" data-action="carry-one" data-id="'+t.id+'" data-to="float">Free Floating</button>'+
      /* the glyph is not a name: spop and the float move beside it both carry one,
         and the blank-label sweep reads text OR aria-label */
      '<button class="tbtn" data-action="carry-drop" data-id="'+t.id+'" title="Drop from the tray"'+
      ' aria-label="Drop from the tray">✕</button></div>').join(''):'')+
    '</div>';
}

/* ================= render: board nav =================
   TODAY ONLY is a mode of the board, not a place on it: it draws one day column where
   seven would go. It is a WIDE-LAYOUT feature on the same contract the rail collapse
   keeps, and this is the only function that decides it. Under 900px the board is
   ALREADY a single day strip, so the flag must change nothing there or there would be
   two mechanisms for one thing: the width branch below is read first, the control is
   not drawn under 900px (renderNav), and the full-width rule is fenced into a
   min-width:901px block. A device that is narrow now cannot be in the mode now,
   whatever it stored while it was wide, and the resize handler re-renders on a real
   width change, so crossing the boundary either way lands in the right one. */
/* ONE BOUNDARY, AND IT IS THE STYLESHEET'S. The layout branches in two places, the
   media queries and the gates in here, and for one pixel the two disagreed. The narrow
   block is `max-width:900px` and the wide one `min-width:901px`, so 900 is a narrow
   window to every rule in the file; every gate in the script read `>=900` and built the
   WIDE structure there. At exactly innerWidth 900 the seven column board, the Today
   only switch, the off-board column and the rail hosting of Habits and This week were
   therefore handed to a stylesheet that draws a single column, folds the rail behind
   Menu and lays out a day strip the script had not built, which put both panels inside
   a closed menu with their full width bands left empty. Rare, not impossible (a
   maximised window on a 900px split, a 900px
   iframe), and invisible to the viewport pass because no profile sits on the pixel.
   Every gate now reads this one predicate, defined as the exact complement of
   `max-width:900px`. Do not inline a width comparison beside it and do not give the
   rail its own copy: a test pins 899, 900 and 901 against the resolved cascade. */
const WIDE_FROM=901;              /* the same pixel as the stylesheet's min-width:901px */
const wideLayout=()=>window.innerWidth>=WIDE_FROM;
function todayOnlyOn(){ return state.settings.todayOnly===true&&wideLayout() }
function windowDays(){
  const n=(!wideLayout()||todayOnlyOn())?1:7, o=state.settings.boardOffset, out=[];
  /* ONE branch for one column, whichever reason produced it: the day shown is
     stripDay, the same field the phone strip drives, kept in step with boardOffset by
     shiftBoard and showDay so the seven-column window and the single one always
     name the same day. */
  if(n===1) return [state.settings.stripDay||today()];
  for(let i=0;i<n;i++) out.push(plus(o+i));
  return out;
}
/* Which days the board shows is held in two places: boardOffset drives the seven column
   layout, stripDay drives the single column one a phone gets. A control that moves only
   one of them works on a laptop and does nothing on a phone, so everything that moves the
   board window goes through these two and keeps the pair in step. */
function shiftBoard(d){
  const s=state.settings;
  s.boardOffset+=d;
  s.stripDay=plus(d,s.stripDay||today());
}
function showDay(date){
  const s=state.settings;
  s.boardOffset=dayDiff(today(),date);
  s.stripDay=date;
}
function renderNav(){
  if(state.settings.view!=='board'){$('#boardnav').innerHTML='';$('#strip').innerHTML='';return}
  if(state.settings.floatMode){
    $('#boardnav').innerHTML='<button class="nbtn solid" data-action="floattoggle">‹ Back to dates</button>'+
      '<button class="nbtn" data-action="float-new">+ Tab</button>'+
      '<span class="jl">Cards here have no date yet. Drag one onto a day to schedule it.</span>';
    $('#strip').innerHTML=''; return;
  }
  const win=windowDays(), off=offBoard(win), pastOpen=pastOpenCount();
  /* PREV AND NEXT STEP THE WINDOW THAT IS ON SCREEN. Seven days move a week; one day
     moves a day, because a week per press on a one column board would skip six days
     with nothing on screen to say so. The mode is not navigation, so navigating never
     turns it off. Both steps go through shiftBoard, which is what keeps boardOffset
     and stripDay in step, so neither field is written from here. */
  const one=todayOnlyOn(), step=one?1:7;
  $('#boardnav').innerHTML=
    '<button class="nbtn" data-action="nav" data-d="-'+step+'" title="'+(one?'Back a day':'Back a week')+'">‹ Prev</button>'+
    '<button class="nbtn solid" data-action="nav-today">Today</button>'+
    '<button class="nbtn" data-action="nav" data-d="'+step+'" title="'+(one?'Forward a day':'Forward a week')+'">Next ›</button>'+
    '<span class="jl">Jump to</span><input type="date" id="jumpDate" aria-label="Jump to a date" value="'+win[0]+'">'+
    /* THE MODE SWITCH, after the navigation cluster because it is not part of it.
       ONE STABLE LABEL, "Today only", with aria-pressed carrying the state and the
       .solid fill this row already owns showing it. The label deliberately does NOT
       flip to "Week" when the mode is on: a toggle button that renames itself
       contradicts its own aria-pressed in one state or the other ("Week, pressed"
       while the board shows one day, or "Week, not pressed" while it shows a week),
       and a button reading "Week" that switches AWAY from the week is a trap for the
       press. The word the other state needs lives in the title, which is the one part
       of a toggle that is allowed to name the destination.
       Not drawn under 900px, where the board is a single day strip already. */
    (wideLayout()
      ? '<button class="nbtn'+(one?' solid':'')+'" data-action="todayonly" aria-pressed="'+(one?'true':'false')+
        '" title="'+(one?'Show the seven day week':'Show today alone')+'">Today only</button>'
      : '')+
    /* Rollover runs once a day, so anything landing on a past day after it has run waits
       until tomorrow. Rather than sweeping continuously, which would fight a deliberate
       back-date, say so plainly and offer to bring them in. */
    (pastOpen
      ? '<button class="nbtn" data-action="roll-now" title="Move them into the carry-over tray">'+
        pastOpen+' waiting on past days</button>'
      : (off.length?'<span class="offnote">'+off.length+' off-board</span>':''));
  /* mobile day strip */
  if(!wideLayout()){
    const cur=state.settings.stripDay||today();
    let days=[];
    for(let i=-1;i<=6;i++) days.push(plus(i));
    if(!days.includes(cur)) days.unshift(cur);
    $('#strip').innerHTML=days.map(d=>{
      const dd=dayDiff(today(),d);
      const lbl=dd===0?'Today':dd===1?'Tmrw':dd===-1?'Ystdy':DOW[new Date(d+'T12:00:00').getDay()]+' '+d.slice(8);
      return '<button data-action="strip" data-day="'+d+'" class="'+(d===cur?'on':'')+(dd===0?' istoday':'')+'">'+lbl+'</button>';
    }).join('');
  }else $('#strip').innerHTML='';
}
function offBoard(win){
  return Object.keys(state.days).filter(d=>!win.includes(d)&&tasksOn(d).some(t=>!t.done))
    .sort();
}

/* ================= render: board ================= */
function renderBoard(){
  const key=[state.settings.view,state.settings.floatMode,state.settings.boardOffset,
    state.settings.stripDay,todayOnlyOn(),state.floats.length].join('|');
  const changed=key!==ui.renderKey; ui.renderKey=key;
  const b=$('#board');
  b.classList.toggle('anim',changed);
  /* one column takes the content area. Float mode is a mode of the board too and its
     tabs are not day columns, so the class is off while it runs. */
  b.classList.toggle('oneday',todayOnlyOn()&&!state.settings.floatMode);

  if(state.settings.floatMode){
    b.innerHTML=state.floats.map((f,i)=>floatCol(f,i)).join('');
    return;
  }
  const win=windowDays();
  let h=win.map((d,i)=>dayCol(d,i)).join('');
  const off=offBoard(win);
  /* the off-board summary is a SECOND column, so Today only does not draw it, exactly
     as the phone's single-day board does not. The count is still reported in the nav
     row, so nothing dated elsewhere goes unmentioned; the way to reach it is the
     seven-day window, which is one press away. */
  if(off.length&&wideLayout()&&!todayOnlyOn()){
    h+='<div class="col" style="animation-delay:'+(win.length*35)+'ms"><div class="colhead">'+
      '<div class="d1"><span class="dow">Off-board</span></div>'+
      '<div class="meta">dated outside this window</div></div><div class="colbody">'+
      off.map(d=>{
        const n=tasksOn(d).filter(t=>!t.done).length;
        return '<div class="task"><div class="trow"><div class="ttl">'+
          DOW[new Date(d+'T12:00:00').getDay()]+' '+d+' · '+n+' open</div>'+
          '<button class="abtn" data-action="goto-day" data-day="'+d+'">go →</button></div></div>';
      }).join('')+'</div></div>';
  }
  b.innerHTML=h;
}
function floatCol(f,i){
  return '<div class="col backlog" data-fid="'+f.id+'" style="animation-delay:'+(i*35)+'ms">'+
    /* the header is the tab's drag handle, so a drag starting on a card inside the
       column stays a card drag and the two never compete for the same press */
    '<div class="colhead" draggable="true" title="Drag to reorder tabs"><div class="d1"><span class="dow"> '+esc(f.name)+'</span>'+
    /* reorder by tap, for the devices that cannot drag: no mobile browser raises HTML5
       drag events from touch, so the drag below is pointer-only and always was. The
       ends render NO control rather than a dead one, the same guard the tab delete
       uses. Both carry a name, which is the bug this header has shipped twice. */
    (i>0?'<button class="mini" data-action="float-move" data-fid="'+f.id+'" data-d="-1" '+
      'title="Move tab left" aria-label="Move tab left">‹</button>':'')+
    (i<state.floats.length-1?'<button class="mini" data-action="float-move" data-fid="'+f.id+'" data-d="1" '+
      'title="Move tab right" aria-label="Move tab right">›</button>':'')+
    '<button class="mini" data-action="float-rename" data-fid="'+f.id+'" title="Rename">✎</button>'+
    (state.floats.length>1?'<button class="mini" data-action="float-del" data-fid="'+f.id+'" '+
      'title="Delete tab" aria-label="Delete tab">✕</button>':'')+
    /* the tab is its name and its controls. The open count is gone with the day
       columns' tally, element included, for the same reason: an empty .meta keeps
       its margin. The rail's "N open" bar is a different line and stays. */
    '</div></div>'+
    '<div class="colbody"><div class="zone" data-drop="float" data-fid="'+f.id+'">'+
    (f.tasks.length?f.tasks.map(t=>card(t,{kind:'float',fid:f.id})).join(''):'<div class="empty">Nothing here yet.</div>')+
    '</div>'+addRow({kind:'float',fid:f.id})+'</div></div>';
}
function dayCol(d,i){
  const x=day(d), dd=dayDiff(today(),d);
  const dt=new Date(d+'T12:00:00');
  const openMust=x.must.filter(t=>!t.done).length;
  const allMustDone=x.must.length>0&&openMust===0;

  /* the header is the date and, when the day is overloaded, the warning. The tally
     line is GONE, element and all: an empty .meta would still take its 3px margin
     and hold a band of canvas open under every date, the same trap the empty-slot
     contract closes for #tray and #boardnav. The zone counts (.zh .n) still say how
     much is there, and a tick still shows itself on the card. */
  let h='<div class="col'+(dd===0?' today':'')+(dd<0?' past':'')+'" data-day="'+d+'" style="animation-delay:'+(i*35)+'ms">'+
    '<div class="colhead"><div class="d1"><span class="dow">'+DOW[dt.getDay()]+'</span>'+
    '<span class="dnum">'+MON[dt.getMonth()].slice(0,3)+' '+dt.getDate()+'</span>'+
    (dd===0?'<span class="badge">TODAY</span>':'')+'</div>'+
    (openMust>5?'<div class="heavy">'+openMust+' Prio 0 tasks. Heavier than a day can hold, so demote or move some.</div>':'')+
    '</div><div class="colbody">';

  ZONES.forEach(z=>{
    const locked=z==='extra'&&!allMustDone;
    h+='<div class="zone'+(locked?' locked':'')+'" data-drop="day" data-day="'+d+'" data-zone="'+z+'">'+
      '<div class="zh"><i class="pip" style="background:'+ZC[z]+'"></i>'+ZL[z]+
      (z==='extra'?(locked?' '+LOCK:''):'')+'<span class="n">'+x[z].length+'</span></div>';
    if(z==='extra'&&!locked){
      /* 2026-08-14: the locked zone says nothing at all and renders no element. The
         lock glyph on .zh is the whole state now; the sentence that explained it went
         with its counterpart in the same pass, .lockmsg and its padding included, or an
         emptied div would hold a band of canvas where the line was. */
      h+='<div class="freego">free time, go</div>';
    }
    h+=x[z].map(t=>card(t,{kind:'day',date:d,zone:z})).join('');
    h+=addRow({kind:'day',date:d,zone:z})+'</div>';
  });
  return h+'</div></div>';
}
function addRow(dest){
  const k=dest.kind==='day'?('day:'+dest.date+':'+dest.zone):('float:'+dest.fid);
  if(ui.adding===k){
    /* value comes from ui.addText so a re-render never eats what is half typed */
    return '<div class="saddrow zaddrow"><input class="addin" data-enter="add" data-k="'+k+'" '+
      'value="'+esc(ui.addText)+'" placeholder="What is it?" autocomplete="off" '+
      'autocapitalize="sentences" enterkeyhint="done">'+
      '<button class="abtn" data-action="add-commit" data-k="'+k+'">Add</button>'+
      '<button class="abtn addcancel" data-action="add-cancel" title="Close" aria-label="Close">✕</button></div>';
  }
  /* the control is the plus alone. A glyph is not a name, so the button carries an
     aria-label: the blank-label sweep reads text OR aria-label, and this header has
     shipped nameless buttons twice. */
  return '<button class="zadd" data-action="add-open" data-k="'+k+'" aria-label="Add task">+</button>';
}

function card(t,loc){
  const sel=ui.sel===t.id;
  const sdone=t.subtasks.filter(s=>s.done).length;
  let h='<div class="task'+(t.done?' done':'')+(sel?' sel':'')+(ui.flash===t.id?' flash':'')+
    '" draggable="true" data-id="'+t.id+'">'+
    '<div class="trow"><button class="box'+(t.done?' on':'')+'" data-action="tick" data-id="'+t.id+'">✓</button>'+
    '<div class="ttl" data-action="sel" data-id="'+t.id+'">'+esc(t.title)+'</div>'+
    (t.subtasks.length?'<span class="subn">'+sdone+'/'+t.subtasks.length+'</span>':'')+'</div>';

  if(sel){
    h+='<div class="acts">';
    if(loc.kind==='day'){
      ZONES.forEach(z=>{ if(z!==loc.zone)
        h+='<button class="abtn '+z[0]+'" data-action="zone" data-id="'+t.id+'" data-day="'+loc.date+'" data-zone="'+z+'">'+ZSHORT[z]+'</button>' });
      h+='<button class="abtn" data-action="bump" data-id="'+t.id+'" data-d="-1">← Ystdy</button>'+
         '<button class="abtn" data-action="bump" data-id="'+t.id+'" data-d="1">→ Tmrw</button>';
    }else{
      ZONES.forEach(z=>h+='<button class="abtn '+z[0]+'" data-action="zone" data-id="'+t.id+'" data-day="'+today()+'" data-zone="'+z+'">'+ZSHORT[z]+'</button>');
    }
    h+='<input type="date" class="abtn" data-action="pickdate" data-id="'+t.id+'" aria-label="Move to a date" style="padding:3px 6px;font-size:11px;color-scheme:dark">';
    h+='<select data-action="tofloat" data-id="'+t.id+'"><option value="">file to…</option>'+
       state.floats.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')+'</select>';
    h+='<button class="abtn" data-action="reorder" data-id="'+t.id+'" data-d="-1">↑</button>'+
       '<button class="abtn" data-action="reorder" data-id="'+t.id+'" data-d="1">↓</button>'+
       '<button class="abtn" data-action="rename" data-id="'+t.id+'">✎</button>'+
       '<button class="abtn del" data-action="del" data-id="'+t.id+'" '+
         'title="Delete task" aria-label="Delete task">✕</button></div>';

    h+='<div class="sbody">'+
      t.subtasks.map(s=>'<div class="sub'+(s.done?' done':'')+'" draggable="true" data-sub="'+s.id+'" data-parent="'+t.id+'">'+
        '<button class="sbox'+(s.done?' on':'')+'" data-action="stick" data-id="'+t.id+'" data-sid="'+s.id+'">✓</button>'+
        '<div class="st" data-action="srename" data-id="'+t.id+'" data-sid="'+s.id+'">'+esc(s.title)+'</div>'+
        '<button class="mini" data-action="spop" data-id="'+t.id+'" data-sid="'+s.id+'" title="Make its own task">⤴</button>'+
        '<button class="mini" data-action="sdel" data-id="'+t.id+'" data-sid="'+s.id+'">✕</button></div>').join('')+
      '<div class="saddrow"><input id="sadd-'+t.id+'" data-enter="sub" data-tid="'+t.id+'" placeholder="add a step…" autocomplete="off">'+
      '<button class="abtn" data-action="sadd" data-id="'+t.id+'">+</button></div></div>';
  }
  return h+'</div>';
}

/* ================= render: habits =================
   A commitment band, not a task list: habits sit outside the days, carry no Prio
   weight, and never touch the metrics, the ring, the heavy warning or the calendar
   dots. Columns are Monday to Saturday; Sunday is a rest day by design, so it has no
   column. Ticks key on the Monday the week started, so at Monday 00:00 the grid is
   naturally blank while every finished week stays in habits.marks as history. A cell
   is only tickable on a day the habit is scheduled for; unscheduled days render a
   muted dash, so a blank box always means missed, never "not planned". */
const HDOW=['','Mo','Tu','We','Th','Fr','Sa'];
/* On a desktop the panel lives in the rail under True north; on a phone the rail folds
   behind Menu and the 308px column cannot hold names beside six cells and their
   controls, so the panel stays the full-width band under the day columns. It reads
   wideLayout(), the ONE boundary predicate, rather than keeping a copy of the
   comparison: the rail had its own `>=900` and inherited the one-pixel band with it.
   The resize handler re-homes the panel on a real width change either way. */
function hcell(hb,d,marks,eds){
  const days=arr(hb.days);
  if(eds) return '<button class="hday'+(days.includes(d)?' on':'')+
    '" data-action="habit-day" data-id="'+hb.id+'" data-dow="'+d+'">'+HDOW[d]+'</button>';
  if(days.includes(d)){
    const v=+((marks[hb.id]||{})[d])||0;
    return '<button class="box hbox'+(v>0?' on':'')+'" data-action="habit-tick" data-id="'+hb.id+
      '" data-dow="'+d+'" aria-label="'+esc(hb.name)+' on '+HDOW[d]+'">✓</button>';
  }
  return '<span class="hdash">-</span>';
}
function habitTools(hb,eds){
  if(eds) return '<button class="mini" data-action="habit-days-done" data-id="'+hb.id+'">Done</button>';
  return '<button class="mini" data-action="habit-days" data-id="'+hb.id+'" title="Choose its days">Days</button>'+
    '<button class="mini" data-action="habit-del" data-id="'+hb.id+'" title="Delete habit" aria-label="Delete habit">✕</button>';
}
function habitAddRow(){
  /* the field is bare, and an input cannot label itself with text content: the
     placeholder that named it is gone, so the name moves to aria-label, which both
     blank-label sweeps read and no one has to look at. */
  return '<div class="haddrow"><input id="habitAdd" data-enter="habit" aria-label="Add a habit" autocomplete="off">'+
    '<button class="nbtn" data-action="habit-add">Add</button></div>';
}
function renderHabits(){
  const wide=wideLayout();
  const host=wide?$('#habitsRail'):$('#habits'), other=wide?$('#habits'):$('#habitsRail');
  other.innerHTML='';
  if(!wide&&(state.settings.view!=='board'||state.settings.floatMode)){ host.innerHTML=''; return }
  const wk=hweek(), marks=state.habits.marks[wk]||{};
  const list=state.habits.list;
  /* with habits defined, the persisted manual collapse governs as it always has;
     with none, the panel is the header bar until the user peeks it open */
  if(list.length) delete ui.peek.habits;
  const expanded=list.length?state.settings.habitsOpen!==false:!!ui.peek.habits;
  const count=list.length+(list.length===1?' habit':' habits');
  const tdow=new Date(today()+'T12:00:00').getDay();
  const dowRow=cls=>[1,2,3,4,5,6].map(d=>
    '<span class="hdow'+(d===tdow?' now':'')+'">'+HDOW[d]+'</span>').join('');
  let h;
  if(wide){
    /* rail: a kard like True north above it. Six cells do not fit beside a name in 254px,
       so each habit takes two lines: its name with its controls, then the week. */
    h='<div class="kard hcard"><div class="kh'+(expanded?'':' solo')+'" data-action="habit-toggle">'+
      CHEV(expanded)+'Habits<span class="sp">'+
      (expanded?(tdow===0?'Sun rests':'Mon to Sat'):count)+'</span></div>';
    if(expanded){
      if(list.length){
        h+='<div class="hrail"><div class="hrdow">'+dowRow()+'</div>';
        list.forEach(hb=>{
          const eds=ui.habitDays===hb.id;
          h+='<div class="hrname"><span class="hname" data-action="habit-rename" data-id="'+hb.id+
            '" title="Rename">'+esc(hb.name)+'</span>'+habitTools(hb,eds)+'</div>'+
            '<div class="hrcells">'+[1,2,3,4,5,6].map(d=>hcell(hb,d,marks,eds)).join('')+'</div>';
        });
        h+='</div>';
      }else h+='<div class="empty">No habits yet. They keep their own band, apart from the day plan.</div>';
      h+=habitAddRow();
    }
    h+='</div>';
  }else{
    h='<div class="hpanel"><div class="hhead" data-action="habit-toggle">'+CHEV(expanded)+'<b>Habits</b>'+
      (expanded
        ?'<span class="hsub">'+(tdow===0?'Sunday rests. The week starts over tomorrow.':'Mon to Sat, Sunday rests')+'</span>'
        :'<span class="hsub hcnt">'+count+'</span>')+'</div>';
    if(expanded){
      if(list.length){
        h+='<div class="hgridwrap"><div class="hgrid">';
        h+='<span></span>'+dowRow()+'<span></span><span></span>';
        list.forEach(hb=>{
          const eds=ui.habitDays===hb.id;
          h+='<div class="hname" data-action="habit-rename" data-id="'+hb.id+'" title="Rename">'+esc(hb.name)+'</div>'+
            [1,2,3,4,5,6].map(d=>hcell(hb,d,marks,eds)).join('')+
            habitTools(hb,eds)+(eds?'<span></span>':'');
        });
        h+='</div></div>';
      }else h+='<div class="empty">No habits yet. They keep their own band, apart from the day plan.</div>';
      h+=habitAddRow();
    }
    h+='</div>';
  }
  host.innerHTML=h;
}

/* the weekly list: one flat band of sometime-this-week items, no tiers, no days.
   Rail on desktop under Habits, full width under the board on a phone. */
function wrow(t){
  return '<div class="frow'+(t.done?' done':'')+'">'+
    '<button class="box'+(t.done?' on':'')+'" data-action="week-tick" data-id="'+t.id+'">✓</button>'+
    '<div class="ftxt"><span data-action="week-rename" data-id="'+t.id+'" title="Rename">'+esc(t.title)+'</span></div>'+
    '<button class="mini" data-action="week-del" data-id="'+t.id+'" title="Remove" aria-label="Remove">✕</button></div>';
}
function renderWeekly(){
  const wide=wideLayout();
  const host=wide?$('#weekRail'):$('#weekMobile'), other=wide?$('#weekMobile'):$('#weekRail');

function noteHistReset(n){
  ui.noteHist={id:n?n.id:null, past:[], future:[], at:0,
    cur:{body:n?(n.body||''):'', s:0, e:0}};
  return ui.noteHist;
}
/* Where one step ends and the next begins. A run of ordinary characters is ONE step,
   ended by the space or break that finishes the word; a run of backspaces is one step
   too; a pause ends any run; and anything that is not a single-character edit at a
   single point (a paste, a toolbar command, a list conversion, a merge) is structural
   and always its own step. */
function noteHistBreak(prev,next,now,at){
  if(now-at>NOTE_UNDO_GAP) return true;
  if(next.length===prev.length+1){
    let i=0; while(i<prev.length&&prev[i]===next[i]) i++;
    if(prev.slice(i)!==next.slice(i+1)) return true;   /* not a point insert */
    return /\s/.test(next[i]);                         /* the word is finished */
  }
  if(next.length===prev.length-1){
    let i=0; while(i<next.length&&prev[i]===next[i]) i++;
    return next.slice(i)!==prev.slice(i+1);            /* not a point delete */
  }
  return true;
}
/* Every path that writes a body calls this: the input handler and the toolbar. */
function noteHistTrack(ed,n){
  let h=ui.noteHist;
  if(!h||h.id!==n.id) h=noteHistReset(n);
  const body=n.body||'', c=ed?noteCaretGet(ed):null;
  if(body===h.cur.body){ if(c){ h.cur.s=c.s; h.cur.e=c.e } return }
  const now=Date.now();
  if(noteHistBreak(h.cur.body,body,now,h.at)){
    h.past.push(h.cur);
    if(h.past.length>NOTE_UNDO_MAX) h.past.shift();
  }
  h.future.length=0;              /* a new edit is always the newest word */
  h.cur={body:body,s:c?c.s:0,e:c?c.e:0};
  h.at=now;
}
/* One step back, or forward. Repaints the editor in place and restores the caret; no
   render(), so nothing outside the page moves and no other caret is disturbed. */
function noteUndo(ed,redo){
  const n=state.notes.find(x=>x.id===state.settings.noteSel);
  const h=ui.noteHist;
  if(!n||!ed||!h||h.id!==n.id) return false;
  /* THE SYNC RULE. The history describes one note at one body. If the body under it
     is no longer the one the history last saw, something wrote it without passing
     through the tracker, and a merge landing a foreign body is exactly that. Undo
     then refuses and re-seeds on what actually arrived, so a step back can never
     resurrect this device's pre-merge text over text that just came from the other
     device. Losing a few steps of reach is the cheap side of that trade. */
  if(h.cur.body!==(n.body||'')){ noteHistReset(n); return false }
  const from=redo?h.future:h.past, to=redo?h.past:h.future;
  if(!from.length) return false;
  to.push(h.cur);
  const snap=from.pop();
  h.cur=snap; h.at=0;             /* the next keystroke starts its own step */
  n.body=snap.body;
  ed.innerHTML=noteBodyHtml(snap.body);
  /* THE CARET. A step restores the text AND the place it was typed from, so the next
     keystroke lands where the word came out rather than at the top of the note. The
     focus call is what makes that true for the BUTTONS: a chord arrives with the
     editor already focused, but a press only keeps focus because mousedown was
     prevented, and on a touch keyboard even that is not guaranteed. Focus first,
     then set the range: focusing after would collapse it back to the start. */
  if(document.activeElement!==ed){ try{ ed.focus({preventScroll:true}) }catch(err){ ed.focus() } }
  noteCaretSet(ed,snap.s,snap.e);
  notePatchRow(n);
  save(); noteToolState();
  return true;
}
/* Exactly the conditions noteUndo accepts, read by the toolbar so an enabled button
   always does something and a disabled one is never hiding a working step. Same
   history, same sync rule; noteUndo re-checks rather than trusting this. */
function noteStepsAvail(){
  const n=state.notes.find(x=>x.id===state.settings.noteSel), h=ui.noteHist;
  if(!n||!h||h.id!==n.id||h.cur.body!==(n.body||'')) return {undo:false,redo:false};
  return {undo:h.past.length>0, redo:h.future.length>0};
}
/* the cheap half of noteToolState: the two step buttons only. Runs on every keystroke,
   where walking the caret's ancestors for fifteen buttons would be waste. */
function noteStepState(){
  const bar=$('#noteTools'); if(!bar) return;
  const av=noteStepsAvail();
  const set=(cmd,on)=>{ const b=bar.querySelector('.ntb[data-cmd="'+cmd+'"]'); if(b) b.disabled=!on };
  set('undo',av.undo); set('redo',av.redo);
}
/* the in-place patches that keep the list row and the meta line honest while someone
   is typing. One copy, read by the input handler and by undo alike. */
function notePatchRow(n){
  /* the row has one line to keep honest now: an untitled note's label follows its
     first line as that line is typed. The snippet patch went with the snippet. */
  if(!(n.title||'').trim()){ const row=$('.noterow.on .ntx'); if(row) row.textContent=noteLabel(n) }
  const m=$('#noteMeta'); if(m) m.textContent=noteMetaText(n,Date.now());
}

/* ---- "- " opens a list, a second space on an empty bullet closes it again ----
   Which list? The app's OWN dash list, ul.dash, the very shape the dash toolbar
   button already writes. The mark the user typed is the mark they get: converting a
   typed dash into a round bullet swaps their punctuation for someone else's, and the
   way back out then reads as a substitution rather than an undo. No new list type,
   no new stored shape, and the sanitizer already carries ul.dash through untouched.
   Both rules are plain DOM work on the sanctioned subset, never execCommand, so they
   behave the same whatever editing engine is underneath. */
function noteDashOpen(ed){
  const cr=noteCaretGet(ed);
  if(!cr||cr.s!==cr.e||cr.s<1) return false;
  if(noteAncestor(ed,el=>el.tagName==='UL'||el.tagName==='OL')) return false;
  const flat=noteAsPlain(ed), ls=flat.lastIndexOf('\n',cr.s-1)+1;
  if(flat.slice(ls,cr.s)!=='-') return false;      /* only a lone dash opening a line */
  noteCaretSet(ed,cr.s-1,cr.s);
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount) return false;
  sel.getRangeAt(0).deleteContents();              /* the dash itself goes */
  let line=sel.getRangeAt(0).startContainer;
  if(line===ed) return false;
  while(line&&line.parentNode!==ed) line=line.parentNode;
  if(!line) return false;
  const ul=document.createElement('ul'); ul.className='dash';
  const li=document.createElement('li'); ul.appendChild(li);
  /* whatever else stood on that line becomes the item's text */
  if(line.nodeType===1){ while(line.firstChild) li.appendChild(line.firstChild) }
  else li.appendChild(line.cloneNode(true));
  /* deleting the dash can leave the empty text node behind rather than removing it,
     so emptiness is judged by content, and an empty item needs its break to stand up */
  [...li.childNodes].forEach(x=>{ if(x.nodeType===3&&!x.data) x.remove() });
  if(!li.firstChild) li.appendChild(document.createElement('br'));
  ed.replaceChild(ul,line);
  noteCaretInto(li);
  return true;
}
function noteDashClose(ed){
  const li=noteAncestor(ed,el=>el.tagName==='LI');
  if(!li) return false;
  /* the bullet is empty and one space has already landed in it: this is the second */
  if(!/^[ \u00a0]$/.test(li.textContent||'')) return false;
  const ul=li.parentNode;
  if(!ul||(ul.tagName!=='UL'&&ul.tagName!=='OL')||!ul.parentNode) return false;
  const kids=[...ul.children], below=kids.slice(kids.indexOf(li)+1);
  const line=document.createElement('div');
  line.appendChild(document.createTextNode('- '));   /* the literal dash, as typed */
  ul.parentNode.insertBefore(line,ul.nextSibling);
  if(below.length){                                  /* items under it keep their list */
    const rest=document.createElement(ul.tagName.toLowerCase());
    if(ul.className) rest.className=ul.className;
    below.forEach(x=>rest.appendChild(x));
    line.parentNode.insertBefore(rest,line.nextSibling);
  }
  li.remove();
  if(!ul.children.length) ul.remove();
  noteCaretInto(line,2);
  return true;
}
/* caret to a text offset inside one element, without going through the whole-body
   numbering: these two know exactly which node they just built */
function noteCaretInto(el,off){
  try{
    const sel=window.getSelection(); if(!sel) return;
    const t=el.firstChild, r=document.createRange();
    if(t&&t.nodeType===3) r.setStart(t,Math.min(off||0,t.length)); else r.setStart(el,0);
    r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
  }catch(err){}
}
function noteToolState(){
  const bar=$('#noteTools'), ed=$('#noteBody');
  if(!bar||!ed) return;
  const qs=c=>{ try{ return !!(document.queryCommandState&&document.queryCommandState(c)) }catch(err){ return false } };
  const base={bold:qs('bold'),italic:qs('italic'),underline:qs('underline'),strike:qs('strikeThrough')};
  bar.querySelectorAll('.ntb').forEach(b=>{
    const c=b.dataset.cmd; let on=false;
    if(c in base) on=base[c];
    else if(NOTE_HL[c]) on=!!noteAncestor(ed,el=>el.classList&&el.classList.contains(c));
    else if(c==='size-s') on=!!noteAncestor(ed,el=>el.classList&&el.classList.contains('fz-s'));
    else if(c==='size-l') on=!!noteAncestor(ed,el=>el.classList&&el.classList.contains('fz-l'));
    else if(c==='ul') on=!!noteAncestor(ed,el=>el.tagName==='UL'&&!el.classList.contains('dash'));
    else if(c==='dash') on=!!noteAncestor(ed,el=>el.tagName==='UL'&&el.classList.contains('dash'));
    else if(c==='ol') on=!!noteAncestor(ed,el=>el.tagName==='OL');
    b.classList.toggle('on',on);
  });
  noteStepState();
}

function renderNotes(){

  let sel=state.settings.noteSel;
  if(sel&&!list.some(n=>n.id===sel)) sel=null;
  if(!sel&&list.length) sel=noteOrder(list)[0].id;
  state.settings.noteSel=sel;
  const ae=document.activeElement;
  const keep=ae&&(ae.id==='noteTitle'||ae.id==='noteBody'||ae.id==='noteSearch')?ae.id:null;
  const ss=keep&&keep!=='noteBody'?ae.selectionStart:0, se=keep&&keep!=='noteBody'?ae.selectionEnd:0;
  const cr=keep==='noteBody'?noteCaretGet(ae):null;
  const cur=list.find(n=>n.id===sel);
  /* the one rule that keeps undo inside its own note AND out of the merge's way.
     Every render passes here: a different note, or the same note carrying a body the
     history never saw (a sync merge, a bin restore, an import), starts a fresh
     history rather than offering steps back into text that is no longer on screen. */
  { const h=ui.noteHist;
    if(!h||h.id!==(cur?cur.id:null)||h.cur.body!==((cur&&cur.body)||'')) noteHistReset(cur); }
  let h='<div class="notelist">'+
    '<input id="noteSearch" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off" value="'+esc(ui.noteQ||'')+'">'+

    '<button class="zadd" data-action="folder-new">+ New folder</button>';
  h+='</div><div class="noteed">';
  if(cur){
    h+='<div class="notepage"><div class="notewrap">'+
      '<input id="noteTitle" value="'+esc(cur.title||'')+
      '" placeholder="Untitled" aria-label="Note title" autocomplete="off">'+
      '<div class="notemeta"><span id="noteMeta">'+esc(noteMetaText(cur))+'</span>'+
      /* Move sits in the meta strip's quiet .nact voice, the second of the two
         required routes (the list row is the first): same guard as the row, so

        ?'<button class="nact" data-action="note-movemenu" data-id="'+cur.id+'">Move</button>':'')+

      ' class="'+(cur.pg==='ruled'?'pg-ruled':cur.pg==='dot'?'pg-dot':'')+'"'+
