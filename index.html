/* day strip (mobile). Hidden while empty on every width, not just the wide one: the
   narrow rule below opts it in with the same :not(:empty) guard #boardnav uses, so its
   padding and margin cannot hold a band open in Notes or the calendar. */
#strip{display:none;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:9px}
#strip button{flex:none;padding:7px 12px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);color:var(--navy);background:var(--pearl);white-space:nowrap}
#strip button:active{background:var(--navy);border-color:var(--navy);color:var(--on)}
#strip button.on{background:var(--navy);border-color:rgba(var(--cloud-rgb),.32);color:var(--on)}
#strip button.istoday{border-color:var(--today)}
#railtoggle{display:none}

/* ---------- scrollbars: present while scrolling, gone at rest ----------
   ONE mechanism for every scroller in the app, applied through `*`, so nothing has to
   opt in and a scroller added later is covered the day it is written.
   WHY IT CANNOT REFLOW: the gutter is reserved PERMANENTLY. The track keeps a constant
   width whether the thumb is visible or not, and only the thumb's COLOUR changes. So
   the appearance costs no layout, and no content can ever sit where a scrollbar was a
   moment ago, because that strip was never content's to begin with.
   `.scrolling` is put on the scrolling element by a capture-phase listener and taken
   off after SB_IDLE ms of stillness. Keyboard scrolling (arrows, Page Down, Home) and
   wheel, trackpad and touch all raise the same event, so the thumb appears for every
   way of scrolling, not just the ones a pointer can do. */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background-color:transparent;border-radius:99px;
  border:2px solid transparent;background-clip:padding-box;transition:background-color .3s ease}
.scrolling::-webkit-scrollbar-thumb{background-color:rgba(var(--ink-rgb),.34)}
/* with a pointer the thumb is also a control, so it surfaces on hover: invisible until
   you scroll would mean a thumb nobody can aim at and drag. Touch has no hover and
   needs none, since a finger scrolls the content itself. */
@media (hover:hover){
  *:hover::-webkit-scrollbar-thumb{background-color:rgba(var(--ink-rgb),.20)}
  *::-webkit-scrollbar-thumb:hover{background-color:rgba(var(--ink-rgb),.46)}
}
/* Firefox draws no pseudo-elements here, so it gets the standard properties instead:
   `thin` reserves a constant gutter the same way, and the same two states swap only
   the thumb colour.
   THE @supports GATE IS LOAD-BEARING, not decoration. Chrome understands BOTH, and
   when `scrollbar-width` or `scrollbar-color` is set it IGNORES the ::-webkit rules
   above and falls back to its own thin overlay bar, which reserves no gutter at all
   and so lets content sit under the thumb. Gating on the pseudo-element keeps the two
   mechanisms apart: Chrome takes the ::-webkit block, Firefox takes this one. */
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .scrolling{scrollbar-color:rgba(var(--ink-rgb),.34) transparent}
}

/* ---------- the rail collapses out of the way ----------
   Wide layouts only. Under 900px the rail is ALREADY a drop-down behind Menu, and a
   second mechanism there would be two ways to do one thing on the screen with the
   least room for either; the collapse control is not drawn below 901px and the stored
   choice has no effect there, so a phone behaves exactly as it did.
   The state is device chrome: `agora_dayplanner_rail`, its own key, never in `state`,
   never synced, applied by the head boot script before first paint. */
#railcollapse,#railshow{display:none}
#railshow{position:fixed;top:14px;left:12px;z-index:60;width:34px;height:34px;
  align-items:center;justify-content:center;border-radius:10px;color:var(--mut);
  border:1px solid var(--line2);background:var(--card);box-shadow:0 2px 6px rgba(var(--shd-rgb),.16)}
@media (hover:hover){
  #railshow:hover{color:var(--navy);border-color:var(--denim)}
  #railcollapse:hover{color:var(--navy);border-color:var(--line)}
}
#railshow:active,#railcollapse:active{transform:scale(.94)}
@media (min-width:901px){
  #railcollapse{display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:27px;height:27px;border-radius:8px;color:var(--mut);border:1px solid transparent}
  /* ONE column, not a zero-width first one. #rail leaves the flow entirely when it is
     hidden, so a two-column template would drop #main into the empty first column and
     give the board no width at all. */
  :root[data-rail="off"] #app{grid-template-columns:minmax(0,1fr)}
  :root[data-rail="off"] #rail{display:none}
  :root[data-rail="off"] #railshow{display:inline-flex}
  /* the freed width goes to the board, less the room the restore button stands in, so
     nothing is ever drawn underneath it */
  :root[data-rail="off"] #main{padding-left:56px}
}

/* responsive */
@media (max-width:900px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;height:auto;min-height:100dvh}
  #rail{border-right:none;border-bottom:1px solid var(--line);overflow:visible;position:static;padding:12px 14px;gap:11px}
  #rail .railhide{display:none!important}
  #rail.open .railhide{display:flex!important}
  #rail .navgrp{flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px}
  #rail .navgrp .navbtn{width:auto;flex:none;padding:8px 12px;white-space:nowrap}
  /* phones: Help, Sync, Export and Import sit at the top of the opened menu,
     so they are not buried under every momentum card. Desktop keeps them at the foot. */
  #rail .railfoot{order:-1;margin-top:0;padding-top:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
  #rail .railfoot button{min-height:42px;font-size:12.5px}
  #railtoggle{display:inline-flex;margin-left:auto;font-size:12px;color:var(--mut);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
  #main{overflow:visible;padding:12px 14px 40px;max-width:100vw}
  #board,#cal,#quickadd,#boardnav,#strip,#tray{max-width:100%}
  #quickadd{gap:7px}
  #qi{flex:1 1 100%;min-width:0;min-height:46px}
  #qd{flex:1;min-width:0;max-width:none}
  #qb{flex:none;padding:11px 22px}
  #boardnav{gap:6px}
  #boardnav .jl{margin-left:0}
  .calgrid,.caldow{gap:4px}
  .cell{min-height:58px;padding:4px 5px}
  #board{overflow-x:visible;flex-direction:column;padding-bottom:0}
  .col{width:100%;max-height:none}
  .colbody{overflow-y:visible;max-height:none}
  #strip:not(:empty){display:flex}
  .duo{grid-template-columns:1fr 1fr}
  /* stacked columns: the landing-side bar turns horizontal, same as the midpoint axis */
  .col.drop-before::after,.col.drop-after::after{left:12px;right:12px;width:auto;height:3px}
  .col.drop-before::after{top:5px;bottom:auto}
  .col.drop-after::after{top:auto;bottom:5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- interaction polish (hover, press, focus) ---------- */
:where(button,input,select,textarea):focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.nbtn,.tbtn,.abtn,.navbtn,.mini,.zadd,.railfoot button,.mtabs button,#strip button,#qb,.fadd button,.mrow button,.box,.sbox,.cell,#qd,.task{
  transition:transform .16s cubic-bezier(.33,1.35,.6,1),box-shadow .22s ease,background-color .18s ease,background-position .5s ease,border-color .18s ease,color .18s ease,opacity .2s ease}
/* press glow */
.nbtn,.tbtn,.abtn,.navbtn,.railfoot button,#strip button,#qb,.fadd button,.mrow button{position:relative;overflow:hidden}
.nbtn::after,.tbtn::after,.abtn::after,.navbtn::after,.railfoot button::after,#strip button::after,#qb::after,.fadd button::after,.mrow button::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transform:scale(.55);
  background:radial-gradient(closest-side at 50% 50%,rgba(var(--ink-rgb),.18),transparent 92%);
  transition:opacity .5s ease,transform .5s ease}
#qb::after,.fadd button::after,.mrow button.pri::after,.nbtn.solid::after,#strip button.on::after{
  background:radial-gradient(closest-side at 50% 50%,rgba(var(--pearl-rgb),.55),transparent 92%)}
.nbtn:active::after,.tbtn:active::after,.abtn:active::after,.navbtn:active::after,.railfoot button:active::after,#strip button:active::after,#qb:active::after,.fadd button:active::after,.mrow button:active::after{
  opacity:1;transform:scale(1.9);transition:opacity 0s,transform 0s}
/* sheen + gradient drift on primary buttons (the sheen layer is a theme choice:
   the flat theme sets it to none and the layered background collapses to a plain fill) */
#qb,.fadd button,.mrow button.pri{
  background-image:var(--sheen),var(--grad);
  background-size:100% 100%,170% 170%;background-position:0 0,0% 50%}
.nbtn.solid,#strip button.on{background-image:var(--sheen2)}
/* hover: pointer devices only, so phones never get sticky hover states */
@media (hover:hover){
  .nbtn:hover,.tbtn:hover,.railfoot button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(var(--shd-rgb),.18)}
  .abtn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(var(--shd-rgb),.14)}
  .abtn.del:hover{background:var(--navy);border-color:var(--navy);color:var(--on)}
  .navbtn:hover{transform:translateX(3px)}
  .navbtn.on:hover{transform:none}
  .zadd:hover{background:rgba(var(--ink-rgb),.07)}
  .mini:hover{transform:scale(1.15)}
  .box:hover{transform:scale(1.12)}
  .sbox:hover{transform:scale(1.12);border-color:var(--done)}
  .mtabs button:hover{color:var(--navy)}
  #qb:hover,.fadd button:hover,.mrow button.pri:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(var(--shd-rgb),.3);background-position:0 0,100% 50%}
  .nbtn.solid:hover{box-shadow:0 6px 16px rgba(var(--shd-rgb),.35)}
  .cell:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(var(--shd-rgb),.12)}
  .task:hover{box-shadow:0 4px 12px rgba(var(--shd-rgb),.14)}
  #qd:hover,.acts select:hover{border-color:var(--line2)}
}
/* press feedback: every device */
.nbtn:active,.tbtn:active,.railfoot button:active,.mtabs button:active{transform:scale(.95)}
.abtn:active{transform:scale(.93)}
.navbtn:active{transform:scale(.97)}
.zadd:active{transform:scale(.98);background:rgba(var(--ink-rgb),.09)}
.mini:active{transform:scale(.9)}
.box:active,.sbox:active{transform:scale(.86)}
#qb:active,.fadd button:active,.mrow button:active,#strip button:active{transform:scale(.94)}
.task:active{transform:scale(.99)}
#toast{bottom:calc(22px + env(safe-area-inset-bottom))}
/* ---------- mobile polish: bigger targets, softer depth, cleaner strip ---------- */
@media (max-width:900px){
  .navbtn,#strip button{min-height:42px}
  .nbtn{min-height:40px}
  #qb{min-height:48px}
  .fadd button{min-height:40px}
  .mrow button{min-height:44px}
  .abtn{min-height:34px;padding:6px 11px}
  /* tab header controls get a real tap target, without touching the subtask minis */
  .backlog .colhead .mini{min-width:34px;min-height:34px;font-size:13px}
  /* the action bar wraps rather than overflowing, so nothing in it may outgrow the card */
  .acts{gap:5px}
  .acts input[type=date],.acts select{max-width:100%}
  .tbtn{min-height:36px}
  /* carry tray: the task reads on its own line so the triage buttons stay tappable */
  .trayhead .acts{margin-left:0;width:100%}
  .trayhead .acts .tbtn{flex:1}
  .trayitem{flex-wrap:wrap;gap:6px;padding:8px 0}
  .trayitem .t{flex:1 1 100%;order:-1}
  .trayitem .tbtn{flex:1}
  .trayitem .tbtn:last-child{flex:none;min-width:46px}
  /* bin rows: the item takes its own line so Restore stays tappable */
  .binrow{flex-wrap:wrap}
  .binrow .bt{flex:1 1 100%}
  .binrow .nbtn{flex:1;min-height:40px}
  .box{width:20px;height:20px;border-radius:7px}
  .sbox{width:17px;height:17px}
  .task{padding:10px 11px}
  .col{box-shadow:0 2px 6px rgba(var(--shd-rgb),.1),0 12px 26px rgba(var(--shd-rgb),.12)}
  .zadd{border:1px dashed rgba(var(--ink-rgb),.3);border-radius:9px;text-align:center;padding:9px 8px;color:var(--mut)}
  /* 16px keeps the browser from zooming the page when the field takes focus */
  .zaddrow input{font-size:16px;padding:9px 10px;min-height:44px}
  .zaddrow .abtn{min-height:44px}
  /* the day strip used to opt out of scrollbars entirely. It no longer does: one
     mechanism, no exceptions, so the strip fades its bar in and out like everything
     else. Its padding drops by the gutter it now reserves, so the row is the same
     height it always was. */
  #strip{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:0}
  #strip button{scroll-snap-align:start}
  #main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .colhead{padding:12px 13px 10px}
  .badge{box-shadow:0 2px 6px rgba(var(--shd-rgb),.18)}
}

/* Touch targets. On a coarse pointer every control offers a finger at least 44px in
   its smallest dimension. Two mechanisms: controls drawn small on purpose (tick boxes,
   the mini glyphs, inline rename text) keep their drawn size and grow an invisible hit
   area through an absolutely positioned ::before; the press-glow classes clip their
   overflow so a ::before cannot escape them, and replaced elements cannot host one at
   all, so those grow for real. Fine-pointer layouts are untouched. Kept last in the
   stylesheet so it wins equal-specificity ties against the width media block above. */
@media (pointer:coarse){
  .box,.sbox,.mini,.hday,.zadd,.ttl,.st,.hname,.fdone,.mtabs button,#railtoggle,
  .ftxt span[data-action],.toast button{position:relative}
  /* Overlays are biased downward: a positioned element always beats an earlier
     sibling's overlay at its own centre, so room taken BELOW a control can never
     steal the next row's taps, while room taken above a dense row can. */
  .box::before{content:'';position:absolute;inset:-5px -14px -23px}
  .sbox::before{content:'';position:absolute;inset:-6px -15px -24px}
  .mini::before{content:'';position:absolute;inset:-4px -13px -22px}
  .hday::before{content:'';position:absolute;inset:-10px}
  .mtabs button::before{content:'';position:absolute;inset:-13px}
  #railtoggle::before{content:'';position:absolute;inset:-9px}
  .zadd::before{content:'';position:absolute;inset:-10px 0}
  .ttl::before{content:'';position:absolute;inset:-4px 0 -22px}
  .hname::before{content:'';position:absolute;inset:-4px 0 -21px}
  .st::before,.ftxt span[data-action]::before,.fdone::before{content:'';position:absolute;inset:-5px 0 -24px}
  .toast button::before{content:'';position:absolute;inset:-12px -4px}
  /* the rail habit cells sit directly under their name-and-tools line, so they must
     not reach up into it; the room below belongs to the next habit's own controls */
  .hrcells .box::before{inset:-8px -12px -16px}
  /* collapsible panel headers: a thin row of text, so grow a downward-biased overlay;
     the row below is either card padding (collapsed) or a row whose own controls are
     positioned and therefore win their centres */

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='agora_dayplanner_v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const iso=d=>{const t=new Date(d);t.setHours(12,0,0,0);return t.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const plus=(n,from)=>{const d=new Date((from||today())+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
/* the Monday a date's week started; the key habits and the weekly list hang history on */
const hweek=d=>{const x=new Date((d||today())+'T12:00:00');
  x.setDate(x.getDate()-((x.getDay()+6)%7)); return iso(x)};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZONES=['must','should','extra'];
const ZL={must:'Prio 0',should:'Prio 1',extra:'Extra'};
const ZSHORT={must:'0',should:'1',extra:'E'};
const ZC={must:'var(--must)',should:'var(--should)',extra:'var(--extra)'};
const LOCK=`<svg class="lk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.4" y="7.2" width="9.2" height="6.2" rx="1.5"/><path d="M5.5 7.2V5.4a2.5 2.5 0 0 1 5 0v1.8"/></svg>`;
/* the one collapse chevron, shared by every collapsible panel header */
const CHEV=open=>'<svg class="chev'+(open?' open':'')+'" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';

/* ================= state ================= */
/* ui.peek: which EMPTY panels the user has opened to add something. Not persisted:
   an empty panel starts collapsed on every load, and the flag is dropped the moment
   the panel holds an item, so emptying it later starts collapsed again. */
let state=null, ui={sel:null,adding:null,addText:'',drag:null,cancelEdit:false,renderKey:'',peek:{},northOn:false,noteQ:'',
                    noteHist:null};

function fresh(){
  return {
    ver:2, days:{}, carry:[], focus:[], tomb:{}, bin:{},
    floats:[{id:uid(),name:'Inbox',tasks:[]},{id:uid(),name:'Ideas',tasks:[]}],
    /* habits: a commitment band apart from the day plan. list holds the habit rows,
       marks holds every week's ticks keyed by the Monday that week started */
    habits:{list:[],marks:{}},
    /* week: the flat sometime-this-week list. list is live; at Monday 00:00 the
       ticked items graduate into hist under the week that closed, unticked stay */
    week:{list:[],hist:{}},
    /* notes: title and body. The body is ONE string on the dn axis: plain text, or
       a small sanitized HTML subset once formatting is used (see the rich engine by
       renderNotes). pinned:true rides pos; pg ('ruled'|'dot') rides up with the title.
       A note's `folder` (a folder id, or absent for the loose list) is PLACEMENT,
       so it rides pos beside pinned: it composes with a concurrent title or body
       edit exactly as pinning does, and cannot revive a deleted note. */
    notes:[],
    /* folders: one flat level of note groups, merged item by item like float tabs.
       A folder OWNS no notes: notes point at it by id, so deleting it can never
       delete them (rebuild drops dead references and the notes fall back loose). */
    folders:[],
    /* the sticky note: ONE shared block of text, not an id'd item. It merges as a
       whole by its own `at` stamp, written at the keystroke, so the unstamped-
       debounce window that once bit note bodies cannot exist for it. Same honest
       limit a note body has: two devices editing it concurrently resolve by
       later-at-wins, whole text, the loser silently gone. */
    sticky:{text:'',at:0},
    settings:{view:'board',boardOffset:0,floatMode:false,activeFloat:null,
      calSel:null,calOffset:0,mRange:'day',stripDay:null,lastRoll:null,showDone:false,
      /* todayOnly: the board draws today's column alone. A per-device view preference
         beside habitsOpen and weekOpen, on VIEWSET so a Pull cannot import another
         screen's mode, and outside stateSig like every other setting.
         trayOpen: whether the carry tray shows its items or only its header bar. The
         same contract, with the opposite default: a tray arrives COLLAPSED, so a new
         carry never takes the top of the board, and rollover re-collapses it whenever
         it moves something in (the fresh-arrival rule). Opening persists on this
         device until the tray empties, so a mid-triage reload keeps it open. */
      habitsOpen:true,weekOpen:true,todayOnly:false,lastWeek:null,noteSel:null,
      trayOpen:false}
  };
}

/* ================= per item change tracking =================
   Every task, subtask, float tab and focus item carries `up`, the moment it last
   changed on some device. Ids that go away are recorded in state.tomb with the moment
   they went. Sync merges those two maps id by id, so two devices that each add
   something keep both instead of one blob replacing the other. */
const LEGACY_UP=1;            /* stamp for anything saved before per item timestamps */
const TOMB_KEEP=45*864e5;     /* a deletion is remembered for 45 days, then forgotten */
const BIN_KEEP=30*864e5;      /* a binned item waits 30 days; shorter than TOMB_KEEP, so
                                 the record of the deletion always outlives the body */
const upOf=o=>{ const n=+(o&&o.up); return isFinite(n)&&n>0?n:LEGACY_UP };
/* `pos` is the second stamp: when this item last MOVED, as opposed to `up`, when its
   content last changed. Anything written before the split has no pos, so it falls back
   to up and behaves exactly as it did. */
const posOf=o=>{ const n=+(o&&o.pos); return isFinite(n)&&n>0?n:upOf(o) };
/* `dn` is the third stamp: when the item was last ticked or unticked. Ticking is the
   commonest edit and used to share a stamp with the title, so a rename on one device
   silently discarded a tick made on the other. Legacy items have no dn and fall back
   to up, exactly as they behaved before the split. */
const dnOf=o=>{ const n=+(o&&o.dn); return isFinite(n)&&n>0?n:upOf(o) };
const locKey=l=>l.kind==='day'?('day:'+l.date+':'+l.zone):l.kind==='float'?('float:'+l.fid):'carry';
const arr=x=>Array.isArray(x)?x:[];
/* Which fields belong to which stamp. The three are merged independently, so reordering a
   zone cannot outrank someone else's rename, a rename cannot drag a task out of the place
   someone else moved it to, and neither can undo a tick.
   `from` (the carry-over origin label) is positional: rollover writes it as part of the
   move, and triage clears it as part of moving the task out.
   `doneAt` rides with `done`, since setting a focus statement aside is what writes it. */
/* A note has no tick, so its dn axis carries the body instead: a rename on one device
   and a body edit on another then compose instead of one discarding the other. Two
   devices editing the same BODY still resolve by later-dn-wins, whole body, loser
   silently gone; that data-loss case is real and documented, not solved.
   A note's `pinned` flag is positional: pinning says where the note sits (the top of
   the list), so it rides pos, composes with a title edit (up) and a body edit (dn)
   made elsewhere, and, exactly like a move, cannot revive a deleted note.
   A note's `pg` (page appearance: ruled, dotted or absent for blank) rides the
   content axis beside the title, the way a habit's schedule rides beside its name:
   it is authored presentation, not placement, and it must never sit on dn or a page
   flip on one device would take the whole body with it against an edit elsewhere.
   The known cost: a page flip and a title rename made concurrently on two devices
   resolve by later-up-wins-both, the same small-payload rule habits already accept. */
/* A folder is the plainest kind there is: its name on content, nothing on dn
   (like a float tab), its list order on pos. A note's `folder` sits on the pos
   axis beside `pinned` and `ord`: moving a note into or out of a folder is
   saying where it sits, so it composes with a title edit (up) and a body edit
   (dn) made elsewhere, two concurrent moves resolve by later-pos-wins whole
   placement, and a move can never revive a deleted note, because tombstones
   are compared against up and dn only. */
const CONTENTF={float:['name'],task:['title'],sub:['title'],focus:['title'],habit:['name','days'],wtask:['title'],note:['title','pg'],folder:['name']};
const DONEF={float:[],task:['done'],sub:['done'],focus:['done','doneAt'],habit:[],wtask:['done'],note:['body'],folder:[]};
const POSF={float:['ord'],task:['loc','ord','from'],sub:['pid','ord'],focus:['ord'],habit:['ord'],wtask:['ord'],note:['ord','pinned','folder'],folder:['ord']};
/* A habit's ticks do not live on the item at all: they sit in habits.marks as one
   timestamped cell per week and day, merged by union, so a Monday tick on one device
   and a Wednesday tick on another can never compete. The item's dn stamp still moves
   when its marks change (sigD below hashes them), carrying no fields; it exists only
   so that ticking a habit asserts it should exist, the same revival rule tasks have. */

/* one walk over every mergeable item in a state, in a stable order */
function eachItem(s,fn){
  arr(s.floats).forEach((f,i)=>{ if(f&&f.id) fn('float',f,{ord:i}) });
  arr(s.floats).forEach(f=>{ if(f&&f.id) arr(f.tasks).forEach((t,i)=>eachTask(t,{kind:'float',fid:f.id},i,fn)) });
  Object.keys(s.days||{}).sort().forEach(d=>ZONES.forEach(z=>
    arr((s.days[d]||{})[z]).forEach((t,i)=>eachTask(t,{kind:'day',date:d,zone:z},i,fn))));
  arr(s.carry).forEach((t,i)=>eachTask(t,{kind:'carry'},i,fn));
  arr(s.focus).forEach((f,i)=>{ if(f&&f.id) fn('focus',f,{ord:i}) });
  const hb=s.habits||{};
  arr(hb.list).forEach((x,i)=>{ if(x&&x.id) fn('habit',x,{ord:i,msig:marksSigFor(hb.marks,x.id)}) });
  arr(s.week&&s.week.list).forEach((x,i)=>{ if(x&&x.id) fn('wtask',x,{ord:i}) });
  arr(s.folders).forEach((x,i)=>{ if(x&&x.id) fn('folder',x,{ord:i}) });
  arr(s.notes).forEach((x,i)=>{ if(x&&x.id) fn('note',x,{ord:i}) });
}
/* a habit's marks across every week, in stable key order, for its dn signature */
function marksSigFor(marks,id){
  if(!marks||typeof marks!=='object') return '';
  return Object.keys(marks).sort().map(w=>{
    const m=(marks[w]||{})[id]; if(!m||typeof m!=='object') return '';
    return w+'('+Object.keys(m).sort().map(d=>d+':'+m[d]).join(',')+')';
  }).filter(Boolean).join(';');
}
function eachTask(t,loc,ord,fn){
  if(!t||!t.id) return;
  fn('task',t,{ord,loc});
  arr(t.subtasks).forEach((s,i)=>{ if(s&&s.id) fn('sub',s,{ord:i,pid:t.id}) });
}
/* what the item says, ignoring where it sits. Subtasks are not listed here: they carry
   their own records and their own parent id, so adding a step no longer restamps its
   parent and cannot outrank an edit made to that parent elsewhere. */
function sigC(kind,o){
  if(kind==='float') return 'F|'+(o.name||'');
  if(kind==='folder')return 'G|'+(o.name||'');
  if(kind==='habit') return 'H|'+(o.name||'')+'|'+arr(o.days).slice().sort((a,b)=>a-b).join(',');
  if(kind==='note')  return 'C|'+(o.title||'')+'|'+(o.pg||'');
  return 'C|'+(o.title||'');
}
/* whether it is ticked, on its own so a rename cannot outrank a tick.
   A note has no tick; its body rides this axis instead (see DONEF). */
function sigD(kind,o,m){
  if(kind==='float'||kind==='folder') return 'd|';
  if(kind==='habit') return 'd|'+((m&&m.msig)||'');
  if(kind==='focus') return 'd|'+(o.done?1:0)+'|'+(o.doneAt||'');
  if(kind==='note')  return 'd|'+(o.body||'');
  return 'd|'+(o.done?1:0);
}
/* where the item sits, ignoring what it says */
function sigP(kind,o,m){
  if(kind==='float') return 'f|'+m.ord;
  if(kind==='folder')return 'g|'+m.ord;
  if(kind==='focus') return 'x|'+m.ord;
  if(kind==='habit') return 'h|'+m.ord;
  if(kind==='wtask') return 'w|'+m.ord;
  if(kind==='note')  return 'n|'+m.ord+'|'+(o.pinned?1:0)+'|'+(o.folder||'');
  if(kind==='sub')   return 's|'+m.pid+'|'+m.ord;
  return 't|'+locKey(m.loc)+'|'+m.ord+'|'+(o.from||'');
}
/* the three signatures are kept apart rather than joined into one string, so no
   separator can ever collide with something a user typed into a title */
const sigOf=(kind,o,m)=>({c:sigC(kind,o),d:sigD(kind,o,m),p:sigP(kind,o,m)});
let sigMap={}, prevSnap=null;   /* prevSnap: the tree as of the last commit, so the bin
                                   can keep the body of whatever vanishes */
function snapSigs(){ const m={}; eachItem(state,(k,o,meta)=>{m[o.id]=sigOf(k,o,meta)}); sigMap=m }
/* called on every commit: whatever changed since the last one gets a fresh stamp,
   and whatever disappeared gets a tombstone. Covers every edit path, drag and Undo alike. */
/* `when` stamps this batch at a given moment instead of now. Rollover uses it to date
   its moves to midnight, so a device that wakes up late cannot out-stamp a triage
   another device already made. */
function stampChanges(when){
  const t=Date.now(), next={}, seen={};
  if(!state.tomb||typeof state.tomb!=='object') state.tomb={};
  if(!state.bin||typeof state.bin!=='object') state.bin={};
  eachItem(state,(k,o,meta)=>{
    const sg=sigOf(k,o,meta);
    next[o.id]=sg; seen[o.id]=1;
    if(state.tomb[o.id]!=null){                       /* brought back */
      delete state.tomb[o.id]; delete state.bin[o.id]; o.up=t; o.dn=t; o.pos=t; return;
    }
    const had=sigMap[o.id];
    if(had===undefined){
      if(!(+o.up>0)) o.up=t;
      if(!(+o.dn>0)) o.dn=dnOf(o);
      if(!(+o.pos>0)) o.pos=posOf(o);
    }else{
      if(had.c!==sg.c) o.up=when?Math.max(upOf(o),when):t;
      if(had.d!==sg.d) o.dn=when?Math.max(dnOf(o),when):t;
      if(had.p!==sg.p) o.pos=when?Math.max(posOf(o),when):t;
    }
  });
  const gone=Object.keys(sigMap).filter(id=>!seen[id]);
  gone.forEach(id=>{ state.tomb[id]=t });
  if(gone.length) binCapture(gone,seen,t);
  ui.skipBin=null; ui.binNote=null;
  Object.keys(state.tomb).forEach(id=>{ if(t-state.tomb[id]>TOMB_KEEP) delete state.tomb[id] });
  Object.keys(state.bin).forEach(id=>{
    if(t-state.bin[id].at>BIN_KEEP||state.tomb[id]==null) delete state.bin[id] });
  sigMap=next;
}
function stampLegacy(s){
  if(!s.habits||typeof s.habits!=='object'||!Array.isArray(s.habits.list)) s.habits={list:[],marks:{}};
  if(!s.habits.marks||typeof s.habits.marks!=='object') s.habits.marks={};
  if(!s.week||typeof s.week!=='object'||!Array.isArray(s.week.list)) s.week={list:[],hist:{}};
  if(!s.week.hist||typeof s.week.hist!=='object') s.week.hist={};
  if(!Array.isArray(s.notes)) s.notes=[];
  if(!Array.isArray(s.folders)) s.folders=[];
  if(!s.sticky||typeof s.sticky!=='object'||typeof s.sticky.text!=='string') s.sticky={text:'',at:0};
  eachItem(s,(k,o)=>{ if(!(+o.up>0)) o.up=LEGACY_UP;
    if(!(+o.dn>0)) o.dn=upOf(o); if(!(+o.pos>0)) o.pos=upOf(o) });
  if(!s.tomb||typeof s.tomb!=='object') s.tomb={};
  Object.keys(s.tomb).forEach(id=>{ if(!(+s.tomb[id]>0)) delete s.tomb[id] });
  if(!s.bin||typeof s.bin!=='object') s.bin={};
  Object.keys(s.bin).forEach(id=>{
    const e=s.bin[id];
    if(!e||typeof e!=='object'||!(+e.at>0)||(!e.purged&&(!e.body||typeof e.body!=='object')))
      delete s.bin[id];
  });
  return s;
}

/* ================= merge two planners, item by item ================= */
function flatten(s){
  const g={float:{},task:{},sub:{},focus:{},habit:{},wtask:{},note:{},folder:{}};
  eachItem(s,(k,o,m)=>{
    if(k==='float') g.float[o.id]={id:o.id,name:o.name||'',ord:m.ord,

async function cloudGet(k){
  if(typeof fetch!=='function') throw new Error('This browser cannot reach the cloud.');
  const url=SUPABASE_URL+'/rest/v1/'+SYNC_TABLE+'?select=data,updated_at&limit=1&sync_key=eq.'+encodeURIComponent(k);
  const res=await fetch(url,{headers:syncHeaders({'Accept':'application/json'}),cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text().catch(()=>'')).slice(0,120));
  const rows=await res.json();
  return (Array.isArray(rows)&&rows.length)?rows[0]:null;
}
async function cloudPut(k,data,when){
  if(typeof fetch!=='function') throw new Error('This browser cannot reach the cloud.');
  const res=await fetch(SUPABASE_URL+'/rest/v1/'+SYNC_TABLE,{
    method:'POST',
    headers:syncHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify([{sync_key:k,data:data,updated_at:when}])
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text().catch(()=>'')).slice(0,120));
  return true;
}
function netFail(e,manual){
  const m=String((e&&e.message)||e);
  const off=(navigator&&navigator.onLine===false)||
    /failed to fetch|networkerror|load failed|network request failed|cannot reach/i.test(m);
  syncSet(off?'offline':'error',off?'':m.slice(0,160));
  if(manual) toast(off?'No connection right now. Nothing was lost.':'Cloud said: '+m.slice(0,80));
  return off;
}

/* ---------- push ---------- */
function pushSoon(){
  if(!sync.key) return;
  sync.pending=true;
  clearTimeout(sync.pushT);
  sync.pushT=setTimeout(flushPush,1800);
}
function flushPush(){
  clearTimeout(sync.pushT);
  if(!sync.key||!sync.ready||!sync.pending||sync.state==='conflict') return;
  if(sync.busy){ sync.pushT=setTimeout(flushPush,1200); return }   /* a cycle is already out */
  /* an automatic push always reads the cloud and merges first, so it can never
     wipe out something the other device wrote while this one was editing */
  syncCycle({});
}
async function putState(manual){
  const when=new Date().toISOString();
  try{
    await cloudPut(sync.key,state,when);
    sync.pending=false; sync.ready=true;
    lsSet(SSTAMP_LS,when);
    syncSet('synced','sent at '+clock(when));
    if(manual) toast('Pushed to the cloud');
    return true;
  }catch(e){ netFail(e,manual); return false }
}
/* the Push button stays a straight overwrite, as a manual override */
async function pushNow(manual){
  if(!sync.key) return manual?(toast('Add a sync key first'),false):false;
  clearTimeout(sync.pushT);
  flushSave();                 /* send the sentence being typed, stamped as typed */
  syncSet('busy');
  return putState(manual);
}

/* ---------- pull ---------- */
async function pullNow(manual){
  if(!sync.key) return manual?(toast('Add a sync key first'),false):false;
  syncSet('busy');
  let row;
  try{ row=await cloudGet(sync.key) }
  catch(e){ netFail(e,manual); return false }
  if(!row){
    sync.ready=true;
    syncSet('synced','nothing saved under this key yet');
    if(manual) toast('Nothing is saved under that key yet');
    return false;
  }
  return applyCloud(row,manual);
}
function emptyPlanner(s){
  const days=s.days||{};
  const noDays=Object.keys(days).every(d=>ZONES.every(z=>!((days[d]||{})[z]||[]).length));
  return noDays&&!(s.carry||[]).length&&!(s.focus||[]).length&&!(s.notes||[]).length&&
    !(s.folders||[]).length&&!((s.sticky&&s.sticky.text)||'')&&
    (s.floats||[]).every(f=>!(f.tasks||[]).length);
}
function swapState(next){
  Object.keys(state).forEach(k=>{ delete state[k] });
  Object.assign(state,next);
}
/* read a copy that came off the wire, whatever version wrote it */
function readCloud(p){
  if(!p||typeof p!=='object'||(!p.days&&!p.floats)) return null;
  const f=fresh();
  const out={...f,...p,settings:{...f.settings,...(p.settings||{})}};   /* spread: unknown keys survive */
  if(!Array.isArray(out.floats)||!out.floats.length) out.floats=f.floats;
  if(!Array.isArray(out.carry)) out.carry=[];
  if(!Array.isArray(out.focus)) out.focus=[];
  if(!out.days||typeof out.days!=='object') out.days={};
  if(!out.habits||typeof out.habits!=='object'||!Array.isArray(out.habits.list))
    out.habits={list:[],marks:{}};
  if(!out.habits.marks||typeof out.habits.marks!=='object') out.habits.marks={};
  if(!out.week||typeof out.week!=='object'||!Array.isArray(out.week.list))
    out.week={list:[],hist:{}};
  if(!out.week.hist||typeof out.week.hist!=='object') out.week.hist={};
  if(!Array.isArray(out.notes)) out.notes=[];
  if(!Array.isArray(out.folders)) out.folders=[];
  if(!out.sticky||typeof out.sticky!=='object'||typeof out.sticky.text!=='string')
    out.sticky={text:'',at:0};
  return stampLegacy(out);
}
/* put a state on screen without letting the change look like a local edit */
function adopt(next){
  /* AN EMPTIED CARRY PUTS THE FLAG DOWN, wherever the emptying happened. Local triage
     already does it in its own handlers; this is the same rule for a carry emptied by
     somebody else, which is the only other way it can go: the other device triaged the
     lot and the merge brought that back here. Without it the flag stayed up from the
     session that opened the tray, and the NEXT carry to arrive by sync drew as the open
     list, taking the top of the board, which is exactly what the collapse contract
     exists to stop. One line in the single funnel every foreign state comes through
     (the sync cycle, a Pull, the undo of a Pull, and now another window on this same
     device), rather than four copies at four call sites. Presentation only: trayOpen is
     on VIEWSET and outside stateSig, so nothing here syncs or pushes. */
  if(next&&next.settings&&!arr(next.carry).length) next.settings.trayOpen=false;
  swapState(next);
  snapSigs();
  sync.applying=true; commit(); sync.applying=false;
  if(ui.sel&&!findTask(ui.sel)) ui.sel=null;
  ui.renderKey=''; render();
}
function applyCloud(row,announce){
  const p=readCloud(row&&row.data);
  if(!p){
    syncSet('error','the copy in the cloud could not be read');
    if(announce) toast('The cloud copy could not be read, so nothing was changed');
    return false;
  }
  flushSave();                 /* so the Undo backup holds what was being typed */
  const before=JSON.stringify(state);
  lsSet(SBACK_LS,before);
  const keep=state.settings;
  VIEWSET.forEach(k=>{ p.settings[k]=keep[k] });
  if(!p.floats.some(x=>x.id===p.settings.activeFloat)) p.settings.activeFloat=p.floats[0].id;

  adopt(p);
  sync.pending=false; sync.ready=true;
  lsSet(SSTAMP_LS,row.updated_at);
  syncSet('synced','pulled from '+clock(row.updated_at));
  ui.adding=null; ui.addText='';
  if(announce) toast('Pulled from the cloud',()=>{
    try{ adopt(stampLegacy(JSON.parse(before))) }catch(e){}
    lsSet(SSTAMP_LS,new Date().toISOString());
    pushSoon();
  });
  return true;
}

/* ---------- the second window on this same device ----------
   localStorage is shared by every tab on the origin, and until now each tab held its
   own copy of the tree in memory and wrote the whole thing back on its next commit.
   Two windows open on one machine were therefore a silent last-writer-wins: whatever
   the second tab had loaded overwrote whatever the first had done since, and with the
   two axes composing on the way back through the cloud it was one of the two ways a
   done task reached the carry tray (Section 21).
   The event fires in the OTHER tabs only, never in the one that wrote, so this cannot
   loop: the tab that receives it merges, and if the merge changes nothing (it will not,
   once both hold the same tree) it writes nothing back. It is the SAME adopt path
   syncCycle uses and for the same reasons: flushSave() first, so this tab's own
   unstamped keystrokes carry their real moment into the merge rather than the previous
   commit's, and mergeStates rather than a replace, so neither side's work is dropped.
   rebuild() keeps this device's own settings, so the incoming tab's view, its rail, its
   tray and its selected note never travel either. */
window.addEventListener('storage',e=>{
  if(!e||e.key!==KEY||e.newValue==null) return;
  let p=null;
  try{ p=readCloud(JSON.parse(e.newValue)) }catch(err){ return }
  if(!p) return;
  flushSave();                    /* the unstamped-window rule, exactly as in syncCycle */
  const before=stateSig(state);
  const merged=mergeStates(state,p);
  if(stateSig(merged)===before) return;   /* nothing of theirs we do not already hold */
  adopt(merged);                  /* a foreign render: it restores the caret and focus */
});

/* ---------- the automatic cycle: read the cloud, merge item by item, write back ----------
   Runs on load, on focus, on reconnect, on a timer, and a moment after any edit. */
async function syncCycle(opts){
  opts=opts||{};
  if(!sync.key||sync.busy) return false;
  if(sync.state==='conflict'&&!opts.force) return false;
  sync.busy=true;
  syncSet('busy');
  let row=null;
  try{ row=await cloudGet(sync.key) }
  catch(e){ sync.busy=false; sync.ready=true; netFail(e,opts.manual); return false }
  try{
    sync.checked=Date.now();
    if(!row){                                   /* first device on this key */
      sync.ready=true; sync.pending=true;
      const ok=await putState(opts.manual);
      sync.busy=false; return ok;
    }
    const theirs=readCloud(row.data);
    if(!theirs){
      sync.ready=true; syncSet('error','the copy in the cloud could not be read');
      sync.busy=false; return false;
    }
    if(!lsGet(SSTAMP_LS)&&!emptyPlanner(state)&&!emptyPlanner(theirs)){
      /* this device has never agreed with the cloud and both hold a planner, so do not guess */
      sync.ready=true; sync.busy=false; syncSet('conflict');
      refreshSyncModal();
      toast('Sync: this device and the cloud both hold a planner. Open Sync to choose.');
      return false;
    }
    /* AFTER the round trip, not before it: the read is awaited, so anything typed
       while the cloud copy was in flight would otherwise reach the merge unstamped */
    flushSave();
    const before=stateSig(state);
    const merged=mergeStates(state,theirs);
    const after=stateSig(merged);
    if(after!==before){ adopt(merged); if(opts.announce) toast('Updated from your other device') }
    sync.ready=true;
    if(after!==stateSig(theirs)){             /* the cloud is missing something this device holds */
      sync.pending=true;
      const ok=await putState(false);
      sync.busy=false; return ok;
    }
    sync.pending=false;
    lsSet(SSTAMP_LS,row.updated_at);
    syncSet('synced','up to date');
    sync.busy=false; return true;
  }catch(e){
    sync.busy=false; sync.ready=true; netFail(e,opts.manual); return false;
  }
}
function recheck(){
  if(!sync.key||!sync.ready||sync.busy||sync.state==='conflict') return;
  if(Date.now()-sync.checked<RECHECK_MS) return;
  syncCycle({announce:true});
}
/* while the app is open, notice what the other device did */
setInterval(()=>{
  if(typeof document!=='undefined'&&document.hidden) return;
  if(!sync.key||!sync.ready||sync.busy||sync.state==='conflict') return;
  if(Date.now()-sync.checked<POLL_MS-2000) return;
  syncCycle({announce:true});
},POLL_MS);

/* ---------- connect / disconnect ---------- */
async function connectKey(raw){
  const k=String(raw||'').trim();
  if(!k){ toast('Paste a key, or press Generate'); return }
  sync.key=k; lsSet(SKEY_LS,k); lsDel(SSTAMP_LS);
  sync.ready=false; sync.pending=false; sync.checked=0;
  syncSet('busy');
  let row;
  try{ row=await cloudGet(k) }
  catch(e){ sync.ready=true; netFail(e,true); refreshSyncModal(); return }
  if(!row){
    sync.ready=true; sync.pending=true;
    await pushNow(false);
    toast('Key saved. This device is now the cloud copy.');
    refreshSyncModal(); return;
  }
  if(emptyPlanner(state)){ applyCloud(row,false); toast('Key saved. Your planner came down from the cloud.'); refreshSyncModal(); return }
  sync.ready=true; syncSet('conflict');
  toast('That key already holds a planner. Choose Pull or Push.');
  refreshSyncModal();
}
function forgetKey(){
  clearTimeout(sync.pushT);
  sync.key=''; sync.pending=false; sync.ready=true; sync.checked=0;
  lsDel(SKEY_LS); lsDel(SSTAMP_LS);
  syncSet('off');
  toast('Sync turned off here. Your tasks stay on this device.');
  refreshSyncModal();
}

function syncBoot(){
  sync.key=lsGet(SKEY_LS)||'';
  if(!sync.key){ sync.ready=true; sync.state='off'; return }
  sync.state='idle';
  syncCycle({});
}
window.addEventListener('online',()=>{
  if(!sync.key) return;
  clearTimeout(sync.pushT); sync.checked=0;
  syncCycle({announce:true});      /* back on a network: catch up both ways at once */
});
window.addEventListener('offline',()=>{ if(sync.key&&sync.state!=='conflict') syncSet('offline') });

/* ================= theme =================
   A theme is a set of CSS custom property values keyed off html[data-theme];
   switching is one attribute write, so it applies in the same frame with no
   reload. The choice is a DEVICE preference: it lives in its own localStorage
   key, never in state, so it cannot sync, ride an export, or reach the merge.
   A tiny head script applies the stored theme before first paint (no flash);
   this section is the running app's half: the switch UI and the meta update.
   The PWA meta theme-color follows the active theme; the manifest's colours
   cannot (a manifest is one static file read at install time), so an installed
   app's splash stays cloud blue whatever the theme. */
const THEME_LS='agora_dayplanner_theme';
const THEMES={
  sky:{label:'Cloud blue',tc:'#CFE3F1'},
  mono:{label:'Monochrome',tc:'#070708'}
};
function themeGet(){ return lsGet(THEME_LS)==='mono'?'mono':'sky' }
function themeApply(t){
  if(t==='mono') document.documentElement.setAttribute('data-theme','mono');
  else document.documentElement.removeAttribute('data-theme');
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',(THEMES[t]||THEMES.sky).tc);
}
function themeSet(t){
  t=THEMES[t]?t:'sky';
  lsSet(THEME_LS,t); themeApply(t); refreshThemeModal();
}

/* ---------- the rail's collapsed state ----------
   Same contract as the theme, deliberately: device chrome in its OWN localStorage key,
   never a field on `state`, so it cannot reach `stateSig`, cannot trigger a push, and
   cannot arrive from another device. One machine hiding its rail says nothing about
   any other. Purely a CSS switch, so nothing needs re-rendering when it flips. */
const RAIL_LS='agora_dayplanner_rail';
function railOpen(){ return lsGet(RAIL_LS)!=='off' }
function railApply(open){
  const r=document.documentElement;
  if(open) r.removeAttribute('data-rail'); else r.setAttribute('data-rail','off');
}
function railSet(open){ lsSet(RAIL_LS,open?'on':'off'); railApply(open); }
function themeBody(){
  const cur=themeGet();
  const opt=t=>'<button class="nbtn'+(cur===t?' solid':'')+'" style="flex:1" data-action="theme-set" data-t="'+t+
    '" aria-pressed="'+(cur===t?'true':'false')+'">'+THEMES[t].label+'</button>';
  return '<h3>Theme</h3>'+
    '<p>How this device paints the planner. Two themes, same app: layout, spacing and every feature are identical, only colour and type change.</p>'+
    '<div class="syncrow">'+opt('sky')+opt('mono')+'</div>'+
    '<p class="synchint">Cloud blue is the original palette. Monochrome is near-black and near-white greys with one red accent and dot-matrix numerals.</p>'+
    '<p class="synchint">The choice stays on this device. It is a screen preference, not planner content, so it never syncs and never rides an export.</p>'+
    '<div class="mrow"><button class="pri" data-action="mclose" data-close="1">Done</button></div>';
}
function themeModal(){
  $('#modalRoot').innerHTML='<div class="mback" data-action="mclose"><div class="modal" id="themeModal">'+
    themeBody()+'</div></div>';
}

/* ================= data ops ================= */
function day(d){
  if(!state.days[d]) state.days[d]={must:[],should:[],extra:[]};
  ZONES.forEach(z=>{if(!Array.isArray(state.days[d][z])) state.days[d][z]=[]});
  return state.days[d];
}
/* the same shape for a caller that only wants to LOOK at a day. day() above creates
   the entry as a side effect, which is right when something is about to be put in it
   and wrong everywhere else: a render that asks for an empty day must not leave one
   behind in state.days. Returns a throwaway when the day does not exist. */
function dayRead(d){
  const x=state.days[d];
  if(!x) return {must:[],should:[],extra:[]};
  const out={};
  ZONES.forEach(z=>{ out[z]=Array.isArray(x[z])?x[z]:[] });
  return out;
}
function mkTask(title){return {id:uid(),title:title.trim(),done:false,subtasks:[],up:Date.now()}}
function float(id){return state.floats.find(f=>f.id===id)}
function activeFloat(){return float(state.settings.activeFloat)||state.floats[0]}

function findTask(id){
  for(const d in state.days) for(const z of ZONES){
    const i=state.days[d][z].findIndex(t=>t.id===id);
    if(i>-1) return {task:state.days[d][z][i],from:{kind:'day',date:d,zone:z},index:i};
  }
  for(const f of state.floats){
    const i=f.tasks.findIndex(t=>t.id===id);
    if(i>-1) return {task:f.tasks[i],from:{kind:'float',fid:f.id},index:i};
  }
  const i=state.carry.findIndex(t=>t.id===id);
  if(i>-1) return {task:state.carry[i],from:{kind:'carry'},index:i};
  return null;
}
function pull(id){
  const f=findTask(id); if(!f) return null;
  const {from,index}=f;
  if(from.kind==='day') state.days[from.date][from.zone].splice(index,1);
  else if(from.kind==='float') float(from.fid).tasks.splice(index,1);
  else state.carry.splice(index,1);
  return f.task;
}
function place(task,dest,at){
  if(dest.kind==='day'){
    const arr=day(dest.date)[dest.zone];
    arr.splice(at==null?arr.length:at,0,task);
  }else if(dest.kind==='float'){
    const f=float(dest.fid)||state.floats[0];
    f.tasks.splice(at==null?f.tasks.length:at,0,task);
  }else state.carry.push(task);
}
function move(id,dest,at){
  const t=pull(id); if(!t) return;
  place(t,dest,at); ui.flash=id;
}
/* Tab order is nothing but the floats array order, exactly like task order in a zone,
   so it rides the existing pos stamp: stampChanges sees each tab's ord change and
   bumps pos, and the merge resolves order on that axis without a new field. */
function reorderTab(fid,targetFid,after){
  const i=state.floats.findIndex(f=>f.id===fid); if(i<0) return false;
  const moved=state.floats.splice(i,1)[0];
  let j=state.floats.findIndex(f=>f.id===targetFid);
  if(j<0){ state.floats.splice(i,0,moved); return false }
  if(after) j++;
  state.floats.splice(j,0,moved);
  return true;
}

/* rollover: unfinished tasks from past days go to the carry tray */
function rollover(){
  const t=today(); let moved=0;
  for(const d of Object.keys(state.days)){
    if(dayDiff(d,t)<=0) continue;
    for(const z of ZONES){
      const keep=[];
      for(const task of state.days[d][z]){
        if(task.done) keep.push(task);
        else{ task.from=ZL[z]+' · '+DOW[new Date(d+'T12:00:00').getDay()]; state.carry.push(task); moved++ }
      }
      state.days[d][z]=keep;
    }
  }
  state.settings.lastRoll=t;
  /* a fresh arrival lands COLLAPSED, whatever the flag held: the tray announces
     itself as a bar and the board keeps its top. Per-device presentation only. */
  if(moved) state.settings.trayOpen=false;
  return moved;
}
/* Monday sweep for the weekly list: ticked items graduate into week.hist under the week
   that just closed, unticked ones simply stay in the list, which IS the carry. The
   archived ids leave the tree, so the normal diff tombs them and another device's stale
   ticked copy cannot bring them back, but they skip the bin: finishing a week is not a
   deletion. A device off for several weeks archives everything under the last week it
   saw, an approximation accepted over tracking a tick date per item. */
function weekSweep(){
  const closing=state.settings.lastWeek||plus(-7,hweek());
  const done=arr(state.week.list).filter(t=>t.done);
  if(done.length){
    const h=state.week.hist[closing]=state.week.hist[closing]||[];
    done.forEach(t=>{ if(!h.some(x=>x.id===t.id)) h.push({id:t.id,title:t.title,at:dnOf(t)}) });
    ui.skipBin=(ui.skipBin||[]).concat(done.map(t=>t.id));
    state.week.list=state.week.list.filter(t=>!t.done);
  }
  state.settings.lastWeek=hweek();
}

/* The day can turn while the app is still open, and a phone keeps this app running for
   days at a time, so checking only at launch meant the tray never appeared for anyone
   who does not close it. Checked at launch, whenever the app comes back to the front,
   and on a slow timer, so it fires with or without cloud sync.
   Moves are dated to midnight of the new day rather than the moment the check runs, so a
   device that opens late cannot out-stamp a triage another device already made. */
/* unfinished tasks sitting on days already past, which rollover has not swept up because
   it runs once a day and has already run. Drives the board nav affordance. */
function pastOpenCount(){
  const t=today(); let n=0;
  for(const d in state.days){
    if(dayDiff(d,t)<=0) continue;
    ZONES.forEach(z=>{ n+=arr(state.days[d][z]).filter(x=>x&&!x.done).length });
  }
  return n;
}
function rollIfNewDay(opts){
  opts=opts||{};
  if(!state) return 0;
  const dayDue=state.settings.lastRoll!==today();
  const weekDue=state.settings.lastWeek!==hweek();
  if(!dayDue&&!weekDue) return 0;
  flushSave();                        /* pending edits keep their own moment */
  const midnight=new Date(today()+'T00:00:00').getTime();
  const n=dayDue?rollover():0;
  /* TODAY ONLY HAS TO KEEP MEANING TODAY. The single column branch returns the
     absolute stripDay, so a device left open across midnight in the mode went on
     drawing YESTERDAY: the date is past, the column takes the .past treatment and
     loses the TODAY badge, and nothing on screen says why. The mode's NAME is its
     contract, so it re-centres whatever day was being looked at, a stepped-to one
     included: "Today only" showing Thursday because you stepped forward on Wednesday
     is the same broken promise as it showing yesterday. Through showDay, never a
     write to boardOffset or stripDay, so the two halves of the board position stay in
     step at every width. Guarded on todayOnlyOn(), not on the raw flag: under 900px
     the board is a single day strip that is navigation rather than a mode, and moving
     a phone user's strip day at midnight would be a second mechanism.
     rollIfNewDay is the only owner: it is the one path that notices the date has
     turned (launch, foreground, and the 60 second timer all arrive through it), and
     no render may mutate the position it is drawing. */
  if(dayDue&&todayOnlyOn()) showDay(today());
  if(weekDue) weekSweep();
  commit(midnight);
  if(n&&!opts.quiet){
    const say=()=>toast(n+' carried over from before');
    opts.delay?setTimeout(say,400):say();
  }
  if(!opts.boot){ ui.renderKey=''; render() }
  return n;
}

/* ================= recycle bin =================
   The safety net behind the 5 second Undo. stampChanges hands binCapture every id that
   vanished from the tree since the last commit, so every deletion path is covered in one
   place: day and float tasks, subtasks, tabs, focus items, tray dismissals, and whatever
   an import drops. An entry lives beside the tombstone for the same id and never longer
   than it, so the record of a deletion always outlives the body it kept. */
function binCapture(gone,alive,t){
  if(!prevSnap) return;
  const skip={}; (ui.skipBin||[]).forEach(id=>{skip[id]=1});
  const note=ui.binNote||{};
  const dead={}; gone.forEach(id=>{dead[id]=1});
  const idx={};
  eachItem(prevSnap,(k,o,meta)=>{ idx[o.id]={k:k,o:o,meta:meta} });
  gone.forEach(id=>{
    if(skip[id]) return;                       /* a conversion, not a delete */
    const hit=idx[id]; if(!hit) return;
    const k=hit.k, meta=hit.meta;
    /* children ride inside the container they died with, not as rows of their own */
    if(k==='sub'&&dead[meta.pid]) return;
    if(k==='task'&&meta.loc.kind==='float'&&dead[meta.loc.fid]) return;
    const e={k:k,at:t,body:JSON.parse(JSON.stringify(hit.o))};
    if(k==='task'){
      e.loc=meta.loc;
      e.body.subtasks=arr(e.body.subtasks).filter(x=>x&&dead[x.id]);
    }
    if(k==='sub'){
      e.pid=meta.pid;
      const p=idx[meta.pid]; e.pname=p?String(p.o.title||''):'';
    }
    if(k==='float'){
      e.body.tasks=arr(e.body.tasks).filter(x=>x&&dead[x.id]);
      if(note[id]&&Array.isArray(note[id].moved)) e.moved=note[id].moved.slice();
    }
    /* a folder never takes notes with it (they only point at it), but the ids it
       held ride along so a Restore can gather them back, the way a tab's do */
    if(k==='folder'&&note[id]&&Array.isArray(note[id].moved)) e.moved=note[id].moved.slice();
    state.bin[id]=e;
  });
}
function binList(){
  return Object.keys(state.bin).map(id=>({id:id,e:state.bin[id]}))
    .filter(x=>!x.e.purged).sort((a,b)=>b.e.at-a.e.at);
}
function paintBin(){
  const b=$('#binBtn'); if(!b) return;
  const n=binList().length;
  b.textContent=n?'Bin · '+n:'Bin';
}
function restoreBin(id){
  const e=state.bin[id]; if(!e||e.purged) return;
  delete state.bin[id];
  const b=JSON.parse(JSON.stringify(e.body)); let dest='';
  if(e.k==='task'){
    const l=e.loc||{kind:'carry'};
    if(l.kind==='day'&&l.date){
      const z=ZONES.indexOf(l.zone)>-1?l.zone:'must';
      place(b,{kind:'day',date:l.date,zone:z});
      dest=ZL[z]+' on '+DOW[new Date(l.date+'T12:00:00').getDay()]+' '+l.date;
    }else if(l.kind==='float'){
      const f=float(l.fid);
      place(b,{kind:'float',fid:f?f.id:state.floats[0].id});
      dest=f?'the "'+f.name+'" tab':'the "'+state.floats[0].name+'" tab, since its old tab is gone';
    }else{ state.carry.push(b); dest='the carry-over tray' }
  }else if(e.k==='sub'){
    const p=findTask(e.pid);
    if(p){ p.task.subtasks.push(b); dest='its step list under "'+String(p.task.title||'').slice(0,28)+'"' }
    else{
      place({id:b.id,title:b.title||'',done:!!b.done,subtasks:[]},{kind:'float',fid:state.floats[0].id});
      dest='the "'+state.floats[0].name+'" tab as its own task, since the task it belonged to is gone';
    }
  }else if(e.k==='float'){
    const tab={id:b.id,name:b.name||'Restored tab',tasks:arr(b.tasks)};
    state.floats.push(tab);
    /* gather back the tasks it held, if they are still floating rather than scheduled */
    let back=0;
    arr(e.moved).forEach(tid=>{
      const f=findTask(tid);
      if(f&&f.from.kind==='float'&&f.from.fid!==tab.id){ move(tid,{kind:'float',fid:tab.id}); back++ }
    });
    dest='Free Floating'+(back?', with '+back+(back===1?' task':' tasks')+' moved back into it':'');
  }else if(e.k==='folder'){
    const fl={id:b.id,name:b.name||'Restored folder'};
    state.folders.push(fl);
    /* gather back the notes it held, if they are still loose rather than refiled */
    let back=0;
    arr(e.moved).forEach(nid=>{
      const n=state.notes.find(x=>x.id===nid);
      if(n&&!n.folder){ n.folder=fl.id; back++ }
    });
    dest='Notes'+(back?', with '+back+(back===1?' note':' notes')+' moved back into it':'');
  }else if(e.k==='focus'){ state.focus.push(b); dest='True north' }
  else if(e.k==='habit'){ state.habits.list.push(b); dest='the Habits panel' }
  else if(e.k==='wtask'){ state.week.list.push(b); dest='the This week list' }
  else if(e.k==='note'){ state.notes.unshift(b); state.settings.noteSel=b.id; dest='Notes' }
  else return;
  save(); render();
  toast('Restored to '+dest);
  refreshBinModal();
}
function purgeBin(id){
  const e=state.bin[id]; if(!e||e.purged) return;
  state.bin[id]={at:e.at,purged:Date.now()};   /* keep a marker so the purge syncs, drop the body */
  save(); render(); refreshBinModal();
  toast('Gone for good');
}
function emptyBinNow(){
  Object.keys(state.bin).forEach(id=>{
    const e=state.bin[id];
    if(!e.purged) state.bin[id]={at:e.at,purged:Date.now()};
  });
  save(); render(); refreshBinModal();
  toast('Bin emptied');
}
function binWhere(e){
  if(e.k==='sub') return 'a step of "'+esc(String(e.pname||'a task').slice(0,28))+'"';
  if(e.k==='float'){
    const n=arr(e.body.tasks).length;
    return 'Free Floating'+(n?', holding '+n+(n===1?' task':' tasks'):'');
  }
  if(e.k==='focus') return 'True north';
  if(e.k==='habit') return 'the Habits panel';
  if(e.k==='wtask') return 'the This week list';
  if(e.k==='note') return 'Notes';
  if(e.k==='folder') return 'Notes, as a folder';
  const l=e.loc||{kind:'carry'};
  if(l.kind==='day'&&l.date)
    return (ZL[l.zone]||ZL.must)+' on '+DOW[new Date(l.date+'T12:00:00').getDay()]+' '+l.date;
  if(l.kind==='float'){ const f=float(l.fid); return f?'the "'+esc(f.name)+'" tab':'a tab that is gone' }
  return 'the carry-over tray';
}
function binMeta(e){
  const goneFor=Math.floor((Date.now()-e.at)/864e5);
  const left=Math.max(0,Math.ceil((BIN_KEEP-(Date.now()-e.at))/864e5));
  return binWhere(e)+' · deleted '+(goneFor?goneFor+'d ago':'today')+' · '+left+'d left';
}
function binBody(){
  const list=binList();
  let h='<h3>Bin</h3>'+

    'Restore puts it back where it came from, or the nearest place still standing.</p>';

  list.forEach(x=>{
    const e=x.e, name=e.k==='float'?(e.body.name||'a tab')

      '<button class="nbtn" data-action="bin-purge" data-id="'+x.id+'" title="Delete for good" aria-label="Delete for good">✕</button></div>';

/* ================= metrics ================= */
function tasksOn(d){
  const x=state.days[d]; if(!x) return [];
  return ZONES.flatMap(z=>(x[z]||[]));
}
function rangeDates(r){
  const n=r==='day'?1:r==='week'?7:30, out=[];
  for(let i=n-1;i>=0;i--) out.push(plus(-i));
  return out;
}
function tally(dates){
  let done=0,open=0;
  dates.forEach(d=>tasksOn(d).forEach(t=>t.done?done++:open++));
  return {done,open,total:done+open,pct:(done+open)?Math.round(done/(done+open)*100):0};
}
function streak(){
  let n=0;
  for(let i=0;i<400;i++){
    const d=plus(-i), list=tasksOn(d);
    if(i===0&&!list.length) continue;
    if(!list.length) break;
    if(list.every(t=>t.done)) n++; else break;
  }
  return n;
}
function monthTally(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), out=[];
  for(const d in state.days){
    const dt=new Date(d+'T12:00:00');
    if(dt.getFullYear()===y&&dt.getMonth()===m) out.push(d);
  }
  return tally(out);
}

/* ================= render: rail ================= */
/* An empty panel earns only its header bar: chevron, label, count. Clicking the header
   opens it (ui.peek) so something can be added; once it holds an item it renders
   expanded as always and the peek flag is dropped, so emptying it collapses it again.
   True north bends this one way on purpose: holding a current statement it is pinned
   open and the header offers no toggle and draws no chevron, since an affordance
   that cannot act reads worse than none. Only the empty panel collapses. Nothing
   about collapse is persisted for it, so a statement can never load hidden. */
function renderFocus(){
  /* internal names (state.focus, focus-* actions, the bin kind) predate the True
     north rename and must stay: renaming them would orphan saved data.
     ARCHIVE, owner may reverse (option b was chosen): "set aside" replaces the
     tick, reusing the same done/doneAt fields, so saved data and the dn-axis
     merge carry over untouched. To reverse to (a) no-archive: drop the aside
     branch of frow, the Set aside section below, and the focus-aside/focus-back/
     focus-toggle-done cases; no data migration needed either way. */
  const held=state.focus.filter(f=>!f.done), aside=state.focus.filter(f=>f.done);
  const isEmpty=!held.length;      /* set-aside statements do not pin the panel open */
  if(!isEmpty) delete ui.peek.focus;
  /* TWO FLAGS, ONE MEANING EACH, deliberately not merged. `ui.peek.focus` is the old
     one and is untouched: it opens an EMPTY panel so something can be added, and is
     dropped the moment the panel holds a statement. `ui.northOn` is Change 6: it says
     the panel is the one being used, and it gates the WORKING PARTS only, the add
     field and the Set aside archive. Keeping them apart is what lets the empty-panel
     collapse rule and the pinned-open rule both survive unchanged; one flag serving
     both meanings made emptying the panel leave it hanging open.
     Neither flag can reach the statement itself, so nothing hides a held statement.
     Both are memory-only, so nothing about either loads, saves or syncs, and a reload
     starts every panel at rest. */
  const active=!!ui.peek.focus||!!ui.northOn;
  const expanded=!isEmpty||!!ui.peek.focus;
  let h='<div class="kh'+(expanded?'':' solo')+'"'+
    (isEmpty?' data-action="panel-toggle" data-panel="focus"':'')+'>'+
    (isEmpty?CHEV(expanded):'')+
    'True north'+(isEmpty?'<span class="sp">not set</span>':'')+'</div>';
  if(expanded){
    h+=held.length?held.map(f=>frow(f)).join(''):'<div class="empty">Nothing held yet. A mindset, a quote, a line worth keeping in view.</div>';
    if(active){
      h+='<div class="fadd"><input id="fi" placeholder="A line to steer by…" data-enter="focus" autocomplete="off">'+
         '<button data-action="focus-add">Set</button></div>';
      if(aside.length){
        h+='<div class="fdone" data-action="focus-toggle-done">'+(state.settings.showDone?'▾':'▸')+' Set aside ('+aside.length+')</div>';
        if(state.settings.showDone) h+=aside.map(f=>frow(f)).join('');
      }
    }
  }
  $('#fpanel').innerHTML=h;
}
function frow(f){
  return '<div class="frow'+(f.done?' done':'')+'">'+
    '<div class="ftxt"><span data-action="focus-rename" data-id="'+f.id+'">'+esc(f.title)+'</span>'+
    (f.done&&f.doneAt?'<span class="fdate">held until '+f.doneAt+'</span>':'')+'</div>'+
    (f.done
      ?'<button class="mini" data-action="focus-back" data-id="'+f.id+'" title="Bring back" aria-label="Bring back">⤴</button>'
      :'<button class="mini" data-action="focus-aside" data-id="'+f.id+'" title="Set aside" aria-label="Set aside">⤵</button>')+
    '<button class="mini" data-action="focus-del" data-id="'+f.id+'" title="Remove" aria-label="Remove">✕</button></div>';
}
